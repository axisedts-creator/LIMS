      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: changed files
        run: git diff --name-only origin/main...HEAD > "$RUNNER_TEMP/changed.txt"
      - name: plan
        id: plan
        run: node tools/lint/ci-plan.ts --files "$RUNNER_TEMP/changed.txt" --job "$GITHUB_JOB" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.run == 'true'
        name: C4 copy scan
        run: node apps/web/src/features/billing/__tests__/copy-scan.mjs

  c8-no-commission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
