    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TRIGGER_PATHS: "apps/phlebo_app/lib/core/db/**"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: changed files
        run: git diff --name-only origin/main...HEAD > "$RUNNER_TEMP/changed.txt"
      - name: plan
        id: plan
        run: node tools/lint/ci-plan.ts --files "$RUNNER_TEMP/changed.txt" --job "$GITHUB_JOB" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.run == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: packages/ui-flutter/pubspec.yaml # C0 02-TRD §2.2 Flutter pin
      - if: steps.plan.outputs.run == 'true'
        name: enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - if: steps.plan.outputs.run == 'true'
        name: C17 DB forensics (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34 # [CONV] C17 02-TRD row names no API level
          arch: x86_64
          script: cd apps/phlebo_app && flutter test integration_test/db_forensics_test.dart
