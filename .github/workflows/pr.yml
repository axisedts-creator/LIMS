        run: git diff --name-only origin/main...HEAD > "$RUNNER_TEMP/changed.txt"
      - name: plan
        id: plan
        run: node tools/lint/ci-plan.ts --files "$RUNNER_TEMP/changed.txt" --job "$GITHUB_JOB" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.run == 'true'
        name: C2 service-key grep (CR-C2-014)
        run: node services/api/src/modules/identity/__tests__/ci/service-key-grep.mjs

  identity-no-dead-letter-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
