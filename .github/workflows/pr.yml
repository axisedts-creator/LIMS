      - if: steps.plan.outputs.run == 'true'
        name: C2 no core.dead_letters SQL (D-T12)
        run: node tools/lint/no-foreign-schema-sql.ts --fixture services/api/src/modules/identity/__tests__/ci/no-dead-letter-sql.fixture.json

  c3-wording-commission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TRIGGER_PATHS: "services/api/src/modules/catalog/** services/worker/src/jobs/catalog/** apps/web/src/features/catalog/** apps/web/src/app/(staff)/catalog/** docs/manual/catalog/**"
