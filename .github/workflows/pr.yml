      - if: steps.plan.outputs.run == 'true'
        name: C3 wording (CR-C3-009)
        run: bash services/api/src/modules/catalog/__tests__/ci/wording-grep.sh

  c04-copy-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TRIGGER_PATHS: "apps/web/src/features/{frontdesk,billing}/** services/renderer/templates/billing/** docs/manual/{frontdesk,billing}/**"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
