    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TRIGGER_PATHS: "services/** apps/** packages/**"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
