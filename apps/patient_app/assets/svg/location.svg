<svg width="64" height="90" viewBox="0 0 64 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#005C53"/>
      <stop offset="100%" stop-color="#9FC031"/>
    </linearGradient>

    <!-- Gloss highlight -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded cute marker shape -->
  <path d="M32 4
           C18 4 7 15 7 29
           C7 50 32 80 32 80
           C32 80 57 50 57 29
           C57 15 46 4 32 4Z"
        fill="url(#grad)" />

  <!-- Shine highlight -->
  <path d="M20 12
           C12 18 12 34 20 42
           C22 44 24 44 25 42
           C17 30 25 16 40 12
           C32 10 24 10 20 12Z"
        fill="url(#shine)"/>

  <!-- Center circle -->
  <circle cx="32" cy="30" r="11" fill="white"/>
</svg>
