            - invoices_cancelled
            - gross_paisa
            - discount_paisa
            - exempt_paisa
            - taxable_paisa
            - vat_paisa
            - other_tax_paisa
            - invoiced_paisa
            - credit_notes_paisa
            - net_sales_paisa
          properties:
            invoices_issued:
              $ref: "#/components/schemas/Count"
            invoices_cancelled:
              $ref: "#/components/schemas/Count"
            gross_paisa:
