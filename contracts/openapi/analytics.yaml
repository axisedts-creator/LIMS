# contracts/openapi/analytics.yaml (C8) — transcription of spec/chunks/C8-analytics-mis/02-TRD.md §5 (30 ops), §5.1 shapes, §10 exports (T0C-10.C8; AC-0C-1.4/1.5).
# Generated once from the TRD tables, then owned by C8. Notes:
# - Examples are synthetic (uuids 0193c4a0-0000-7000-8000-…, "Synthetic …" labels).
# - [CONV] "allOf ReportEnvelope + {…}" is flattened: each report schema repeats the envelope fields (closed objects cannot be combined with allOf).
#   QualityIndicatorsReport / DeliveryReport hold the report fields only; their operations return envelope + those fields inline.
# - [CONV] every operation also lists auth.unauthenticated, common.rate_limited, common.internal; error responses derive from errors.yaml http.
# - [CONV] #17 searchAnalyticsReferrers = E3 (read-only POST, LD-10). Optional-idempotency ops (#19, #27, #28) declare no Idempotency-Key header (as reporting.yaml).
# - [CONV] shapes the TRD leaves open: Count/Paisa/Bp/Seconds/SignedInt bounds, rejections/deliveries/releases rows ≤ 5000, ReportRunSummary {id, created_at, period},
#   ScheduleDetailDto (= ScheduleDto + runs ≤ 20), agent state free text ≤ 32, list limit default 20 on #21/#24, Freshness list ≤ 50.
openapi: 3.0.3
info:
  title: LIMS analytics (C8)
  version: 1.0.0
  description: Transcribed from spec/chunks/C8-analytics-mis/02-TRD.md §5, §5.1, §10 (T0C-10.C8).
