components:
  schemas:
    Count:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Count (integer ≥ 0).
    SignedInt:
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
      description: "[CONV] signed count or tile value (net figures may be negative)."
    Paisa:
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
      description: Integer paisa (may be negative where stated).
    Bp:
      type: integer
      minimum: 0
      maximum: 1000000
      description: Basis points (0–1,000,000).
    Seconds:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Duration in seconds (≥ 0).
    Period:
      type: object
      additionalProperties: false
      required:
        - business_date_from
        - business_date_to
        - days
        - label_ad
        - label_bs
        - timezone
      properties:
        business_date_from:
          $ref: _common.yaml#/components/schemas/IsoDate
        business_date_to:
          $ref: _common.yaml#/components/schemas/IsoDate
        days:
          type: integer
          minimum: 1
          maximum: 3660
        label_ad:
          type: string
          maxLength: 64
        label_bs:
          type: string
          maxLength: 64
        bs_month:
          type: string
          maxLength: 7
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        fiscal_year_bs:
          type: string
          maxLength: 7
          pattern: ^[0-9]{4}/[0-9]{2}$
        timezone:
          type: string
          maxLength: 14
          enum:
            - Asia/Kathmandu
    ScopeEcho:
      type: object
      additionalProperties: false
      required:
        - all_centres
        - centre_ids
        - tenant_wide_sections_hidden
      properties:
        all_centres:
          type: boolean
        centre_ids:
          type: array
          maxItems: 50
          items:
            $ref: _common.yaml#/components/schemas/Uuid
        tenant_wide_sections_hidden:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 64
            minLength: 1
            pattern: ^[a-z][a-z0-9_]*$
            x-coded-set: analytics.families
    Freshness:
      type: object
      additionalProperties: false
      required:
        - family
        - is_stale
        - live
      properties:
        family:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9_]*$
          x-coded-set: analytics.families
        refreshed_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        is_stale:
          type: boolean
        stale_reason:
          type: string
          maxLength: 15
          enum:
            - refresh_lagging
            - refresh_failed
            - never_refreshed
        live:
          type: boolean
    ReportEnvelope:
      type: object
      additionalProperties: false
      required:
        - report_code
        - period
        - scope
        - freshness
        - generated_at
      properties:
        report_code:
          type: string
          maxLength: 32
          minLength: 1
          pattern: ^[a-z][a-z0-9_]*$
          x-coded-set: analytics.g_cs_report_codes
        period:
          $ref: "#/components/schemas/Period"
        scope:
          $ref: "#/components/schemas/ScopeEcho"
        freshness:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Freshness"
        generated_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
    GroupKey:
      type: object
      additionalProperties: false
      required:
        - key
        - label
      properties:
        key:
          type: string
          maxLength: 64
        label:
          type: string
          maxLength: 200
        label_bs:
          type: string
          maxLength: 32
        is_inactive:
          type: boolean
    Tile:
      type: object
      additionalProperties: false
      required:
        - unit
        - value
      properties:
        value:
          $ref: "#/components/schemas/SignedInt"
        previous:
          $ref: "#/components/schemas/SignedInt"
        delta:
          $ref: "#/components/schemas/SignedInt"
        delta_bp:
          type: integer
          format: int64
          minimum: -9007199254740991
          maximum: 9007199254740991
        unit:
          type: string
          maxLength: 7
          enum:
            - count
            - paisa
            - seconds
    DashboardDto:
      type: object
      additionalProperties: false
      required:
        - report_code
        - period
        - scope
        - freshness
        - generated_at
        - tiles
        - series
        - department_top
      properties:
        report_code:
          type: string
          maxLength: 32
          minLength: 1
          pattern: ^[a-z][a-z0-9_]*$
          x-coded-set: analytics.g_cs_report_codes
        period:
          $ref: "#/components/schemas/Period"
        scope:
          $ref: "#/components/schemas/ScopeEcho"
        freshness:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Freshness"
        generated_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        tiles:
          type: object
          additionalProperties: false
          required:
            - patient_visits
            - new_patients
            - net_orders
            - tests_ordered
            - net_sales_paisa
            - invoiced_paisa
            - credit_notes_paisa
            - results_approved
            - reports_pending
            - reports_ready_unreleased
            - pending_tests
            - pending_overdue
          properties:
            patient_visits:
              $ref: "#/components/schemas/Tile"
            new_patients:
              $ref: "#/components/schemas/Tile"
            net_orders:
              $ref: "#/components/schemas/Tile"
            tests_ordered:
              $ref: "#/components/schemas/Tile"
            net_sales_paisa:
              $ref: "#/components/schemas/Tile"
            invoiced_paisa:
              $ref: "#/components/schemas/Tile"
            credit_notes_paisa:
              $ref: "#/components/schemas/Tile"
            results_approved:
              $ref: "#/components/schemas/Tile"
            net_collected_paisa:
              $ref: "#/components/schemas/Tile"
            reports_pending:
              $ref: "#/components/schemas/Tile"
            reports_ready_unreleased:
              $ref: "#/components/schemas/Tile"
            pending_tests:
              $ref: "#/components/schemas/Tile"
            pending_overdue:
              $ref: "#/components/schemas/Tile"
        series:
          type: object
          additionalProperties: false
          required:
            - days
          properties:
            days:
              type: array
              maxItems: 366
              items:
                type: object
                additionalProperties: false
                required:
                  - business_date
                  - net_sales_paisa
                  - patient_visits
                  - net_orders
                properties:
                  business_date:
                    $ref: _common.yaml#/components/schemas/IsoDate
                  net_sales_paisa:
                    $ref: "#/components/schemas/Paisa"
                  patient_visits:
                    $ref: "#/components/schemas/Count"
                  net_orders:
                    $ref: "#/components/schemas/SignedInt"
        department_top:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required:
              - label
              - is_multiple
              - net_paisa
              - share_bp
            properties:
              department_id:
                $ref: _common.yaml#/components/schemas/Uuid
              label:
                type: string
                maxLength: 200
              is_multiple:
                type: boolean
              net_paisa:
                $ref: "#/components/schemas/Paisa"
              share_bp:
                $ref: "#/components/schemas/Bp"
    IncomeRow:
      type: object
      additionalProperties: false
      required:
        - key
        - label
        - invoices_issued
        - invoices_cancelled
        - gross_paisa
        - discount_paisa
        - exempt_paisa
        - taxable_paisa
        - vat_paisa
        - other_tax_paisa
        - invoiced_paisa
        - credit_notes_paisa
        - net_sales_paisa
      properties:
        key:
          type: string
          maxLength: 64
        label:
          type: string
          maxLength: 200
        label_bs:
          type: string
          maxLength: 32
        is_inactive:
          type: boolean
        invoices_issued:
          $ref: "#/components/schemas/Count"
        invoices_cancelled:
          $ref: "#/components/schemas/Count"
        gross_paisa:
          $ref: "#/components/schemas/Paisa"
        discount_paisa:
          $ref: "#/components/schemas/Paisa"
        exempt_paisa:
          $ref: "#/components/schemas/Paisa"
        taxable_paisa:
          $ref: "#/components/schemas/Paisa"
        vat_paisa:
          $ref: "#/components/schemas/Paisa"
        other_tax_paisa:
          $ref: "#/components/schemas/Paisa"
        invoiced_paisa:
          $ref: "#/components/schemas/Paisa"
        credit_notes_paisa:
          $ref: "#/components/schemas/Paisa"
        net_sales_paisa:
          $ref: "#/components/schemas/Paisa"
    IncomeReport:
      type: object
      additionalProperties: false
      required:
        - report_code
        - period
        - scope
        - freshness
        - generated_at
        - rows
        - totals
        - basis_note_key
      properties:
        report_code:
          type: string
          maxLength: 32
