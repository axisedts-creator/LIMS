# contracts/openapi/anatomic.yaml (C11) — transcription of spec/chunks/C11-specialty-pathology/02-TRD.md §5 (A1–A12, M1–M15, R1–R10, I1–I4, Q1–Q7, K1–K22),
# §5.7 (response field lists), §4.5.1 (SynopticDefinitionV1), §10.2 (settings); 70 ops (T0C-10.C11; AC-0C-1.4/1.5).
# LD-103 (2026-11-11): wave-2 transcription scheduled by the human lead; owner approval given by that decision. Generated once from the TRD tables, then owned by C11.
# Notes:
# - Examples are synthetic (uuids 01950c11-0000-7000-8000-…, "Synthetic …" text, SYN_/syn_ codes, labels SP26-…).
# - Every op lists the eight TRD §5 always-possible codes; R ops add the Idempotency-Key header + three idempotency codes; If-Match rows add
#   common.precondition_required + common.version_conflict; case.signout / config.manage (privileged) ops add auth.mfa_required. "(CR)" in the TRD is provenance only.
#   Error responses derive from errors.yaml http. R3/R10 list the propagated lab.* codes (LabPort consumer, P-23). anatomic.image_not_ready is retired (TRD §13) and not used.
# - [CONV] Success status 201/204 only where the TRD gives it; otherwise 200. A2 is a read-only POST (E3).
# - [CONV] Coded sets use the <module>.<set> form (anatomic.cancel_reasons, anatomic.stains, anatomic.cytology_adequacy, anatomic.diagnoses) with the
#   K12 code pattern; R4 reason_code is a C5 amendment reason checked for format only (pattern, no coded set). Enums from 05-SCHEMA §2.1 CHECKs.
# - [CONV] Composite DTOs (CaseDetail, StainOrderRow, BlockRow, BatchDetail, ReportVersion, SynopticTemplate) are flat copies of their base fields
#   (closed schemas cannot be combined with allOf). ReportVersion content columns follow 05-SCHEMA §5.
# - [CONV] Synoptic instance `values` (ReportDraftInput / ReportDraft) is a closed object: lint rule 3 cannot express the field_key map in OAS 3.0.
#   Non-blocking CR: .orchestra/cr/T0C-10.C11.nonblocking.md.
# - [CONV] Unbounded lists given a bound: CaseDetail blocks ≤1000, slides ≤2000, stain_orders ≤500, images ≤200; K6 ≤1000, K8 ≤500.
openapi: 3.0.3
info:
  title: LIMS specialty pathology (C11)
  version: 1.0.0
  description: Transcribed from spec/chunks/C11-specialty-pathology/02-TRD.md §5–§5.7 (T0C-10.C11, LD-103).
paths:
  /v1/anatomic/cases:
    get:
      operationId: listAnatomicCases
      tags:
        - anatomic
      summary: List pathology cases (worklist) (TRD §5 A1)
      security:
        - bearerJwt: []
      x-permission: anatomic.case.read
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.unauthenticated
        - auth.forbidden
        - auth.account_locked
        - auth.session_expired
        - common.rate_limited
        - common.internal
        - common.invalid_cursor
      parameters:
        - name: queue
          in: query
          required: false
          schema:
            type: string
            maxLength: 12
            enum:
              - to_accession
              - grossing
              - bench
              - reporting
              - awaiting_lab
              - signed_out
              - cancelled
              - all
            default: all
        - name: case_kind
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^(histology|cytology|ihc|molecular)(,(histology|cytology|ihc|molecular))*$
          description: csv of case kinds
        - name: centre_id
          in: query
          required: false
          schema:
            type: string
            minLength: 36
            maxLength: 739
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(,[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}){0,19}$
          description: csv of centre uuids (≤20)
        - name: priority
          in: query
          required: false
          schema:
            type: string
            maxLength: 7
            enum:
              - routine
              - urgent
        - name: assigned_pathologist
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 36
            pattern: ^(me|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$
          description: "`me` or a membership uuid"
        - name: received_at_from
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: received_at_to
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: sort
          in: query
          required: false
          schema:
            type: string
            maxLength: 20
            enum:
              - received_at
              - -received_at
              - accessioned_at
              - -accessioned_at
              - priority_received_at
            default: priority_received_at
          description: priority_received_at = urgent first, then oldest
        - $ref: _common.yaml#/components/parameters/Limit
        - $ref: _common.yaml#/components/parameters/Cursor
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/CaseSummary"
                  page:
                    $ref: _common.yaml#/components/schemas/PageInfo
              examples:
                synthetic:
                  value:
                    data:
                      - id: 01950c11-0000-7000-8000-000000000001
                        accession_no: SP26-000123
                        case_kind: histology
                        status: received
                        priority: routine
                        centre_id: 01950c11-0000-7000-8000-000000000002
                        order_id: 01950c11-0000-7000-8000-000000000003
                        patient_id: 01950c11-0000-7000-8000-000000000004
                        patient:
                          display_name: Synthetic Pathologist
                          sex: Synthetic sex
                          age_text: Synthetic age_text
                          patient_code: Synthetic patient_code
                        test_names:
                          - Synthetic test_names
                        part_count: 1
                        received_at: 2026-01-15T08:30:00.000Z
                        accessioned_at: 2026-01-15T08:30:00.000Z
                        signed_out_at: 2026-01-15T08:30:00.000Z
                        assigned_pathologist:
                          membership_id: 01950c11-0000-7000-8000-000000000005
                          display_name: Synthetic Pathologist
                        flags:
                          profile_missing: true
                          specimen_rejected: true
                          open_change: true
                          pending_stain_orders: 1
                          parts_missing_site: true
                        version: 1
                    page:
                      next_cursor: Synthetic next_cursor
                      limit: 1
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
  /v1/anatomic/cases/lookup:
    post:
      operationId: lookupAnatomicObject
      tags:
        - anatomic
      summary: Resolve an accession, block or slide label (TRD §5 A2)
      security:
        - bearerJwt: []
      x-permission: anatomic.case.read
      x-context: tenant
      x-idempotency: none
      x-idempotency-justification: "E3 read-only POST: the label travels in the body, not the URL (REQ-SEC-098); no state change."
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.unauthenticated
        - auth.forbidden
        - auth.account_locked
        - auth.session_expired
        - common.rate_limited
        - common.internal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - label
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 32
                  pattern: ^[A-Z0-9-]{1,32}$
              description: Label in the body, not the URL (REQ-SEC-098).
            examples:
              synthetic:
                value:
                  label: SP26-000123
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - object_kind
                  - case_id
                properties:
                  object_kind:
                    type: string
                    maxLength: 5
                    enum:
                      - case
                      - block
                      - slide
                  case_id:
                    $ref: _common.yaml#/components/schemas/Uuid
                  block_id:
                    $ref: _common.yaml#/components/schemas/Uuid
                  slide_id:
                    $ref: _common.yaml#/components/schemas/Uuid
              examples:
                synthetic:
                  value:
                    object_kind: case
                    case_id: 01950c11-0000-7000-8000-000000000006
                    block_id: 01950c11-0000-7000-8000-000000000007
                    slide_id: 01950c11-0000-7000-8000-000000000008
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
