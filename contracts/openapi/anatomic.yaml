        - name: image_id
          in: path
          required: true
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
      responses:
        "200":
          description: Re-encoded image bytes (P-2 exception I1, 08 A17 D-67). Every call writes access-log anatomic_image.view.
          headers:
            Content-Type:
              description: The stored mime_type (never client-supplied).
              schema:
                type: string
                maxLength: 10
                enum:
                  - image/png
                  - image/jpeg
            Content-Disposition:
              description: inline; filename="<image_id>.<ext>"
              schema:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^inline; filename="[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.(png|jpg)"$
            X-Content-Type-Options:
              schema:
                type: string
                maxLength: 7
                enum:
                  - nosniff
            Content-Security-Policy:
              schema:
                type: string
                maxLength: 27
                enum:
                  - default-src 'none'; sandbox
            Cache-Control:
              schema:
                type: string
                maxLength: 8
                enum:
                  - no-store
          content:
            image/png:
              schema:
                type: string
                format: binary
                maxLength: 15728640
              examples:
                synthetic:
                  value: synthetic-png-bytes
            image/jpeg:
              schema:
                type: string
                format: binary
                maxLength: 15728640
              examples:
                synthetic:
                  value: synthetic-jpeg-bytes
