components:
  schemas:
    Actor:
      type: object
      additionalProperties: false
      required:
        - membership_id
        - display_name
      properties:
        membership_id:
          $ref: _common.yaml#/components/schemas/Uuid
        display_name:
          type: string
          maxLength: 200
    Totals:
      type: object
      additionalProperties: false
      required:
        - gross
        - discount
        - exempt
        - taxable
        - vat
        - other_tax
        - net
      properties:
        gross:
          $ref: _common.yaml#/components/schemas/Money
        discount:
          $ref: _common.yaml#/components/schemas/Money
        exempt:
          $ref: _common.yaml#/components/schemas/Money
        taxable:
          $ref: _common.yaml#/components/schemas/Money
        vat:
          $ref: _common.yaml#/components/schemas/Money
        other_tax:
          $ref: _common.yaml#/components/schemas/Money
        net:
          $ref: _common.yaml#/components/schemas/Money
    CodedSetEntry:
      type: object
      additionalProperties: false
      required:
        - code
        - display
        - sort_order
      properties:
        code:
          type: string
          maxLength: 64
          minLength: 1
        display:
          type: string
          maxLength: 200
        sort_order:
          type: integer
          minimum: 0
          maximum: 32767
    CodedSetList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/CodedSetEntry"
    OrderBalanceDto:
      type: object
      additionalProperties: false
      required:
        - order_id
        - invoiced
        - paid
        - credited
        - balance_due
        - balance_version
        - as_of
      properties:
        order_id:
          $ref: _common.yaml#/components/schemas/Uuid
        invoiced:
          $ref: _common.yaml#/components/schemas/Money
        paid:
          $ref: _common.yaml#/components/schemas/Money
        credited:
          $ref: _common.yaml#/components/schemas/Money
        balance_due:
          $ref: _common.yaml#/components/schemas/Money
        balance_version:
          type: integer
          minimum: 0
          maximum: 2147483647
        as_of:
          $ref: _common.yaml#/components/schemas/IsoUtc
    Party:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 200
        pan:
          type: string
          maxLength: 32
        address:
          type: string
          maxLength: 300
    InvoiceLine:
      type: object
      additionalProperties: false
      required:
        - id
        - line_no
        - line_kind
        - code
        - name
        - quantity
        - unit_price
        - gross
        - discount
        - exempt
        - taxable
        - vat
        - other_tax
        - net
        - credited
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuid
        line_no:
          type: integer
          minimum: 1
          maximum: 1000
        line_kind:
          type: string
          maxLength: 32
        orderable_id:
          $ref: _common.yaml#/components/schemas/Uuid
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 200
        department_id:
          $ref: _common.yaml#/components/schemas/Uuid
        hs_code:
          type: string
          maxLength: 16
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
        unit_price:
          $ref: _common.yaml#/components/schemas/Money
        gross:
          $ref: _common.yaml#/components/schemas/Money
        discount:
          $ref: _common.yaml#/components/schemas/Money
        exempt:
          $ref: _common.yaml#/components/schemas/Money
        taxable:
          $ref: _common.yaml#/components/schemas/Money
        vat:
          $ref: _common.yaml#/components/schemas/Money
        other_tax:
          $ref: _common.yaml#/components/schemas/Money
        other_tax_code:
          type: string
          maxLength: 32
        net:
          $ref: _common.yaml#/components/schemas/Money
        credited:
          $ref: _common.yaml#/components/schemas/Money
    InvoiceDto:
      type: object
      additionalProperties: false
      required:
        - id
        - invoice_no
        - invoice_seq
        - series
        - fiscal_year_bs
        - invoice_kind
        - status
        - is_active
        - issued_at
        - invoice_date_bs
        - branch_id
        - is_periodic_credit_bill
        - buyer
        - seller
        - lines
        - totals
        - credited_total
        - print_count
        - cbms_state
        - version
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuid
        invoice_no:
          type: string
          maxLength: 64
        invoice_seq:
          type: integer
          minimum: 1
          maximum: 2147483647
        series:
          type: string
          maxLength: 64
        fiscal_year_bs:
          type: string
          maxLength: 9
          pattern: ^[0-9]{4}/[0-9]{2}$
        invoice_kind:
          type: string
          maxLength: 32
        status:
          type: string
          maxLength: 32
        is_active:
          type: boolean
        issued_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        invoice_date_bs:
          type: string
          maxLength: 10
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        branch_id:
          $ref: _common.yaml#/components/schemas/Uuid
        centre_id:
          $ref: _common.yaml#/components/schemas/Uuid
        order_id:
          $ref: _common.yaml#/components/schemas/Uuid
        credit_party_id:
          $ref: _common.yaml#/components/schemas/Uuid
        is_periodic_credit_bill:
          type: boolean
          default: false
        referrer_id:
          $ref: _common.yaml#/components/schemas/Uuid
        buyer:
          $ref: "#/components/schemas/Party"
        seller:
          $ref: "#/components/schemas/Party"
        lines:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/InvoiceLine"
        totals:
          $ref: "#/components/schemas/Totals"
        credited_total:
          $ref: _common.yaml#/components/schemas/Money
        cancellation:
          type: object
          additionalProperties: false
          required:
            - cancelled_at
            - cancelled_by_display
            - reason_code
            - credit_note_id
            - credit_note_no
          properties:
            cancelled_at:
              $ref: _common.yaml#/components/schemas/IsoUtc
            cancelled_by_display:
              type: string
              maxLength: 200
            reason_code:
              type: string
              maxLength: 64
            reason_text:
              type: string
              maxLength: 500
            credit_note_id:
              $ref: _common.yaml#/components/schemas/Uuid
            credit_note_no:
              type: string
              maxLength: 64
        print_count:
          type: integer
          minimum: 0
          maximum: 2147483647
        last_printed_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        cbms_state:
          type: string
          maxLength: 32
        cbms_cancel_state:
          type: string
          maxLength: 32
        version:
          $ref: _common.yaml#/components/schemas/Version
    LedgerEntryDto:
      type: object
      additionalProperties: false
      required:
        - id
        - entry_kind
        - capture_kind
        - method_code
        - amount
        - created_at
        - business_date_bs
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuid
        entry_kind:
          type: string
          maxLength: 8
          enum:
            - payment
            - reversal
            - refund
        capture_kind:
          type: string
          maxLength: 15
          enum:
            - manual
            - gateway
            - home_collection
        order_id:
          $ref: _common.yaml#/components/schemas/Uuid
        invoice_id:
          $ref: _common.yaml#/components/schemas/Uuid
        credit_party_id:
          $ref: _common.yaml#/components/schemas/Uuid
        method_code:
          type: string
          maxLength: 64
        amount:
          $ref: _common.yaml#/components/schemas/Money
        reference_masked:
          type: string
          maxLength: 100
        receipt_no:
          type: string
          maxLength: 64
        reverses_entry_id:
          $ref: _common.yaml#/components/schemas/Uuid
