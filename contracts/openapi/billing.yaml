  /v1/billing/invoices/{invoice_id}/print:
    post:
      operationId: printInvoice
      tags:
        - billing
      summary: Print an invoice
      description: "Access log invoice.print. Optional style (T0C-PRINTCFG-1, LD-316): full (default) prints with the invoice print profile; plain_bw prints the plain black and white tax bill (PAN bill): black on white only, no logo, no colour, no shading, no header and no footer text; the body keeps the lines a tax bill needs (lab name, address, seller PAN, bill number and date). The print record stores the style used."
      security:
        - bearerJwt: []
      x-permission: billing.invoice.reprint
      x-context: tenant
      x-idempotency: required
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.idempotency_key_reused
      parameters:
