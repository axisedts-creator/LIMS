# contracts/openapi/billing.yaml (C4) — transcription of spec/chunks/C4-frontdesk-billing/02-TRD.md §5.2 (T0C-10.C4; AC-0C-1.4/1.5).
# Generated once from the TRD tables, then owned by C4. Notes:
# - Examples are synthetic. E-mail fields show the placeholder "<synthetic-email>" (lint AB-20); phones use +1555 test numbers.
# - [CONV] IM rows also list common.version_conflict + common.precondition_required (02-CV §4.2); required-idem rows list common.idempotency_key_reused.
# - [CONV] shapes the TRD names without fields are marked [CONV] in their description.
openapi: 3.0.3
info:
  title: LIMS billing (C4)
  version: 1.0.0
  description: Transcribed from spec/chunks/C4-frontdesk-billing/02-TRD.md §5 (T0C-10.C4).
paths:
  /v1/billing/invoices:
    get:
      operationId: listInvoices
      tags:
        - billing
      summary: List invoices
      security:
        - bearerJwt: []
      x-permission: billing.invoice.read
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.invalid_cursor
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            maxLength: 32
        - name: centre_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: issued_at_from
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: issued_at_to
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: fiscal_year_bs
          in: query
          required: false
          schema:
            type: string
            maxLength: 9
            pattern: ^[0-9]{4}/[0-9]{2}$
        - name: order_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: credit_party_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: invoice_no
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: sort
          in: query
          required: false
          schema:
            type: string
            maxLength: 12
            enum:
              - -issued_at
              - issued_at
              - invoice_seq
              - -invoice_seq
          description: Leading `-` = descending; `id` is always appended (02-CV §4.4).
        - $ref: _common.yaml#/components/parameters/Cursor
        - $ref: _common.yaml#/components/parameters/Limit
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceSummaryPage"
              examples:
                synthetic:
                  value:
                    data:
                      - id: 0193c4a0-0000-7000-8000-000000000501
                        invoice_no: 2082/83-000001
                        invoice_seq: 1
                        fiscal_year_bs: 2082/83
                        invoice_kind: Synthetic invoice_kind
                        status: Synthetic status
                        issued_at: 2026-11-05T04:15:00.000Z
                        invoice_date_bs: 2082-07-19
                        centre_id: 0193c4a0-0000-7000-8000-000000000502
                        order_id: 0193c4a0-0000-7000-8000-000000000503
                        credit_party_id: 0193c4a0-0000-7000-8000-000000000504
                        buyer_name: Synthetic buyer_name
                        net:
                          amount_paisa: 150000
                          currency: NPR
                        cbms_state: pending
                    page:
                      limit: 50
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
