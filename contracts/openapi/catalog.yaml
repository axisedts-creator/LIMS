  /v1/catalog/test-import-batches/{batch_id}/commit:
    post:
      operationId: commitCatalogImport
      tags:
        - catalog
      summary: Commit a validated Excel test import atomically (all rows or none) as DRAFTS; never publishes
      description: >-
        Requires If-Match (the batch version) and the explicit confirm flag. Writes every row of the normalized workbook of a validated batch in one transaction:
        all rows or none. Imported tests, analyte versions and reference range sets are created as DRAFTS only; the import never publishes, so the pathologist
        sign-off (publish permission, publishAnalyteVersion and publishReferenceRangeSet) still decides what goes live (LD-318). A rejected batch (it has errors)
        cannot be committed (catalog.import_has_errors); a batch older than 24 hours cannot be committed (catalog.import_batch_expired); a batch that is already committed
        returns catalog.import_already_committed. T0C-TESTIMPORT-1.
      security:
        - bearerJwt: []
      x-permission: catalog.test.manage
      x-context: tenant
      x-idempotency: required
      x-rate-limit-tier: general
      x-error-codes:
        - common.precondition_required
        - common.version_conflict
        - common.idempotency_key_reused
        - catalog.import_has_errors
        - catalog.import_batch_expired
        - catalog.import_already_committed
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - $ref: _common.yaml#/components/parameters/IfMatch
        - $ref: _common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogImportCommit"
            examples:
              synthetic:
                value:
                  confirm: true
      responses:
        "201":
          description: Created (DRAFTS only; nothing published).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImportCommitResult"
              examples:
                synthetic:
                  value:
                    batch:
                      id: 0193c4a0-0000-7000-8000-000000000631
                      file_name: tests-synthetic.xlsx
                      file_sha256: abababababababababababababababababababababababababababababababab
                      template_version: "1"
                      mode: create_only
                      status: committed
                      counts:
                        tests: 2
                        analytes: 5
                        ranges: 12
                        panels: 1
                        errors: 0
                      created_by: 0193c4a0-0000-7000-8000-000000000603
                      created_at: 2026-11-17T10:00:00.000Z
                      validated_at: 2026-11-17T10:00:02.000Z
                      committed_at: 2026-11-17T10:10:00.000Z
                      committed_by: 0193c4a0-0000-7000-8000-000000000603
                      version: 2
                    created:
                      tests: 2
                      analytes: 5
                      ranges: 12
                      panels: 1
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "409":
          description: Version conflict, the batch has errors, is expired or is already committed.
          content:
            application/problem+json:
              schema:
                $ref: _common.yaml#/components/schemas/Problem
              examples:
                version_conflict:
                  value:
                    type: urn:lims:error:common.version_conflict
                    title: Version conflict
                    status: 409
                    code: common.version_conflict
                    request_id: 01933b6f-0a11-7e2b-8c55-1d2e3f405162
                import_has_errors:
                  value:
                    type: urn:lims:error:catalog.import_has_errors
                    title: Import batch has errors
                    status: 409
                    code: catalog.import_has_errors
                    request_id: 01933b6f-0a11-7e2b-8c55-1d2e3f405162
                import_batch_expired:
