    # ---------- T0C-PRICETOOLS-1 (LD-321) price list tools ----------
    PriceListImportForm:
      type: object
      additionalProperties: false
      description: "Multipart body of dryRunPriceListImport: one xlsx only file (magic bytes checked; never xlsm, xls or macros), at most 5 MB and 5000 rows."
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          minLength: 1
          maxLength: 5242880
          description: xlsx only, at most 5 MB (5242880 bytes)
    PriceListImportSummary:
      type: object
      additionalProperties: false
      description: Counts of a batch compared with the list's current version.
      properties:
        rows:
          type: integer
          minimum: 0
          maximum: 5000
        added:
          type: integer
          minimum: 0
          maximum: 5000
        changed:
          type: integer
          minimum: 0
          maximum: 5000
        unchanged:
          type: integer
          minimum: 0
          maximum: 5000
        errors:
          type: integer
          minimum: 0
          maximum: 50000
    PriceListImportBatch:
      type: object
      additionalProperties: false
      description: One upload of a price list workbook (xlsx); history, never deleted. Prices are integer paisa, never floats.
      required:
        - id
        - price_list_id
        - status
        - row_count
        - error_count
        - file_sha256
        - summary
        - created_at
        - created_by
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuid
        price_list_id:
          $ref: _common.yaml#/components/schemas/Uuid
        status:
          type: string
          maxLength: 9
          enum:
            - dry_run
            - committed
            - failed
            - cancelled
        row_count:
          type: integer
          minimum: 0
          maximum: 5000
        error_count:
          type: integer
          minimum: 0
          maximum: 50000
        file_sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
        summary:
          $ref: "#/components/schemas/PriceListImportSummary"
        result_price_list_version_id:
          $ref: _common.yaml#/components/schemas/Uuid
        created_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        created_by:
          $ref: _common.yaml#/components/schemas/Uuid
    PriceListImportError:
      type: object
      additionalProperties: false
      description: One error of an xlsx price list upload, with its row and column; all errors are returned together.
      required:
        - row_no
        - column
        - code
        - message
      properties:
        row_no:
          type: integer
          minimum: 1
          maximum: 1048576
        column:
          type: string
          minLength: 1
          maxLength: 40
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 300
    PriceListImportDryRun:
      type: object
      additionalProperties: false
      description: The dry run batch of an xlsx upload and all errors together (row and column each); the dry run writes no price.
      required:
        - batch
        - errors
      properties:
        batch:
          $ref: "#/components/schemas/PriceListImportBatch"
        errors:
          type: array
          maxItems: 50000
          items:
            $ref: "#/components/schemas/PriceListImportError"
    CatalogImportForm:
      type: object
      additionalProperties: false
      description: >-
        Multipart body of validateCatalogImport (T0C-TESTIMPORT-1, LD-318): one xlsx only file (checked by magic bytes; never xlsm, never xls, no macros,
        no external links), at most 5 MB and 5000 rows per sheet; the server parses and validates it, never the browser. mode create_only (default) refuses a test code
        that already exists; update adds new DRAFT versions to existing tests.
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          minLength: 1
          maxLength: 5242880
          description: xlsx only, at most 5 MB (5242880 bytes), 5000 rows per sheet
        mode:
          type: string
          maxLength: 11
          enum:
            - create_only
            - update
          default: create_only
    CatalogImportCounts:
      type: object
      additionalProperties: false
      description: Counts of an Excel test import batch (rows found per kind and the number of errors).
      required:
        - tests
        - analytes
        - ranges
        - panels
        - errors
      properties:
        tests:
          type: integer
          minimum: 0
          maximum: 5000
        analytes:
          type: integer
          minimum: 0
          maximum: 5000
        ranges:
          type: integer
          minimum: 0
          maximum: 5000
        panels:
          type: integer
          minimum: 0
          maximum: 5000
        errors:
          type: integer
          minimum: 0
          maximum: 1000
    CatalogImportBatch:
      type: object
      additionalProperties: false
      description: >-
        One upload of the Excel test import workbook (xlsx); history, never deleted. status validated (no error, committable within 24 hours), rejected (it has errors),
        committed or expired (older than 24 hours, never committed). The normalized JSON of the workbook is kept by the server and not returned. version is the ETag for If-Match.
      required:
        - id
        - file_name
