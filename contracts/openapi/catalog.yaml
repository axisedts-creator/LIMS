      description: >-
        Validates the uploaded workbook and records a batch with status dry_run and every error; it writes no price (commitPriceListImport does, into a DRAFT).
        IMPORT RULES: xlsx only, checked by magic bytes (a ZIP container with an OOXML workbook part); never xlsm, never xls, no macros (a vbaProject part is rejected);
        external links are rejected; at most 5000 rows and 5 MB.
        Every price is given in rupees with at most 2 decimals and is converted exactly to integer paisa (decimal string arithmetic, never floats); a price below 0 is rejected.
        The test code exists and is active in this tenant; a duplicate test code in the file is rejected (every occurrence is reported).
        Text cells starting with = + - or @ are rejected (formula injection). The test name column is read only and ignored.
        All errors are returned together, each with its row and column; nothing is stopped at the first error. LD-321.
