      operationId: replacePriceListAssignments
      tags:
        - catalog
      summary: Replace the owners assigned to a price list
      description: >-
        Sets the owners of the list for one period: effective_from (default now) and effective_to (absent = open ended) apply to every owner_id in the call.
        T0C-PRICETOOLS-1 (LD-321): one party (credit party, referrer or centre) may hold several lists over time, but two assignments of one party never overlap
        in time, whatever the list; an overlap is refused with 409 (catalog.code_duplicate) and nothing is changed. Periods with a gap between them are allowed.
      security:
        - bearerJwt: []
      x-permission: catalog.price_list.manage
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - catalog.code_duplicate
