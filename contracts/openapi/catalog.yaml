          type: string
          maxLength: 16
          enum:
            - numeric
            - text
            - ordinal
            - coded
            - attachment
            - narrative
            - boolean
            - test_footer
            - space
            - graph
            - html_descriptive
          description: "ElabAssist mapping (T0C-TESTMGMT-1, LD-318): Integer, Float, Equation = numeric (Equation sets formula_expression); List = coded; Long Text, Single Line Text = text; Descriptive = narrative; Image = attachment; Boolean, Test_Footer, Space, Graph, Html Descriptive = the values of the same name."
