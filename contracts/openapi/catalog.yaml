# contracts/openapi/catalog.yaml (C3) — transcription of spec/chunks/C3-catalog-pricing/02-TRD.md §5 (T0C-10.C3; AC-0C-1.4/1.5).
# Generated once from the TRD tables, then owned by C3. Notes:
# - Examples are synthetic. E-mail fields show the placeholder "<synthetic-email>" (lint AB-20); phones use +1555 test numbers.
# - [CONV] free-form maps (flag_map, sample_inputs, input_unit_codes) are JSON object text: lint rule 3 / OAS 3.0 cannot express them.
# - [CONV] request code fields carry length only: the server trims and upper-cases codes before applying the resource regex (TRD §5.0).
# - Open conflict with lint rule 4 (P-8): POSTs with x-idempotency none outside E1/E2, see .orchestra/cr/T0C-10.C3.md.
openapi: 3.0.3
info:
  title: LIMS catalog (C3)
