    post:
      operationId: validateCatalogImport
      tags:
        - catalog
      summary: Upload and validate an Excel test import (dry run; writes no catalog row)
      description: >-
        The server parses and validates the workbook, never the browser, converts it to normalized JSON and records a batch: status validated when there is no error,
        rejected otherwise. The dry run writes no catalog row (commitCatalogImport does, as DRAFTS only; the import never publishes). Upload convention of reporting uploadOutsourcedReport.
        IMPORT RULES: xlsx only, checked by magic bytes (a ZIP container with an OOXML workbook part); never xlsm, never xls, no macros (a vbaProject part is rejected);
        external links are rejected; a zip bomb is rejected (the uncompressed size is capped before parsing); at most 5 MB and at most 5000 rows per sheet
        (catalog.import_too_large); a file that is not a readable workbook is catalog.import_invalid_file; a wrong template version is catalog.import_template_outdated.
        Text cells starting with = + - or @ are rejected (formula injection). Test codes are unique per tenant and in the file; mode create_only refuses an existing code.
        Parameter equations are written over the short names of other parameters of the same test and are mapped to formula_expression over analyte codes; unknown names,
        self reference, cycles and division by a constant zero are rejected. Reference ranges: From >= To, overlapping bands for the same gender and laboratory,
        Normal Low > Normal High and critical limits inside the normal range are rejected; gender Any is expanded; critical limits 0 and 0 mean none (LD-318 follow-up).
        All errors are listed together, not only the first, each with its sheet, row and column; at most 1000 errors are kept. A batch can be committed within 24 hours.
        T0C-TESTIMPORT-1, LD-318.
      security:
        - bearerJwt: []
      x-permission: catalog.test.manage
      x-context: tenant
      x-idempotency: required
      x-rate-limit-tier: general
      x-error-codes:
        - common.payload_too_large
        - common.unsupported_media_type
        - common.rate_limited
        - common.idempotency_key_reused
