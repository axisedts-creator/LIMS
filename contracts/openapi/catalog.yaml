        - $ref: _common.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceListAssignmentsReplace"
            examples:
              synthetic:
                value:
                  owner_ids:
                    - 0193c3a0-0000-7000-8000-000000000283
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
