                      price_list_id: 0193c4a0-0000-7000-8000-000000000502
                      status: dry_run
                      row_count: 120
                      error_count: 3
                      file_sha256: cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd
