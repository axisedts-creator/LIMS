        - reportable
        - sort_order
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuid
        code:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[A-Z][A-Z0-9_]{0,31}$
        name:
          type: string
          minLength: 1
          maxLength: 120
