          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[A-Z0-9_]{1,32}$
        ordinal_set_values:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - code
              - display
              - sort_order
            properties:
              code:
                type: string
                minLength: 1
                maxLength: 16
                pattern: ^[A-Z0-9_+\-]{1,16}$
              display:
                type: string
                minLength: 1
                maxLength: 40
              sort_order:
                type: integer
                minimum: 0
                maximum: 9999
