# contracts/openapi/core.yaml (C0) — endpoints the core implements (02-TRD §8).
# `health` is singular: CV §3 exception recorded as CR-C0-006. Exposed by nginx on the internal interface only.
openapi: 3.0.3
info:
  title: LIMS core
  version: 1.0.0
paths:
  /v1/core/health/live:
    get:
      operationId: getLiveness
      tags: [core]
      summary: Process liveness
      security: []
      x-public: "process liveness for the orchestrator; no data"
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes: [common.service_unavailable]
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Liveness' }
              examples:
                ok: { value: { status: ok } }
        '503':
          $ref: '_common.yaml#/components/responses/ServiceUnavailable'
  /v1/core/health/ready:
    get:
      operationId: getReadiness
      tags: [core]
      summary: Readiness with dependency checks
      security: []
      x-public: "readiness for the orchestrator; dependency names only, no versions or hosts"
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes: [common.dependency_unavailable]
      responses:
        '200':
          description: All dependencies ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              examples:
                ok: { value: { status: ok, checks: { db: ok, ratelimit: ok } } }
        '503':
          description: A dependency is unavailable (common.dependency_unavailable); same body shape with the failing checks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              examples:
                db_down: { value: { status: down, checks: { db: down, ratelimit: ok } } }
  # ---------- T0C-SYNC-1 (LD-322; design C:/LIMS-state/offline-design-20261117.md sections 4, 5, 6, 7): offline sync part 1 ----------
  /v1/core/sync/devices:
    post:
      operationId: registerSyncDevice
      tags: [core]
      summary: Register this device for offline work (T0C-SYNC-1)
      description: >-
        Called online by the signed in user on the device (first sign in on a new device is online only). The device
        generates its own UUID and keeps it. Idempotent per device id: registering the same id again for the same user
        answers 200 with the existing row (label, platform and app version refreshed, last_seen_at moved), never a second
        row. A revoked device answers sync.device_revoked; a device with a pending remote wipe answers sync.wipe_required.
      security:
        - bearerJwt: []
      x-permission: sync.use
      x-context: tenant
      x-idempotency: required
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.idempotency_key_required
        - common.idempotency_key_reused
        - common.idempotency_in_progress
        - sync.device_revoked
        - sync.wipe_required
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncDeviceRegistration' }
            examples:
              web_pc:
                value: { id: 0193c4a0-0000-7000-8000-0000005c0001, device_label: Front desk PC 1, platform: web, app_version: 1.4.0 }
      responses:
        '200':
          description: The registered device (new or existing).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncDevice' }
              examples:
                registered:
                  value:
                    id: 0193c4a0-0000-7000-8000-0000005c0011
                    user_id: 0193c4a0-0000-7000-8000-0000005c0101
                    device_label: Front desk PC 1
                    platform: web
                    app_version: 1.4.0
                    status: active
                    first_seen_at: '2026-11-17T04:15:00.000Z'
                    last_seen_at: '2026-11-17T04:15:00.000Z'
                    offline_retention_days: 14
                    created_at: '2026-11-17T04:15:00.000Z'
                    updated_at: '2026-11-17T04:15:00.000Z'
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: '_common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: '_common.yaml#/components/responses/Internal' }
    get:
      operationId: listSyncDevices
      tags: [core]
      summary: List registered sync devices of the tenant (T0C-SYNC-1)
      description: Administrator view of the device registry; revoked and wiped devices stay listed (rows are never deleted).
      security:
        - bearerJwt: []
      x-permission: sync.device.manage
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - auth.mfa_required
        - common.invalid_cursor
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SyncDeviceStatus' }
        - name: user_id
          in: query
          required: false
          schema: { $ref: '_common.yaml#/components/schemas/Uuid' }
        - name: platform
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SyncPlatform' }
        - $ref: '_common.yaml#/components/parameters/Cursor'
        - $ref: '_common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, page]
                properties:
                  data:
                    type: array
                    maxItems: 200
                    items: { $ref: '#/components/schemas/SyncDevice' }
                  page: { $ref: '_common.yaml#/components/schemas/PageInfo' }
              examples:
                two_devices:
                  value:
                    data:
                      - id: 0193c4a0-0000-7000-8000-0000005c0021
                        user_id: 0193c4a0-0000-7000-8000-0000005c0101
                        device_label: Front desk PC 1
                        platform: web
                        app_version: 1.4.0
                        status: active
                        first_seen_at: '2026-11-17T04:15:00.000Z'
                        last_seen_at: '2026-11-17T09:40:00.000Z'
                        last_sync_at: '2026-11-17T09:40:00.000Z'
                        last_clock_skew_ms: -1200
                        offline_retention_days: 14
                        created_at: '2026-11-17T04:15:00.000Z'
                        updated_at: '2026-11-17T09:40:00.000Z'
                      - id: 0193c4a0-0000-7000-8000-0000005c0022
                        user_id: 0193c4a0-0000-7000-8000-0000005c0102
                        device_label: Collection tablet 3
                        platform: android
                        app_version: 1.3.2
                        status: wipe_requested
                        first_seen_at: '2026-11-10T03:00:00.000Z'
                        last_seen_at: '2026-11-16T11:00:00.000Z'
                        wipe_requested_at: '2026-11-17T05:00:00.000Z'
                        offline_retention_days: 14
                        created_at: '2026-11-10T03:00:00.000Z'
                        updated_at: '2026-11-17T05:00:00.000Z'
                    page: { limit: 50 }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '429': { $ref: '_common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: '_common.yaml#/components/responses/Internal' }
  /v1/core/sync/devices/{device_id}/revoke:
    post:
      operationId: revokeSyncDevice
      tags: [core]
      summary: Revoke a sync device (T0C-SYNC-1)
      description: >-
        Sets status revoked; the row is kept for the audit trail. From its next contact every sync call of the device is
        rejected with sync.device_revoked and the device refuses to unlock its local store. Revoking a revoked device answers
        the unchanged row.
      security:
        - bearerJwt: []
      x-permission: sync.device.manage
      x-context: tenant
      x-idempotency: optional
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.not_found
        - auth.mfa_required
        - sync.device_unknown
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: The revoked device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncDevice' }
              examples:
                revoked:
                  value:
                    id: 0193c4a0-0000-7000-8000-0000005c0031
                    user_id: 0193c4a0-0000-7000-8000-0000005c0101
                    device_label: Front desk PC 1
                    platform: web
                    app_version: 1.4.0
                    status: revoked
                    first_seen_at: '2026-11-17T04:15:00.000Z'
                    last_seen_at: '2026-11-17T09:40:00.000Z'
                    offline_retention_days: 14
                    created_at: '2026-11-17T04:15:00.000Z'
                    updated_at: '2026-11-17T10:00:00.000Z'
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '429': { $ref: '_common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: '_common.yaml#/components/responses/Internal' }
  /v1/core/sync/devices/{device_id}/wipe:
    post:
      operationId: requestSyncDeviceWipe
      tags: [core]
      summary: Request a remote wipe of a sync device (T0C-SYNC-1)
      description: >-
        Sets status wipe_requested and wipe_requested_at. The device wipes its local encrypted store on its next contact
        (getSyncStatus or any sync call answers sync.wipe_required) and then calls ackDeviceWipe. Unsynced operations on
        that device are lost; the screen warns before the request.
      security:
        - bearerJwt: []
      x-permission: sync.device.manage
      x-context: tenant
      x-idempotency: optional
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.not_found
        - auth.mfa_required
        - sync.device_unknown
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: The device, wipe requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncDevice' }
              examples:
                wipe_requested:
                  value:
                    id: 0193c4a0-0000-7000-8000-0000005c0032
                    user_id: 0193c4a0-0000-7000-8000-0000005c0102
                    device_label: Collection tablet 3
                    platform: android
                    app_version: 1.3.2
                    status: wipe_requested
                    first_seen_at: '2026-11-10T03:00:00.000Z'
                    last_seen_at: '2026-11-16T11:00:00.000Z'
                    wipe_requested_at: '2026-11-17T05:00:00.000Z'
                    offline_retention_days: 14
                    created_at: '2026-11-10T03:00:00.000Z'
                    updated_at: '2026-11-17T05:00:00.000Z'
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '429': { $ref: '_common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: '_common.yaml#/components/responses/Internal' }
  /v1/core/sync/devices/{device_id}/wipe-ack:
    post:
      operationId: ackDeviceWipe
      tags: [core]
      summary: Acknowledge a completed remote wipe (T0C-SYNC-1)
      description: >-
        Called by the device itself after it wiped its local store: only the signed in owner of that device (user_id of the
        row) may acknowledge. Records wipe_acked_at; the device stays unusable for offline work until an administrator
        decides otherwise. A revoked device answers sync.device_revoked.
      security:
        - bearerJwt: []
      x-permission: sync.use
      x-context: tenant
      x-idempotency: optional
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.not_found
        - sync.device_unknown
        - sync.device_revoked
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: The device with the wipe acknowledged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncDevice' }
              examples:
                acked:
                  value:
                    id: 0193c4a0-0000-7000-8000-0000005c0042
                    user_id: 0193c4a0-0000-7000-8000-0000005c0102
                    device_label: Collection tablet 3
                    platform: android
                    app_version: 1.3.2
                    status: wipe_requested
                    first_seen_at: '2026-11-10T03:00:00.000Z'
                    last_seen_at: '2026-11-17T06:00:00.000Z'
                    wipe_requested_at: '2026-11-17T05:00:00.000Z'
                    wipe_acked_at: '2026-11-17T06:00:00.000Z'
                    offline_retention_days: 14
                    created_at: '2026-11-10T03:00:00.000Z'
                    updated_at: '2026-11-17T06:00:00.000Z'
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '429': { $ref: '_common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: '_common.yaml#/components/responses/Internal' }
  /v1/core/sync/status:
    get:
      operationId: getSyncStatus
      tags: [core]
      summary: Sync status, limits and retry hints for this device (T0C-SYNC-1)
      description: >-
        The first call of every sync cycle. Answers the server time (the device stores its clock skew), the device status
        (a revoked device answers sync.device_revoked, a device with a pending wipe sync.wipe_required), the minimum app
        version, the batch limits (at most 50 operations and 1 MB per batch, one batch in flight per device), the retry
        hints (exponential backoff with full jitter, capped at 5 minutes, honour Retry-After) and whether the tenant policy
        allows offline approval by a locally signed in pathologist (default false: approvals needing MFA step up are online only).
      security:
        - bearerJwt: []
      x-permission: sync.use
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - sync.device_unknown
        - sync.device_revoked
        - sync.wipe_required
      parameters:
        - name: device_id
          in: query
          required: true
          schema: { $ref: '_common.yaml#/components/schemas/Uuid' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncStatus' }
              examples:
                active:
                  value:
                    server_time: '2026-11-17T10:15:00.000Z'
                    device_status: active
                    min_app_version: 1.2.0
                    limits: { max_batch_operations: 50, max_batch_bytes: 1048576 }
                    retry: { base_delay_ms: 1000, max_delay_ms: 300000, jitter: full }
                    offline_approval_allowed: false
                must_wipe:
                  value:
                    server_time: '2026-11-17T10:15:00.000Z'
                    device_status: wipe_requested
                    limits: { max_batch_operations: 50, max_batch_bytes: 1048576 }
                    retry: { base_delay_ms: 1000, max_delay_ms: 300000, jitter: full }
                    offline_approval_allowed: false
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '429': { $ref: '_common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: '_common.yaml#/components/responses/Internal' }
  /v1/core/sync/number-blocks:
    post:
      operationId: reserveNumberBlock
      tags: [core]
      summary: Reserve a block of lab codes or patient ids for offline use (T0C-SYNC-1)
      description: >-
        Online only: a device reserves a block per series while online (design section 4; defaults 200 lab codes and 100
        patient ids; block size is a tenant setting and a size above the configured maximum answers sync.block_size_too_large).
        The server picks the next free range; blocks of one tenant and series never overlap (database rule). Numbers the
        device does not use are recorded as skipped: a gap is allowed for lab codes and patient ids. Bill, invoice and
        receipt numbers are never issued in blocks (provisional offline numbers, the server assigns the final gap free
        number at sync), so only the series lab_code and patient_id exist; a series the tenant does not issue in blocks
        answers sync.series_unknown. remaining_size is the count of unused numbers the device then holds in that series,
        this block included.
      security:
        - bearerJwt: []
      x-permission: sync.use
      x-context: tenant
      x-idempotency: required
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.idempotency_key_required
        - common.idempotency_key_reused
        - common.idempotency_in_progress
        - sync.device_unknown
        - sync.device_revoked
        - sync.wipe_required
        - sync.block_size_too_large
        - sync.series_unknown
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NumberBlockRequest' }
            examples:
              lab_codes:
                value: { device_id: 0193c4a0-0000-7000-8000-0000005c0001, series: lab_code, size: 200 }
              patient_ids_at_centre:
                value: { device_id: 0193c4a0-0000-7000-8000-0000005c0001, series: patient_id, centre_id: 0193c4a0-0000-7000-8000-0000005c0201, size: 100 }
      responses:
        '201':
          description: The reserved block.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [block, remaining_size]
                properties:
                  block: { $ref: '#/components/schemas/NumberBlock' }
                  remaining_size: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
              examples:
                lab_codes:
                  value:
                    block:
                      id: 0193c4a0-0000-7000-8000-0000005c0301
                      device_id: 0193c4a0-0000-7000-8000-0000005c0001
                      series: lab_code
                      from_value: 1001
                      to_value: 1200
                      issued_at: '2026-11-17T04:16:00.000Z'
                      skipped_count: 0
                    remaining_size: 200
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: '_common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: '_common.yaml#/components/responses/Internal' }
  # ---------- T0C-SYNC-2 (LD-322; design C:/LIMS-state/offline-design-20261117.md sections 2, 3, 4, 5, 7, 8): offline sync part 2 ----------
  /v1/core/sync/batches:
    post:
      operationId: pushSyncBatch
      tags: [core]
      summary: Push a batch of queued offline operations (T0C-SYNC-2)
      description: >-
        Bulk push of the device outbox when the connection returns. At most 50 operations and 1 MB (1048576 bytes) per
        batch, one batch in flight per device; a larger batch answers sync.batch_too_large for the whole request. Every
        operation is applied in its own transaction, in the order sent, so one bad operation never fails the batch: the
        answer holds one result per op_id (accepted, duplicate, rejected or conflict, a closed error code, and for bills,
        invoices and receipts the mapping from the PROVISIONAL offline number to the final gap free number). The op_id is
        the idempotency key (per tenant): re-sending an op_id with the same payload answers duplicate with the first
        outcome; the same op_id with another payload answers sync.op_id_reused. The server is authoritative: it re-checks
        the permission of the wrapped operation for the signed in user, the entity version (base_version), the
        verification policy and the step up rules at sync time, and records server time next to the device time (a clock
        skew above the limit is flagged or answers sync.clock_skew_too_large). A request level 429 carries Retry-After
        (retry_after, seconds); the device backs off with full jitter. A revoked device answers sync.device_revoked, a
        device with a pending wipe sync.wipe_required, before any operation is read.
      security:
        - bearerJwt: []
      x-permission: sync.use
      x-context: tenant
      x-idempotency: none
      x-idempotency-justification: "E3 per operation idempotency: every operation carries its own op_id, the idempotency key per tenant (design principle 3); a replayed op_id answers duplicate with the first outcome, so the batch takes no Idempotency-Key header."
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - sync.batch_too_large
        - sync.device_unknown
        - sync.device_revoked
        - sync.wipe_required
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncBatchRequest' }
            examples:
              three_operations:
                value:
                  device_id: 0193c4a0-0000-7000-8000-0000005c0001
                  operations:
                    - op_id: 0193c4a0-0000-7000-8000-0000005d0001
                      op_type: billing.record_receipt
                      entity_id: 0193c4a0-0000-7000-8000-0000005d0101
                      payload: { method_code: SYN_CODE, amount_received_paisa: 150000, reference: Synthetic reference }
                      device_created_at: '2026-11-17T08:05:00Z'
                    - op_id: 0193c4a0-0000-7000-8000-0000005d0002
                      op_type: accession.receive
                      entity_id: 0193c4a0-0000-7000-8000-0000005d0102
                      base_version: 2
                      payload: { processing_centre_id: 0193c4a0-0000-7000-8000-0000005d0201 }
                      device_created_at: '2026-11-17T08:06:00Z'
                    - op_id: 0193c4a0-0000-7000-8000-0000005d0003
                      op_type: result.verify
                      entity_id: 0193c4a0-0000-7000-8000-0000005d0103
                      base_version: 3
                      payload: { acknowledged_flags: [delta] }
                      device_created_at: '2026-11-17T08:07:00Z'
      responses:
        '200':
          description: One result per op_id, in the order sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncBatchResult' }
              examples:
                accepted_duplicate_conflict:
                  value:
                    results:
                      - op_id: 0193c4a0-0000-7000-8000-0000005d0001
                        status: accepted
                        entity_id: 0193c4a0-0000-7000-8000-0000005d0101
                        number_mappings:
                          - { document_type: receipt, provisional_number: OFF-5C0001-12, final_number: RCP-2083-000145 }
                        skew_flag: false
                      - op_id: 0193c4a0-0000-7000-8000-0000005d0002
                        status: duplicate
                        entity_id: 0193c4a0-0000-7000-8000-0000005d0102
                        skew_flag: false
                      - op_id: 0193c4a0-0000-7000-8000-0000005d0003
                        status: conflict
                        error_code: sync.base_version_stale
                        conflict_id: 0193c4a0-0000-7000-8000-0000005d0301
                        entity_id: 0193c4a0-0000-7000-8000-0000005d0103
                        skew_flag: false
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: '_common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: '_common.yaml#/components/responses/Internal' }
  /v1/core/sync/pull:
    post:
      operationId: pullChanges
      tags: [core]
      summary: Pull changes of the cacheable reference data (T0C-SYNC-2)
      description: >-
        Read by POST because the body carries one opaque cursor per entity type (clients never parse a cursor; absent =
        from the start). Only the entity types of the whitelist can be pulled (cacheable reads of design section 3; never
        credentials, users or roles). Each entity type answers a page of upserts (row, version token when the table has
        one, else updated_at) and tombstones for removed rows (id and time only, no row data), the next cursor and
        has_more; limit is the page size per entity type. Rows are filtered by the tenant and the permissions of the
        signed in user. A revoked device answers sync.device_revoked and a device with a pending wipe sync.wipe_required
        before any data is read.
      security:
        - bearerJwt: []
      x-permission: sync.use
      x-context: tenant
      x-idempotency: none
      x-idempotency-justification: "E3 read-only POST: the cursors per entity type travel in the body; no state written, nothing to replay."
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.invalid_cursor
        - sync.device_unknown
        - sync.device_revoked
        - sync.wipe_required
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPullRequest' }
            examples:
              first_pull:
                value:
                  device_id: 0193c4a0-0000-7000-8000-0000005c0001
                  entities: [{ entity_type: test }, { entity_type: doctor, cursor: opaque-AbC123 }]
                  limit: 200
      responses:
        '200':
          description: One page per requested entity type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPullResponse' }
              examples:
                page:
                  value:
                    changes:
                      - entity_type: test
                        upserts:
                          - { id: 0193c4a0-0000-7000-8000-0000005e0001, version: 4, updated_at: '2026-11-17T09:00:00Z', document: { code: CBC, name: Complete blood count } }
                        tombstones:
                          - { id: 0193c4a0-0000-7000-8000-0000005e0002, removed_at: '2026-11-17T09:10:00Z' }
                        next_cursor: opaque-Xy7
                        has_more: false
                      - entity_type: doctor
                        upserts: []
                        tombstones: []
                        next_cursor: opaque-AbC123
                        has_more: false
                    server_time: '2026-11-17T10:15:00Z'
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '429': { $ref: '_common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: '_common.yaml#/components/responses/Internal' }
  /v1/core/sync/conflicts:
    get:
      operationId: listSyncConflicts
      tags: [core]
      summary: List sync conflicts of the tenant (T0C-SYNC-2)
      description: >-
        Conflicts recorded at sync (design section 8); open first. Filters by status and entity type only (no search by
        patient name). The user who pushed sees the conflict status and conflict_id in the push result.
      security:
        - bearerJwt: []
      x-permission: sync.conflict.resolve
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - auth.mfa_required
        - common.invalid_cursor
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SyncConflictStatus' }
        - name: entity_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SyncConflictEntityType' }
        - $ref: '_common.yaml#/components/parameters/Cursor'
        - $ref: '_common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, page]
                properties:
                  data:
                    type: array
                    maxItems: 200
                    items: { $ref: '#/components/schemas/SyncConflict' }
                  page: { $ref: '_common.yaml#/components/schemas/PageInfo' }
              examples:
                one_open:
                  value:
                    data:
                      - id: 0193c4a0-0000-7000-8000-0000005d0311
                        op_id: 0193c4a0-0000-7000-8000-0000005d0003
                        entity_type: result
                        entity_id: 0193c4a0-0000-7000-8000-0000005d0103
                        local_payload: { acknowledged_flags: [delta] }
                        server_payload: { status: verified, version: 4 }
                        status: open
                        created_at: '2026-11-17T10:15:00Z'
                    page: { limit: 50 }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '429': { $ref: '_common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: '_common.yaml#/components/responses/Internal' }
  /v1/core/sync/conflicts/{conflict_id}:
    get:
      operationId: getSyncConflict
      tags: [core]
      summary: Get one sync conflict with both versions (T0C-SYNC-2)
      description: >-
        Shows both versions side by side: the local version the device sent (local_payload) and the server version at the
        time of the conflict (server_payload), with the resolution once resolved.
      security:
        - bearerJwt: []
      x-permission: sync.conflict.resolve
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.not_found
        - auth.mfa_required
      parameters:
        - $ref: '#/components/parameters/ConflictId'
      responses:
        '200':
          description: The conflict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncConflict' }
              examples:
                resolved:
                  value:
                    id: 0193c4a0-0000-7000-8000-0000005d0321
                    op_id: 0193c4a0-0000-7000-8000-0000005d0004
                    entity_type: patient
                    entity_id: 0193c4a0-0000-7000-8000-0000005d0104
                    local_payload: { phone_present: true }
                    server_payload: { phone_present: false }
                    status: resolved
                    resolution: merge
                    resolved_by: 0193c4a0-0000-7000-8000-0000005c0103
                    resolved_at: '2026-11-17T11:00:00Z'
                    reason: Took the new phone number from the device (synthetic)
                    created_at: '2026-11-17T10:15:00Z'
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '429': { $ref: '_common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: '_common.yaml#/components/responses/Internal' }
  /v1/core/sync/conflicts/{conflict_id}/resolve:
    post:
      operationId: resolveSyncConflict
      tags: [core]
      summary: Resolve a sync conflict (T0C-SYNC-2)
      description: >-
        keep_server discards the local version, apply_local applies the local version over the server version, merge
        applies merged_payload (required for merge, refused otherwise). A reason is always required; the resolution,
        resolver and time are written once and audited, and a resolved conflict never changes again (a second resolution
        answers common.immutable_record). If the entity changed on the server after the conflict was recorded the call
        answers sync.entity_changed: reload both versions and resolve again.
      security:
        - bearerJwt: []
      x-permission: sync.conflict.resolve
      x-context: tenant
      x-idempotency: required
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.not_found
        - auth.mfa_required
        - common.idempotency_key_required
        - common.idempotency_key_reused
        - common.idempotency_in_progress
        - common.immutable_record
        - sync.entity_changed
      parameters:
        - $ref: '#/components/parameters/ConflictId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveSyncConflictRequest' }
            examples:
              keep_server:
                value: { resolution: keep_server, reason: Server copy is newer (synthetic) }
              merge:
                value: { resolution: merge, reason: Take the new phone number from the device (synthetic), merged_payload: { phone_present: true } }
      responses:
        '200':
          description: The resolved conflict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncConflict' }
              examples:
                kept_server:
                  value:
                    id: 0193c4a0-0000-7000-8000-0000005d0331
                    op_id: 0193c4a0-0000-7000-8000-0000005d0005
                    entity_type: result
                    entity_id: 0193c4a0-0000-7000-8000-0000005d0105
                    local_payload: { acknowledged_flags: [delta] }
                    server_payload: { status: verified, version: 4 }
                    status: resolved
                    resolution: keep_server
                    resolved_by: 0193c4a0-0000-7000-8000-0000005c0103
                    resolved_at: '2026-11-17T11:00:00Z'
                    reason: Server copy is newer (synthetic)
                    created_at: '2026-11-17T10:15:00Z'
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/Unprocessable' }
        '429': { $ref: '_common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: '_common.yaml#/components/responses/Internal' }
components:
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, maxLength: 2, enum: [ok] }
    CheckState:
      type: string
      maxLength: 8
      enum: [ok, degraded, down]
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { $ref: '#/components/schemas/CheckState' }
        checks:
          type: object
          additionalProperties: false
          required: [db, ratelimit]
          properties:
            db: { $ref: '#/components/schemas/CheckState' }
            ratelimit: { $ref: '#/components/schemas/CheckState' }
        missing_env:
          type: array
          description: >-
            Names of required LIMS_* environment variables that are unset (LD-288, T0B-OPSDOC-1). Names only, never
            values. Present only when non-empty. Bounds (T0C-LINTFIX-1, LD-332): REQUIRED_ENV lists 22 names, longest
            34 chars; rounded up.
          maxItems: 64
          items:
            type: string
            maxLength: 128
            pattern: '^LIMS_[A-Z0-9_]*[A-Z0-9]$'
    # ---------- T0C-SYNC-1 (LD-322) offline sync part 1 ----------
    IsoDateTime:   # instant, UTC; the millisecond fraction is optional (device clocks)
      type: string
      format: date-time
      maxLength: 30
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$'
    SyncPlatform:
      type: string
      maxLength: 8
      enum: [web, android, ios]
    SyncDeviceStatus:
      type: string
      maxLength: 16
      enum: [active, revoked, wipe_requested]
    NumberSeries:   # design section 4: bill, invoice and receipt numbers are never issued in blocks
      type: string
      maxLength: 16
      enum: [lab_code, patient_id]
    DeviceLabel:
      type: string
      minLength: 1
      maxLength: 120
    AppVersion:
      type: string
      minLength: 1
      maxLength: 40
      pattern: '^[0-9A-Za-z][0-9A-Za-z.+-]*$'
    SyncDeviceRegistration:
      type: object
      additionalProperties: false
      required: [id, device_label, platform, app_version]
      properties:
        id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        device_label: { $ref: '#/components/schemas/DeviceLabel' }
        platform: { $ref: '#/components/schemas/SyncPlatform' }
        app_version: { $ref: '#/components/schemas/AppVersion' }
    SyncDevice:
      type: object
      additionalProperties: false
      required: [id, user_id, device_label, platform, app_version, status, first_seen_at, last_seen_at, offline_retention_days, created_at, updated_at]
      properties:
        id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        user_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        device_label: { type: string, minLength: 1, maxLength: 120 }
        platform: { $ref: '#/components/schemas/SyncPlatform' }
        app_version: { type: string, minLength: 1, maxLength: 40, pattern: '^[0-9A-Za-z][0-9A-Za-z.+-]*$' }
        status: { $ref: '#/components/schemas/SyncDeviceStatus' }
        first_seen_at: { $ref: '#/components/schemas/IsoDateTime' }
        last_seen_at: { $ref: '#/components/schemas/IsoDateTime' }
        last_sync_at: { $ref: '#/components/schemas/IsoDateTime' }
        wipe_requested_at: { $ref: '#/components/schemas/IsoDateTime' }
        wipe_acked_at: { $ref: '#/components/schemas/IsoDateTime' }
        last_clock_skew_ms:
          type: integer
          format: int64
          description: Device clock minus server clock at the last contact, in milliseconds (negative = device behind).
          minimum: -9007199254740991
          maximum: 9007199254740991
        offline_retention_days: { type: integer, minimum: 1, maximum: 365 }
        created_at: { $ref: '#/components/schemas/IsoDateTime' }
        updated_at: { $ref: '#/components/schemas/IsoDateTime' }
    SyncLimits:
      type: object
      additionalProperties: false
      required: [max_batch_operations, max_batch_bytes]
      properties:
        max_batch_operations: { type: integer, minimum: 1, maximum: 1000 }
        max_batch_bytes: { type: integer, minimum: 1, maximum: 104857600 }
    SyncRetry:
      type: object
      additionalProperties: false
      required: [base_delay_ms, max_delay_ms, jitter]
      properties:
        base_delay_ms: { type: integer, minimum: 1, maximum: 3600000 }
        max_delay_ms: { type: integer, minimum: 1, maximum: 3600000 }
        jitter: { type: string, maxLength: 8, enum: [full] }
    SyncStatus:
      type: object
      additionalProperties: false
      required: [server_time, device_status, limits, retry, offline_approval_allowed]
      properties:
        server_time: { $ref: '#/components/schemas/IsoDateTime' }
        device_status: { $ref: '#/components/schemas/SyncDeviceStatus' }
        min_app_version: { $ref: '#/components/schemas/AppVersion' }
        limits: { $ref: '#/components/schemas/SyncLimits' }
        retry: { $ref: '#/components/schemas/SyncRetry' }
        offline_approval_allowed: { type: boolean }
    NumberBlockRequest:
      type: object
      additionalProperties: false
      required: [device_id, series, size]
      properties:
        device_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        series: { $ref: '#/components/schemas/NumberSeries' }
        centre_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        size: { type: integer, minimum: 1, maximum: 10000 }
    NumberBlock:
      type: object
      additionalProperties: false
      required: [id, device_id, series, from_value, to_value, issued_at, skipped_count]
      properties:
        id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        device_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        series: { $ref: '#/components/schemas/NumberSeries' }
        centre_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        from_value: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        to_value: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        issued_at: { $ref: '#/components/schemas/IsoDateTime' }
        exhausted_at: { $ref: '#/components/schemas/IsoDateTime' }
        skipped_count: { type: integer, format: int32, minimum: 0, maximum: 2147483647 }
    # ---------- T0C-SYNC-2 (LD-322) offline sync part 2: push, pull, conflicts ----------
    SyncBatchRequest:
      type: object
      additionalProperties: false
      description: The 50 operation and 1 MB limits are service rules (sync.batch_too_large); maxItems here is the hard schema bound.
      required: [device_id, operations]
      properties:
        device_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/SyncOperation' }
    SyncOperation:
      description: >-
        The closed operation catalogue (design section 3). Each entry wraps one existing operation: payload is that
        operation's request body (same schema, no copied fields); the path id of the wrapped operation travels as entity_id.
      oneOf:
        - $ref: '#/components/schemas/SyncOpRegistrationCreateOrder'
        - $ref: '#/components/schemas/SyncOpBillingRecordReceipt'
        - $ref: '#/components/schemas/SyncOpCollectionMarkCollected'
        - $ref: '#/components/schemas/SyncOpAccessionReceive'
        - $ref: '#/components/schemas/SyncOpResultEnter'
        - $ref: '#/components/schemas/SyncOpResultVerify'
        - $ref: '#/components/schemas/SyncOpReportPrintMarker'
        - $ref: '#/components/schemas/SyncOpDailyCashClose'
      discriminator:
        propertyName: op_type
        mapping:
          registration.create_order: '#/components/schemas/SyncOpRegistrationCreateOrder'
          billing.record_receipt: '#/components/schemas/SyncOpBillingRecordReceipt'
          collection.mark_collected: '#/components/schemas/SyncOpCollectionMarkCollected'
          accession.receive: '#/components/schemas/SyncOpAccessionReceive'
          result.enter: '#/components/schemas/SyncOpResultEnter'
          result.verify: '#/components/schemas/SyncOpResultVerify'
          report.print_marker: '#/components/schemas/SyncOpReportPrintMarker'
          daily_cash.close: '#/components/schemas/SyncOpDailyCashClose'
    SyncOpRegistrationCreateOrder:
      type: object
      additionalProperties: false
      description: >-
        Wraps createRegistration (frontdesk), permission frontdesk.registration.create. base_version is not required
        (the operation creates). entity_id is not used. No step up applies, so it is never refused offline with
        sync.offline_not_allowed for MFA; bill and receipt numbers printed offline are PROVISIONAL (OFF-) and the final
        numbers come back in number_mappings.
      required: [op_id, op_type, payload, device_created_at]
      properties:
        op_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        op_type: { type: string, maxLength: 40, enum: [registration.create_order] }
        base_version: { $ref: '_common.yaml#/components/schemas/Version' }
        entity_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        payload: { $ref: 'frontdesk.yaml#/components/schemas/CreateRegistrationRequest' }
        device_created_at: { $ref: '#/components/schemas/IsoDateTime' }
    SyncOpBillingRecordReceipt:
      type: object
      additionalProperties: false
      description: >-
        Wraps recordPayment (billing), permission billing.payment.record; entity_id is the order_id. base_version is
        optional (a payment adds to the order). No step up applies, so it is not refused offline with
        sync.offline_not_allowed for MFA; the receipt number printed offline is PROVISIONAL (OFF-) and the final gap free
        number comes back in number_mappings.
      required: [op_id, op_type, entity_id, payload, device_created_at]
      properties:
        op_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        op_type: { type: string, maxLength: 40, enum: [billing.record_receipt] }
        base_version: { $ref: '_common.yaml#/components/schemas/Version' }
        entity_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        payload: { $ref: 'billing.yaml#/components/schemas/RecordPaymentRequest' }
        device_created_at: { $ref: '#/components/schemas/IsoDateTime' }
    SyncOpCollectionMarkCollected:
      type: object
      additionalProperties: false
      description: >-
        Wraps collectSpecimen (lab), permission lab.specimen.collect; entity_id is the specimen_id. base_version is
        required (the wrapped operation needs If-Match); a stale one answers sync.base_version_stale. No step up applies,
        so it is not refused offline with sync.offline_not_allowed for MFA.
      required: [op_id, op_type, base_version, entity_id, payload, device_created_at]
      properties:
        op_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        op_type: { type: string, maxLength: 40, enum: [collection.mark_collected] }
        base_version: { $ref: '_common.yaml#/components/schemas/Version' }
        entity_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        payload: { $ref: 'lab.yaml#/components/schemas/CollectSpecimenRequest' }
        device_created_at: { $ref: '#/components/schemas/IsoDateTime' }
    SyncOpAccessionReceive:
      type: object
      additionalProperties: false
      description: >-
        Wraps receiveSpecimen (lab), permission lab.specimen.receive; entity_id is the specimen_id. base_version is
        required (the wrapped operation needs If-Match); a stale one answers sync.base_version_stale. No step up applies,
        so it is not refused offline with sync.offline_not_allowed for MFA; a lab code used offline must lie in a block of
        this device (sync.number_out_of_block).
      required: [op_id, op_type, base_version, entity_id, payload, device_created_at]
      properties:
        op_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        op_type: { type: string, maxLength: 40, enum: [accession.receive] }
        base_version: { $ref: '_common.yaml#/components/schemas/Version' }
        entity_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        payload: { $ref: 'lab.yaml#/components/schemas/ReceiveSpecimenRequest' }
        device_created_at: { $ref: '#/components/schemas/IsoDateTime' }
    SyncOpResultEnter:
      type: object
      additionalProperties: false
      description: >-
        Wraps bulkEnterResults (lab), permission lab.result.enter. base_version is not required (each entry of the payload
        carries the version of its result); entity_id is not used. A result verified or released on the server meanwhile
        answers sync.result_locked. No step up applies, so it is not refused offline with sync.offline_not_allowed for MFA.
      required: [op_id, op_type, payload, device_created_at]
      properties:
        op_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        op_type: { type: string, maxLength: 40, enum: [result.enter] }
        base_version: { $ref: '_common.yaml#/components/schemas/Version' }
        entity_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        payload: { $ref: 'lab.yaml#/components/schemas/BulkEnterResultsRequest' }
        device_created_at: { $ref: '#/components/schemas/IsoDateTime' }
    SyncOpResultVerify:
      type: object
      additionalProperties: false
      description: >-
        Wraps verifyResult (lab), permission lab.result.verify; entity_id is the result_id. base_version is required (the
        wrapped operation needs If-Match). An approval that needs an MFA step up is refused offline with
        sync.offline_not_allowed unless the tenant policy allows offline approval by a locally signed in pathologist
        (default off, LD-322 point 3). At sync the verification is re-checked against the T0B-VERLEVEL-1 policy; a failure
        answers sync.verification_policy_failed and recalls any report printed offline on it.
      required: [op_id, op_type, base_version, entity_id, payload, device_created_at]
      properties:
        op_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        op_type: { type: string, maxLength: 40, enum: [result.verify] }
        base_version: { $ref: '_common.yaml#/components/schemas/Version' }
        entity_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        payload: { $ref: 'lab.yaml#/components/schemas/VerifyResultRequest' }
        device_created_at: { $ref: '#/components/schemas/IsoDateTime' }
    SyncOpReportPrintMarker:
      type: object
      additionalProperties: false
      description: >-
        Wraps createReportPrint (reporting), permission reporting.report.print; entity_id is the report_version_id. It
        records that a report was printed offline (watermark issued offline, pending sync). base_version is optional. No
        step up applies, so it is not refused offline with sync.offline_not_allowed for MFA.
      required: [op_id, op_type, entity_id, payload, device_created_at]
      properties:
        op_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        op_type: { type: string, maxLength: 40, enum: [report.print_marker] }
        base_version: { $ref: '_common.yaml#/components/schemas/Version' }
        entity_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        payload: { $ref: 'reporting.yaml#/components/schemas/CreateReportPrintRequest' }
        device_created_at: { $ref: '#/components/schemas/IsoDateTime' }
    SyncOpDailyCashClose:
      type: object
      additionalProperties: false
      description: >-
        Wraps closeCashSession (billing), permission billing.payment.record; entity_id is the cash_session_id.
        base_version is required (the wrapped operation needs If-Match). When the tenant requires a step up (MFA) to close
        the day it is refused offline with sync.offline_not_allowed.
      required: [op_id, op_type, base_version, entity_id, payload, device_created_at]
      properties:
        op_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        op_type: { type: string, maxLength: 40, enum: [daily_cash.close] }
        base_version: { $ref: '_common.yaml#/components/schemas/Version' }
        entity_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        payload: { $ref: 'billing.yaml#/components/schemas/CloseCashSessionRequest' }
        device_created_at: { $ref: '#/components/schemas/IsoDateTime' }
    SyncOperationStatus:
      type: string
      maxLength: 16
      enum: [accepted, duplicate, rejected, conflict]
    SyncErrorCode:   # closed: registered codes only, never free text or personal data
      type: string
      maxLength: 64
      enum:
        - sync.base_version_stale
        - sync.op_id_reused
        - sync.batch_too_large
        - sync.clock_skew_too_large
        - sync.result_locked
        - sync.verification_policy_failed
        - sync.offline_not_allowed
        - sync.number_out_of_block
        - sync.entity_changed
        - common.validation_failed
        - common.not_found
        - common.version_conflict
        - auth.forbidden
        - common.internal
        # domain codes of the 8 wrapped operations (review T0C-SYNC-2 item 2); request-level codes stay on the HTTP response
        - billing.payment_exceeds_due
        - billing.order_not_invoiced
        - billing.counter_busy
        - common.immutable_record
        - common.precondition_required
        - frontdesk.patient_duplicate_suspected
        - frontdesk.consent_required
        - frontdesk.referrer_required
        - frontdesk.discount_approval_required
        - frontdesk.discount_exceeds_limit
        - catalog.test_inactive
        - catalog.no_price
        - catalog.tax_config_missing
        - billing.credit_limit_exceeded
        - billing.credit_party_locked
        - billing.fiscal_year_closed
        - billing.numbering_pattern_invalid
        - lab.specimen_invalid_transition
        - lab.specimen_inactive
        - lab.specimen_not_receivable
        - lab.result_value_invalid
        - lab.result_locked
        - lab.result_invalid_transition
        - lab.result_on_hold
        - lab.flag_ack_required
        - reporting.report_not_released
    SyncNumberMapping:
      type: object
      additionalProperties: false
      required: [document_type, provisional_number, final_number]
      properties:
        document_type: { type: string, maxLength: 8, enum: [bill, invoice, receipt] }
        provisional_number: { type: string, maxLength: 60, pattern: '^OFF-[A-Za-z0-9-]+$' }
        final_number: { type: string, minLength: 1, maxLength: 60 }
    SyncOperationResult:
      type: object
      additionalProperties: false
      required: [op_id, status]
      properties:
        op_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/SyncOperationStatus' }
        error_code: { $ref: '#/components/schemas/SyncErrorCode' }
        conflict_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        entity_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        number_mappings:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/SyncNumberMapping' }
        skew_flag: { type: boolean }
    SyncBatchResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/SyncOperationResult' }
    SyncEntityType:   # whitelist of cacheable reads (design section 3); never credentials, users or roles
      type: string
      maxLength: 40
      enum: [test, parameter, doctor, centre, price_list_version, verification_policy, print_profile, patient, worklist_item, permission]
    SyncPullEntity:
      type: object
      additionalProperties: false
      required: [entity_type]
      properties:
        entity_type: { $ref: '#/components/schemas/SyncEntityType' }
        cursor: { type: string, minLength: 1, maxLength: 512 }
    SyncPullRequest:
      type: object
      additionalProperties: false
      required: [device_id, entities]
      properties:
        device_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        entities:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/SyncPullEntity' }
        limit: { type: integer, minimum: 1, maximum: 1000 }
    SyncUpsert:
      type: object
      additionalProperties: false
      required: [id, updated_at, document]
      properties:
        id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        updated_at: { $ref: '#/components/schemas/IsoDateTime' }
        document:
          description: The row as the read API returns it (JSON object; shape per entity type).
    SyncTombstone:
      type: object
      additionalProperties: false
      required: [id, removed_at]
      properties:
        id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        removed_at: { $ref: '#/components/schemas/IsoDateTime' }
    SyncEntityChanges:
      type: object
      additionalProperties: false
      required: [entity_type, upserts, tombstones, next_cursor, has_more]
      properties:
        entity_type: { $ref: '#/components/schemas/SyncEntityType' }
        upserts:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/SyncUpsert' }
        tombstones:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/SyncTombstone' }
        next_cursor: { type: string, minLength: 1, maxLength: 512 }
        has_more: { type: boolean }
    SyncPullResponse:
      type: object
      additionalProperties: false
      required: [changes, server_time]
      properties:
        changes:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/SyncEntityChanges' }
        server_time: { $ref: '#/components/schemas/IsoDateTime' }
    SyncConflictStatus:
      type: string
      maxLength: 8
      enum: [open, resolved]
    SyncResolution:
      type: string
      maxLength: 12
      enum: [keep_server, apply_local, merge]
    SyncConflictEntityType:
      type: string
      minLength: 1
      maxLength: 60
      pattern: '^[a-z][a-z_]*$'
    SyncConflict:
      type: object
      additionalProperties: false
      required: [id, op_id, entity_type, entity_id, local_payload, server_payload, status, created_at]
      properties:
        id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        op_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        entity_type: { type: string, minLength: 1, maxLength: 60, pattern: '^[a-z][a-z_]*$' }
        entity_id: { $ref: '_common.yaml#/components/schemas/Uuid' }
        local_payload:
          description: The version the device sent (JSON object).
        server_payload:
          description: The server version when the conflict was recorded (JSON object).
        status: { $ref: '#/components/schemas/SyncConflictStatus' }
        resolution: { $ref: '#/components/schemas/SyncResolution' }
        resolved_by: { $ref: '_common.yaml#/components/schemas/Uuid' }
        resolved_at: { $ref: '#/components/schemas/IsoDateTime' }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        created_at: { $ref: '#/components/schemas/IsoDateTime' }
    ResolveSyncConflictRequest:
      type: object
      additionalProperties: false
      required: [resolution, reason]
      properties:
        resolution: { $ref: '#/components/schemas/SyncResolution' }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        merged_payload:
          description: The merged entity (JSON object); required for merge, refused otherwise.
  parameters:
    ConflictId:
      name: conflict_id
      in: path
      required: true
      schema: { $ref: '_common.yaml#/components/schemas/Uuid' }
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { $ref: '_common.yaml#/components/schemas/Uuid' }
