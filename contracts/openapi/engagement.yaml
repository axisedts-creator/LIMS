components:
  schemas:
    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - phone_masked
        - status
        - reminders_opt_out
        - created_at
        - version
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuid
        phone_masked:
          type: string
          maxLength: 20
        status:
          type: string
          maxLength: 7
          enum:
            - active
            - deleted
        reminders_opt_out:
          type: boolean
        last_login_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        created_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        version:
          $ref: _common.yaml#/components/schemas/Version
    Profile:
      type: object
      additionalProperties: false
      required:
        - profile_id
        - display_name
        - relationship
        - method
        - status
        - version
      properties:
        profile_id:
          $ref: _common.yaml#/components/schemas/Uuid
        display_name:
          type: string
          maxLength: 120
        relationship:
          type: string
          maxLength: 7
          enum:
            - self
            - child
            - parent
            - spouse
            - sibling
            - other
        method:
          type: string
          maxLength: 15
          enum:
            - link_code
            - report_link
            - self_registered
        status:
          type: string
          maxLength: 7
          enum:
            - active
            - pending
        version:
          $ref: _common.yaml#/components/schemas/Version
        history_from:
          $ref: _common.yaml#/components/schemas/IsoUtc
        patient_code:
          type: string
          maxLength: 32
    SelfRegistration:
      type: object
      additionalProperties: false
      required:
        - id
        - relationship
        - status
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuid
        relationship:
          type: string
          maxLength: 5
          enum:
            - self
            - child
        status:
          type: string
          maxLength: 7
          enum:
