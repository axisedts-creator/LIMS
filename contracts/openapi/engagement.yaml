        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - link_code_id
                  - code
                  - expires_at
                  - bound_phone_masked
                properties:
                  link_code_id:
                    $ref: _common.yaml#/components/schemas/Uuid
                  code:
                    type: string
                    maxLength: 13
                    minLength: 10
                    pattern: ^[0-9A-Za-z -]+$
                  expires_at:
                    $ref: _common.yaml#/components/schemas/IsoUtc
                  bound_phone_masked:
                    type: string
                    maxLength: 20
              examples:
                synthetic:
                  value:
                    link_code_id: 01950c16-0000-7000-8000-000000000232
                    code: SYN-0000-0001
                    expires_at: 2026-03-01T04:15:00.000Z
                    bound_phone_masked: +99X•••••42
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
