  parameters:
    AppVersion:
      name: X-Lims-App-Version
      in: header
      required: true
      schema:
        type: string
        maxLength: 14
        pattern: ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,4}$
    AppPlatform:
      name: X-Lims-App-Platform
      in: header
      required: true
      schema:
        type: string
        maxLength: 7
        enum:
          - android
          - ios
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: Absent = create (TRD §5.4 S13).
      schema:
        type: string
        maxLength: 12
        pattern: ^"[1-9][0-9]*"$
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
  headers:
    CacheControlNoStore:
      description: PHI response; never cached (TRD §5).
      schema:
        type: string
        maxLength: 8
        enum:
          - no-store
    ETag:
      description: Entity tag for conditional GET.
      schema:
        type: string
        maxLength: 64
    ContentDisposition:
      description: attachment; filename="report-<version_no>.pdf"
      schema:
        type: string
        maxLength: 128
  responses:
    AppVersionUnsupported:
      description: App version below the tenant minimum (REQ-SEC-113).
      content:
        application/problem+json:
          schema:
            $ref: _common.yaml#/components/schemas/Problem
          examples:
            app_version_unsupported:
              value:
                type: urn:lims:error:engagement.app_version_unsupported
                title: App update required
                status: 426
                code: engagement.app_version_unsupported
                request_id: 01933b6f-0a11-7e2b-8c55-1d2e3f405162
