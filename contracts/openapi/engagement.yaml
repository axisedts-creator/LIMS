# contracts/openapi/engagement.yaml (C16) — transcription of spec/chunks/C16-patient-engagement/02-TRD.md §5.1 (DTOs), §5.2 (E1–E3), §5.3 (E10–E51, T3b),
# §5.4 (S1–S14, Q1–Q9, L1–L4, R1–R4, M1–M5, N1–N4, T1–T3a); 98 ops (T0C-10.C16; AC-0C-1.4/1.5).
# LD-103 (2026-11-11): wave-2 transcription scheduled by the human lead; owner approval given by that decision. Generated once from the TRD tables, then owned by C16.
# Notes:
# - Examples are synthetic (uuids 01950c16-0000-7000-8000-…, "Synthetic …" labels, "Test Patient 00nn", phones +1555…, tokens "synthetic_…").
# - Every op lists the five common codes (validation_failed, forbidden, unauthenticated, rate_limited, internal); common.not_found on ops with a path
#   parameter; engagement.app_version_unsupported (426) on patient ops only; privileged permissions add auth.mfa_required; required-idempotency ops add the
#   three idempotency codes; If-Match ops add version_conflict + precondition_required. Error responses derive from errors.yaml http.
# - Ruling T0C-10.C16 (02-CV §4.5 > TRD): E19 E40 S10 Q8-revoke L2 L4 R3 M5 N4 are non-create state actions, so x-idempotency optional (TRD says none).
#   Optional-idempotency ops declare no Idempotency-Key header (wave-1 convention).
# - [CONV] x-idempotency none on POST carries a P-8 justification: E2 (E2), E3 / Q8 pair / L1 (E1, body holds a secret), M4 (E3 read-only).
# - [CONV] S13 upsert takes an optional If-Match (absent = create) and lists only version_conflict; S11 deactivate and Q8 revoke take If-Match (versioned rows).
# - [CONV] TRD-open shapes: staff variants are separate closed components (StaffBooking, StaffBookingDetail, StaffSlot, StaffBookableItem (+version for S13
#   If-Match), StaffEnquiry, AppLink); list items without messages = EnquirySummary; enum values copied from 05-SCHEMA CHECK constraints; coded sets
#   engagement.booking_cancel_reasons / reminder_reasons / enquiry_categories (05-SCHEMA §8); latitude/longitude are DecimalString.
openapi: 3.0.3
info:
  title: LIMS patient engagement (C16)
  version: 1.0.0
  description: Transcribed from spec/chunks/C16-patient-engagement/02-TRD.md §5.1–§5.4 (T0C-10.C16, LD-103).
paths:
  /v1/engagement/app/config:
    get:
      operationId: getPatientAppConfig
      tags:
        - engagement
      summary: Get patient app configuration (TRD §5 E1)
      security:
        - patientPreAuth: []
      x-permission: engagement.auth.challenge
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - engagement.app_version_unsupported
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppPlatform"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
              examples:
                synthetic:
                  value:
                    features:
                      app: false
                      bookings: false
                      home_collection: false
                      payments: false
                      membership: false
                      enquiries: false
                      smart_report: false
                    min_app_version:
                      android: 1.0.0
                      ios: 1.0.0
                    consent:
                      text_version: 2026-01
                      text: Synthetic advice text.
                    gateways:
                      - esewa
                    allowed_phone_prefixes:
                      - "+999"
                    support_phone: "+15550100100"
                    calendar_display: AD
                    timezone: Asia/Kathmandu
                    order_poll_seconds: 30
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "426":
          $ref: "#/components/responses/AppVersionUnsupported"
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
  /v1/engagement/auth/otp-challenges:
    post:
      operationId: requestPatientOtp
      tags:
        - engagement
      summary: Request a patient OTP challenge (TRD §5 E2)
      security:
        - patientPreAuth: []
      x-permission: engagement.auth.challenge
      x-context: tenant
      x-idempotency: none
      x-idempotency-justification: E2 pre-auth OTP request (TRD §5.2 E2, 08 A13 P-8 E2)
      x-rate-limit-tier: otp_request
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.feature_disabled
        - engagement.app_version_unsupported
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - phone_e164
                - app_instance_id
                - app_platform
              properties:
                phone_e164:
                  type: string
                  maxLength: 16
                  pattern: ^\+[1-9][0-9]{7,14}$
                app_instance_id:
                  $ref: _common.yaml#/components/schemas/Uuid
                app_platform:
                  type: string
                  maxLength: 7
                  enum:
                    - android
                    - ios
            examples:
              synthetic:
                value:
                  phone_e164: "+15550100123"
                  app_instance_id: 01950c16-0000-7000-8000-000000000001
                  app_platform: android
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - challenge_token
                  - expires_at
                  - resend_after_seconds
                  - code_length
                properties:
                  challenge_token:
                    type: string
                    maxLength: 43
                    minLength: 43
                    pattern: ^[A-Za-z0-9_-]{43}$
                  expires_at:
                    $ref: _common.yaml#/components/schemas/IsoUtc
                  resend_after_seconds:
                    type: integer
                    minimum: 0
                    maximum: 3600
                  code_length:
                    type: integer
                    minimum: 6
                    maximum: 6
              examples:
                synthetic:
                  value:
                    challenge_token: synthetic_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    expires_at: 2026-03-01T04:15:00.000Z
                    resend_after_seconds: 60
                    code_length: 6
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "426":
          $ref: "#/components/responses/AppVersionUnsupported"
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
  /v1/engagement/auth/otp-challenges/verify:
    post:
      operationId: verifyPatientOtp
      tags:
        - engagement
      summary: Verify a patient OTP challenge (TRD §5 E3)
      security:
        - patientPreAuth: []
      x-permission: engagement.auth.challenge
      x-context: tenant
      x-idempotency: none
      x-idempotency-justification: E1 response body holds the session token, never stored for replay (TRD §5.2 E3, P-8 E1/E2)
      x-rate-limit-tier: otp_verify
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - auth.otp_invalid
        - auth.otp_attempts_exhausted
        - engagement.app_version_unsupported
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/AppPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - code
              properties:
                code:
                  type: string
                  maxLength: 6
                  pattern: ^[0-9]{6}$
            examples:
              synthetic:
                value:
                  code: "123456"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - session_token
                  - access_token
                  - access_expires_at
                  - session_expires_at
                  - account
                properties:
                  session_token:
                    type: string
                    maxLength: 43
                    minLength: 43
                    pattern: ^[A-Za-z0-9_-]{43}$
                  access_token:
                    type: string
                    maxLength: 4096
                    pattern: ^[A-Za-z0-9._-]+$
                  access_expires_at:
                    $ref: _common.yaml#/components/schemas/IsoUtc
                  session_expires_at:
                    $ref: _common.yaml#/components/schemas/IsoUtc
                  account:
                    $ref: "#/components/schemas/Account"
              examples:
                synthetic:
                  value:
                    session_token: synthetic_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    access_token: synthetic.access.token
                    access_expires_at: 2026-03-01T04:15:00.000Z
                    session_expires_at: 2026-03-01T04:15:00.000Z
                    account:
                      id: 01950c16-0000-7000-8000-000000000002
                      phone_masked: +99X•••••42
                      status: active
                      reminders_opt_out: false
                      last_login_at: 2026-03-01T04:15:00.000Z
                      created_at: 2026-03-01T04:15:00.000Z
                      version: 3
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "426":
          $ref: "#/components/responses/AppVersionUnsupported"
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
