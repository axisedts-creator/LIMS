      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - engagement.link_limit_reached
        - common.feature_disabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - patient_id
                - relationship
                - consented_by
                - identity_check_method
                - bind_phone
              properties:
                patient_id:
                  $ref: _common.yaml#/components/schemas/Uuid
                relationship:
                  type: string
                  maxLength: 7
                  enum:
                    - self
                    - child
                    - parent
                    - spouse
                    - sibling
                    - other
                consented_by:
                  type: string
                  maxLength: 8
                  enum:
                    - patient
                    - guardian
                identity_check_method:
                  type: string
                  maxLength: 17
                  enum:
                    - photo_id
                    - guardian_photo_id
                    - known_patient
                bind_phone:
                  type: string
                  maxLength: 6
                  enum:
                    - record
                    - other
                phone_e164:
                  type: string
                  maxLength: 16
                  pattern: ^\+[1-9][0-9]{7,14}$
              description: phone_e164 is required iff bind_phone = other (checked by the service).
            examples:
              synthetic:
                value:
                  patient_id: 01950c16-0000-7000-8000-000000000233
                  relationship: self
                  consented_by: patient
                  identity_check_method: photo_id
                  bind_phone: record
                  phone_e164: "+15550100123"
