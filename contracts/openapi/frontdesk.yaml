components:
  schemas:
    Actor:
      type: object
      additionalProperties: false
      required:
        - membership_id
        - display_name
      properties:
        membership_id:
          $ref: _common.yaml#/components/schemas/Uuid
        display_name:
          type: string
          maxLength: 200
    Totals:
      type: object
      additionalProperties: false
      required:
        - gross
        - discount
        - exempt
        - taxable
        - vat
        - other_tax
        - net
      properties:
        gross:
          $ref: _common.yaml#/components/schemas/Money
        discount:
          $ref: _common.yaml#/components/schemas/Money
        exempt:
          $ref: _common.yaml#/components/schemas/Money
        taxable:
          $ref: _common.yaml#/components/schemas/Money
        vat:
          $ref: _common.yaml#/components/schemas/Money
        other_tax:
          $ref: _common.yaml#/components/schemas/Money
        net:
          $ref: _common.yaml#/components/schemas/Money
    CodedSetEntry:
      type: object
      additionalProperties: false
      required:
        - code
        - display
        - sort_order
      properties:
        code:
          type: string
          maxLength: 64
          minLength: 1
        display:
          type: string
          maxLength: 200
        sort_order:
          type: integer
          minimum: 0
          maximum: 32767
    CodedSetList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/CodedSetEntry"
    OrderBalanceDto:
      type: object
      additionalProperties: false
      required:
        - order_id
        - invoiced
        - paid
        - credited
        - balance_due
        - balance_version
        - as_of
      properties:
        order_id:
          $ref: _common.yaml#/components/schemas/Uuid
        invoiced:
          $ref: _common.yaml#/components/schemas/Money
        paid:
          $ref: _common.yaml#/components/schemas/Money
        credited:
          $ref: _common.yaml#/components/schemas/Money
        balance_due:
          $ref: _common.yaml#/components/schemas/Money
        balance_version:
          type: integer
          minimum: 0
          maximum: 2147483647
        as_of:
          $ref: _common.yaml#/components/schemas/IsoUtc
    Party:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 200
        pan:
          type: string
          maxLength: 32
        address:
          type: string
          maxLength: 300
    InvoiceLine:
      type: object
      additionalProperties: false
      required:
        - id
        - line_no
        - line_kind
        - code
        - name
        - quantity
        - unit_price
        - gross
        - discount
        - exempt
        - taxable
        - vat
        - other_tax
        - net
        - credited
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuid
        line_no:
          type: integer
          minimum: 1
          maximum: 1000
        line_kind:
          type: string
          maxLength: 32
        orderable_id:
          $ref: _common.yaml#/components/schemas/Uuid
        code:
