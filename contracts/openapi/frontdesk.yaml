# contracts/openapi/frontdesk.yaml (C4) — transcription of spec/chunks/C4-frontdesk-billing/02-TRD.md §5.1 (T0C-10.C4; AC-0C-1.4/1.5).
# Generated once from the TRD tables, then owned by C4. Notes:
# - Examples are synthetic. E-mail fields show the placeholder "<synthetic-email>" (lint AB-20); phones use +1555 test numbers.
# - [CONV] IM rows also list common.version_conflict + common.precondition_required (02-CV §4.2); required-idem rows list common.idempotency_key_reused.
# - [CONV] shapes the TRD names without fields are marked [CONV] in their description.
# - P-8: read-only POSTs carry E3 per LD-10 (2026-11-07).
openapi: 3.0.3
info:
  title: LIMS frontdesk (C4)
  version: 1.0.0
  description: Transcribed from spec/chunks/C4-frontdesk-billing/02-TRD.md §5 (T0C-10.C4).
paths:
  /v1/frontdesk/patients/search:
    post:
      operationId: searchPatients
      tags:
        - frontdesk
      summary: Search patients (max 20, no cursor)
      description: Access log patient.search (detail mode, result_count; no query text).
      security:
        - bearerJwt: []
      x-permission: frontdesk.patient.read
      x-context: tenant
      x-idempotency: none
      x-idempotency-justification: "E3 read-only POST (LD-10): query/quote in the body, no state written, nothing to replay."
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchPatientsRequest"
            examples:
              synthetic:
                value:
                  query: Demo
                  mode: auto
                  limit: 20
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientSummaryList"
              examples:
                synthetic:
                  value:
                    data:
                      - id: 0193c4a0-0000-7000-8000-000000000001
                        patient_code: P-000001
                        full_name: Demo Patient A
                        sex: male
                        age_display: 43 Years
                        phone_masked: 15xxxxxx00
                        last_visit_at: 2026-11-05T04:15:00.000Z
                        is_anonymised: false
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
  /v1/frontdesk/patients:
    post:
      operationId: createPatient
      tags:
        - frontdesk
      summary: Create a patient
      description: frontdesk.patient_duplicate_suspected carries candidates:[PatientSummary].
      security:
        - bearerJwt: []
      x-permission: frontdesk.registration.create
      x-context: tenant
      x-idempotency: required
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
