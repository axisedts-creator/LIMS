                          currency: NPR
                        price_source: base
                        price_list_id: 0193c4a0-0000-7000-8000-000000000021
                        price_list_version: 1
                    totals:
                      gross:
                        amount_paisa: 150000
                        currency: NPR
                      discount:
                        amount_paisa: 150000
