            credit_note_no:
              type: string
              maxLength: 64
        print_count:
          type: integer
          minimum: 0
          maximum: 2147483647
        last_printed_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        cbms_state:
          type: string
          maxLength: 32
        cbms_cancel_state:
          type: string
          maxLength: 32
        version:
          $ref: _common.yaml#/components/schemas/Version
    LedgerEntryDto:
      type: object
      additionalProperties: false
      required:
        - id
        - entry_kind
        - capture_kind
        - method_code
        - amount
        - created_at
        - business_date_bs
