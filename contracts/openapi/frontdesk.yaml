        - invoiced
        - paid
        - credited
        - balance_due
        - balance_version
        - as_of
      properties:
        order_id:
          $ref: _common.yaml#/components/schemas/Uuid
        invoiced:
          $ref: _common.yaml#/components/schemas/Money
        paid:
          $ref: _common.yaml#/components/schemas/Money
        credited:
          $ref: _common.yaml#/components/schemas/Money
        balance_due:
          $ref: _common.yaml#/components/schemas/Money
        balance_version:
          type: integer
          minimum: 0
          maximum: 2147483647
        as_of:
          $ref: _common.yaml#/components/schemas/IsoUtc
    Party:
