  /v1/frontdesk/registrations/quote:
    post:
      operationId: quoteRegistration
      tags:
        - frontdesk
      summary: Quote a registration draft
      description: catalog.* codes are thrown by CatalogPort and propagated unchanged (08 R18).
      security:
        - bearerJwt: []
      x-permission: frontdesk.registration.create
      x-context: tenant
      x-idempotency: none
      x-idempotency-justification: "E3 read-only POST (LD-10): query/quote in the body, no state written, nothing to replay."
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - catalog.test_inactive
        - catalog.no_price
        - catalog.tax_config_missing
        - frontdesk.discount_exceeds_limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationDraft"
            examples:
              synthetic:
                value:
                  patient:
                    patient_id: 0193c4a0-0000-7000-8000-000000000014
                  centre_id: 0193c4a0-0000-7000-8000-000000000015
                  visit_type: opd
                  billing_mode: cash
                  credit_party_id: 0193c4a0-0000-7000-8000-000000000016
                  referrer_id: 0193c4a0-0000-7000-8000-000000000017
                  priority: routine
                  collection_mode: walk_in
                  items:
                    - orderable_id: 0193c4a0-0000-7000-8000-000000000018
                      priority: routine
                  discounts:
                    - scope: line
                      orderable_id: 0193c4a0-0000-7000-8000-000000000019
                      kind: amount
                      amount_paisa: 1
                      percent_bp: 1
                      reason_code: SYN_CODE
                      reason_text: Synthetic reason_text
                  buyer_pan: "000000000"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
