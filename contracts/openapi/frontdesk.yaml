        invoice:
          $ref: "#/components/schemas/InvoiceDto"
        credit_charges:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/CreditChargeDto"
        ledger_entries:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/LedgerEntryDto"
        balance:
          $ref: "#/components/schemas/OrderBalanceDto"
        print:
          type: object
          additionalProperties: false
          required:
            - receipt_ledger_entry_ids
          properties:
            invoice_id:
              $ref: _common.yaml#/components/schemas/Uuid
            receipt_ledger_entry_ids:
              type: array
              maxItems: 5
              items:
                $ref: _common.yaml#/components/schemas/Uuid
        notifications:
          type: object
          additionalProperties: false
          required:
            - registration_sms
          properties:
            registration_sms:
              type: string
              maxLength: 27
              enum:
                - queued
                - suppressed_no_consent
                - suppressed_no_contact
                - suppressed_channel_disabled
                - not_attempted
        label_print:
          type: object
          additionalProperties: false
          required:
            - autoprint
          properties:
            autoprint:
              type: boolean
    ConfirmOrderRequest:
      type: object
      additionalProperties: false
      required:
        - quote_fingerprint
        - payments
      properties:
        quote_fingerprint:
          $ref: "#/components/schemas/Fingerprint"
        payments:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/PaymentInput"
        discounts:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Discount"
        discount_approval_id:
          $ref: _common.yaml#/components/schemas/Uuid
        items_override:
          type: object
          additionalProperties: false
          required:
            - items
          properties:
            items:
              type: array
              maxItems: 50
              minItems: 1
              items:
                $ref: "#/components/schemas/RegistrationItem"
    ChangeOrderItemsRequest:
      type: object
      additionalProperties: false
      properties:
        add:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - orderable_id
              - priority
            properties:
              orderable_id:
                $ref: _common.yaml#/components/schemas/Uuid
              priority:
                type: string
                maxLength: 7
                enum:
                  - routine
                  - urgent
        remove:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - order_item_id
              - reason_code
            properties:
              order_item_id:
                $ref: _common.yaml#/components/schemas/Uuid
              reason_code:
                type: string
                maxLength: 64
                minLength: 1
                x-coded-set: frontdesk.item_removal_reasons
        quote_fingerprint:
          $ref: "#/components/schemas/Fingerprint"
        payments:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/PaymentInput"
      description: quote_fingerprint = F8b quote over exactly `add`; omitted when add is empty.
    CancelOrderRequest:
      type: object
      additionalProperties: false
      required:
        - reason_code
      properties:
        reason_code:
          type: string
          maxLength: 64
          minLength: 1
          x-coded-set: frontdesk.order_cancel_reasons
        reason_text:
          type: string
          maxLength: 500
    DiscountApprovalRequest:
      type: object
      additionalProperties: false
      required:
        - centre_id
        - base_fingerprint
        - discounts
        - reason_code
        - patient_ref
      properties:
        centre_id:
          $ref: _common.yaml#/components/schemas/Uuid
        base_fingerprint:
          $ref: "#/components/schemas/Fingerprint"
        discounts:
          type: array
          maxItems: 20
          minItems: 1
          items:
            $ref: "#/components/schemas/Discount"
        reason_code:
          type: string
          maxLength: 64
          minLength: 1
          x-coded-set: frontdesk.discount_reasons
        reason_text:
          type: string
          maxLength: 500
        patient_ref:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - patient_id
              properties:
                patient_id:
                  $ref: _common.yaml#/components/schemas/Uuid
            - type: object
              additionalProperties: false
              required:
                - draft_hash
              properties:
                draft_hash:
                  $ref: "#/components/schemas/Fingerprint"
    DiscountApproval:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - centre_id
        - requested_by
        - discounts
        - computed_discount
        - gross
        - percent_of_gross_bp
        - reason_code
        - expires_at
        - version
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuid
        status:
          type: string
          maxLength: 8
          enum:
            - pending
            - approved
            - rejected
            - expired
            - consumed
        centre_id:
          $ref: _common.yaml#/components/schemas/Uuid
        requested_by:
          $ref: "#/components/schemas/Actor"
        discounts:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Discount"
        computed_discount:
          $ref: _common.yaml#/components/schemas/Money
        gross:
          $ref: _common.yaml#/components/schemas/Money
        percent_of_gross_bp:
          type: integer
          minimum: 0
          maximum: 10000
        reason_code:
          type: string
          maxLength: 64
        reason_text:
          type: string
          maxLength: 500
        decided_by:
          $ref: "#/components/schemas/Actor"
        decided_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        note:
          type: string
          maxLength: 500
        expires_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        consumed_order_id:
          $ref: _common.yaml#/components/schemas/Uuid
        version:
          $ref: _common.yaml#/components/schemas/Version
    DiscountApprovalPage:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/DiscountApproval"
        page:
          $ref: _common.yaml#/components/schemas/PageInfo
    ApproveDiscountRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 500
    RejectDiscountRequest:
      type: object
      additionalProperties: false
      required:
        - note
      properties:
        note:
          type: string
          maxLength: 500
          minLength: 1
    TrfUploadForm:
      type: object
      additionalProperties: false
      required:
        - file
        - centre_id
      properties:
        file:
          type: string
          maxLength: 15728640
          format: binary
        centre_id:
          $ref: _common.yaml#/components/schemas/Uuid
        order_id:
          $ref: _common.yaml#/components/schemas/Uuid
    ResolveOrderFlagRequest:
      type: object
      additionalProperties: false
      required:
        - resolution_code
      properties:
        resolution_code:
          type: string
          maxLength: 64
          minLength: 1
          x-coded-set: frontdesk.flag_resolutions
        note:
          type: string
          maxLength: 500
    FrontdeskSettings:
      type: object
      additionalProperties: false
      required:
        - discount_self_limit_bp
        - discount_self_limit_paisa
        - discount_absolute_max_bp
        - require_referrer
        - consent_text_version
        - registration_sms_enabled
        - label_autoprint
        - buyer_pan_pattern
        - patient_search_min_chars
      properties:
        discount_self_limit_bp:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        discount_self_limit_paisa:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          format: int64
        discount_absolute_max_bp:
          type: integer
          minimum: 0
          maximum: 10000
          default: 10000
        require_referrer:
          type: boolean
          default: false
        consent_text_version:
          type: string
          maxLength: 32
          minLength: 1
        registration_sms_enabled:
          type: boolean
          default: true
        label_autoprint:
          type: boolean
          default: true
        buyer_pan_pattern:
          type: string
          maxLength: 200
          default: ^[0-9]{9}$
        patient_search_min_chars:
          type: integer
          minimum: 1
          maximum: 100
          default: 3
        version:
          $ref: _common.yaml#/components/schemas/Version
      description: 02-TRD §11.2. version is server-set (ignored on PUT; If-Match carries the version).
    PossibleDuplicate:
      type: object
      additionalProperties: false
      required:
        - patient
        - candidates
      properties:
        patient:
          $ref: "#/components/schemas/PatientSummary"
        candidates:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/PatientSummary"
    PossibleDuplicatePage:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/PossibleDuplicate"
        page:
          $ref: _common.yaml#/components/schemas/PageInfo
