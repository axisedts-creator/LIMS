          type: string
          maxLength: 32
        status:
          type: string
          maxLength: 32
        is_active:
          type: boolean
        issued_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        invoice_date_bs:
          type: string
          maxLength: 10
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        branch_id:
          $ref: _common.yaml#/components/schemas/Uuid
        centre_id:
          $ref: _common.yaml#/components/schemas/Uuid
        order_id:
          $ref: _common.yaml#/components/schemas/Uuid
        credit_party_id:
          $ref: _common.yaml#/components/schemas/Uuid
