        id:
          $ref: _common.yaml#/components/schemas/Uuid
        line_no:
          type: integer
          minimum: 1
          maximum: 1000
        line_kind:
          type: string
          maxLength: 32
        orderable_id:
          $ref: _common.yaml#/components/schemas/Uuid
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 200
        department_id:
          $ref: _common.yaml#/components/schemas/Uuid
        hs_code:
          type: string
          maxLength: 16
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
        unit_price:
          $ref: _common.yaml#/components/schemas/Money
        gross:
          $ref: _common.yaml#/components/schemas/Money
        discount:
          $ref: _common.yaml#/components/schemas/Money
        exempt:
          $ref: _common.yaml#/components/schemas/Money
        taxable:
          $ref: _common.yaml#/components/schemas/Money
        vat:
          $ref: _common.yaml#/components/schemas/Money
        other_tax:
          $ref: _common.yaml#/components/schemas/Money
        other_tax_code:
          type: string
          maxLength: 32
        net:
          $ref: _common.yaml#/components/schemas/Money
        credited:
          $ref: _common.yaml#/components/schemas/Money
    InvoiceDto:
      type: object
      additionalProperties: false
      required:
        - id
        - invoice_no
        - invoice_seq
        - series
        - fiscal_year_bs
        - invoice_kind
        - status
        - is_active
        - issued_at
        - invoice_date_bs
        - branch_id
        - is_periodic_credit_bill
        - buyer
        - seller
        - lines
        - totals
        - credited_total
        - print_count
        - cbms_state
        - version
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuid
        invoice_no:
          type: string
          maxLength: 64
        invoice_seq:
          type: integer
          minimum: 1
          maximum: 2147483647
        series:
          type: string
          maxLength: 64
        fiscal_year_bs:
          type: string
          maxLength: 9
          pattern: ^[0-9]{4}/[0-9]{2}$
