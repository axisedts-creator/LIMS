        vat:
          $ref: _common.yaml#/components/schemas/Money
        other_tax:
          $ref: _common.yaml#/components/schemas/Money
        net:
          $ref: _common.yaml#/components/schemas/Money
    CodedSetEntry:
      type: object
      additionalProperties: false
      required:
        - code
        - display
        - sort_order
      properties:
        code:
          type: string
          maxLength: 64
          minLength: 1
        display:
          type: string
          maxLength: 200
        sort_order:
          type: integer
          minimum: 0
          maximum: 32767
    CodedSetList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/CodedSetEntry"
    OrderBalanceDto:
      type: object
      additionalProperties: false
      required:
