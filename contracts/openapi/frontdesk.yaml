            - manual
            - gateway
            - home_collection
        order_id:
          $ref: _common.yaml#/components/schemas/Uuid
        invoice_id:
          $ref: _common.yaml#/components/schemas/Uuid
        credit_party_id:
          $ref: _common.yaml#/components/schemas/Uuid
        method_code:
          type: string
          maxLength: 64
        amount:
          $ref: _common.yaml#/components/schemas/Money
        reference_masked:
