        - credit_party_id
        - amount
        - period_month
        - status
        - created_at
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuid
        credit_party_id:
          $ref: _common.yaml#/components/schemas/Uuid
        order_id:
          $ref: _common.yaml#/components/schemas/Uuid
        invoice_id:
          $ref: _common.yaml#/components/schemas/Uuid
        amount:
          $ref: _common.yaml#/components/schemas/Money
        period_month:
          type: string
          maxLength: 7
