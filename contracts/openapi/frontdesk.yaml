                          amount_paisa: 150000
                          currency: NPR
                        taxable:
                          amount_paisa: 150000
                          currency: NPR
                        exempt:
                          amount_paisa: 150000
                          currency: NPR
                        vat:
                          amount_paisa: 150000
                          currency: NPR
                        other_tax:
                          amount_paisa: 150000
                          currency: NPR
                        other_tax_code: Synthetic other_tax_code
                        net:
