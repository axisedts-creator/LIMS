        - frontdesk.consent_required
        - common.idempotency_key_reused
      parameters:
        - $ref: _common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPatient"
            examples:
              synthetic:
                value:
                  full_name: Demo Patient A
                  sex: male
                  birth_on: 2026-11-05
                  age:
                    years: 1
                    months: 1
                    days: 1
                  phone_e164: "+15555550100"
                  email: <synthetic-email>
                  address_text: Synthetic Street 1
                  consents:
                    processing: true
                    sms: true
                    whatsapp: true
                    email: true
                    share_with_referrer: true
                    consent_text_version: Synthetic consent_text_version
                  duplicate_override:
                    reason_code: SYN_CODE
