        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
              examples:
                synthetic:
                  value:
                    id: 0193c4a0-0000-7000-8000-000000000002
                    patient_code: P-000001
                    full_name: Demo Patient A
                    sex: male
                    age_display: 43 Years
                    phone_masked: 15xxxxxx00
                    last_visit_at: 2026-11-05T04:15:00.000Z
                    is_anonymised: false
                    birth_on: 2026-11-05
                    is_birth_on_estimated: false
                    phone_e164: "+15555550100"
                    email: <synthetic-email>
                    address_text: Synthetic Street 1
                    consents:
                      processing: true
                      sms: true
                      whatsapp: true
                      email: true
                      share_with_referrer: true
                      consent_text_version: Synthetic consent_text_version
                    version: 1
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "409":
          $ref: _common.yaml#/components/responses/Conflict
        "422":
