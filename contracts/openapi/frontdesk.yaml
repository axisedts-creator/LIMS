        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.invalid_cursor
      parameters:
        - name: patient_id
          in: path
          required: true
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: sort
          in: query
          required: false
          schema:
            type: string
            maxLength: 14
            enum:
              - -registered_at
              - registered_at
          description: Leading `-` = descending; `id` is always appended (02-CV §4.4).
