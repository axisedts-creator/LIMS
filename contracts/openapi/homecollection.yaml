components:
  parameters:
    AppVersion:
      name: X-Lims-App-Version
      in: header
      required: true
      schema:
        type: string
        minLength: 5
        maxLength: 20
        pattern: ^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$
    DeviceId:
      name: X-Lims-Device-Id
      in: header
      required: true
      description: Must equal every device_id in path, query or body (TRD §5 preamble).
      schema:
        $ref: _common.yaml#/components/schemas/Uuidv7
  responses:
    AppVersionUnsupported:
      description: App version below the tenant minimum (REQ-SEC-113, CR-C17-007).
      content:
        application/problem+json:
          schema:
            $ref: _common.yaml#/components/schemas/Problem
          examples:
            app_version_unsupported:
              value:
                type: urn:lims:error:homecollection.app_version_unsupported
                title: App update required
                status: 426
                code: homecollection.app_version_unsupported
                request_id: 01950c17-0000-7000-8000-0000001f0001
  schemas:
    MembershipRef:
      type: object
      additionalProperties: false
      required:
        - membership_id
        - display_name
      properties:
        membership_id:
          $ref: _common.yaml#/components/schemas/Uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 200
    SpecimensSummary:
      type: object
      additionalProperties: false
      required:
        - expected
        - collected
        - held
        - received
        - rejected
      properties:
        expected:
          type: integer
          minimum: 0
          maximum: 1000
        collected:
          type: integer
          minimum: 0
          maximum: 1000
        held:
          type: integer
          minimum: 0
          maximum: 1000
        received:
          type: integer
          minimum: 0
          maximum: 1000
        rejected:
          type: integer
          minimum: 0
          maximum: 1000
    Address:
      type: object
      additionalProperties: false
      required:
        - address_text
      properties:
        address_text:
          type: string
          minLength: 1
          maxLength: 500
        landmark:
          type: string
          minLength: 1
          maxLength: 200
        latitude:
          $ref: _common.yaml#/components/schemas/DecimalString
        longitude:
          $ref: _common.yaml#/components/schemas/DecimalString
    Gps:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          maxLength: 11
          enum:
            - off
            - denied
            - unavailable
            - ok
        latitude:
          $ref: _common.yaml#/components/schemas/DecimalString
        longitude:
          $ref: _common.yaml#/components/schemas/DecimalString
        accuracy_m:
          type: integer
          minimum: 0
          maximum: 10000
    PaymentMethod:
      type: object
      additionalProperties: false
      required:
        - code
        - display
        - requires_reference
      properties:
        code:
          $ref: _common.yaml#/components/schemas/Code
        display:
          type: string
          minLength: 1
          maxLength: 40
