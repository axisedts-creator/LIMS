      summary: Push a batch of offline mutations (Idempotency-Key = batch_id) (TRD §5 A3)
      security:
        - bearerJwt: []
      x-permission: homecollection.sync.upload
      x-context: tenant
      x-idempotency: required
      x-rate-limit-tier: general
      x-error-codes:
