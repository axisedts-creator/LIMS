# contracts/openapi/homecollection.yaml (C17) — transcription of spec/chunks/C17-home-collection/02-TRD.md §5.1 (H1–H21), §5.2 (A1–A5), §5.3/§5.3.1 (DTOs),
# §6.3 (Mutation union), §11.2 (settings); 26 ops (T0C-10.C17; AC-0C-1.4/1.5).
# LD-103 (2026-11-11): wave-2 transcription scheduled by the human lead; owner approval given by that decision. Generated once from the TRD tables, then owned by C17.
# Notes:
# - Examples are synthetic (uuids 01950c17-0000-7000-8000-…, "Synthetic …" labels, "Test Patient 00nn", phone +1555…). The TRD §6.2 example phone is replaced.
# - Every op lists the five common codes; common.not_found on ops with a path parameter (and H11, §5.4.4); A1–A5 add app_version_unsupported (426),
#   device_not_registered (409) and common.id_mismatch; privileged permissions add auth.mfa_required; required-idempotency ops add the three idempotency
#   codes and the Idempotency-Key header; optional-idempotency ops declare no header (wave-1 convention). Error responses derive from errors.yaml http.
# - [CONV] If-Match on H3 H4 H5 H6 H8 H9 H11 H15 H17 H19 (actions on versioned resources, TRD §5 preamble); none on H7 (creates a new visit), H21 (no state),
#   A1–A5 (device-id binding instead).
# - [CONV] §5.3.1 "if" presence rules (08 A13 P-5) are kept as optional fields: lint rule 2 forbids if/then in OAS 3.0 schemas; the server enforces presence.
#   visit_id is absent from MutationHandoverRecorded. SnapshotDto.visits = oneOf [SnapshotVisit, SnapshotStub] with discriminator status.
# - [CONV] Detail DTOs (VisitDetailDto, HandoverDetailDto) are flat copies of the summary fields (closed schemas cannot be combined with allOf).
# - [CONV] enums copied from 05-SCHEMA CHECK constraints; coded sets homecollection.<set_code> (05-SCHEMA §2); X-Lims-App-Version / min_app_version use the
#   settings__min_app_version__ck pattern; payment amount 1..50,000,000 paisa (TRD §6.3 [CONV]).
openapi: 3.0.3
info:
  title: LIMS home collection (C17)
  version: 1.0.0
  description: Transcribed from spec/chunks/C17-home-collection/02-TRD.md §5.1–§5.3.1, §6.3, §11.2 (T0C-10.C17, LD-103).
paths:
  /v1/homecollection/visits:
    get:
      operationId: listHomeVisits
      tags:
        - homecollection
      summary: List home visits for the dispatch board (TRD §5 H1)
      security:
        - bearerJwt: []
      x-permission: homecollection.visit.read
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.invalid_cursor
      parameters:
        - name: route_date
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/IsoDate
        - name: window_from
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: window_to
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: status
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
            pattern: ^[a-z_]+(,[a-z_]+)*$
            description: csv of visit statuses
        - name: centre_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: phlebotomist_membership_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: unassigned_only
          in: query
          required: false
          schema:
            type: boolean
        - name: has_open_flags
          in: query
          required: false
          schema:
            type: boolean
        - name: kind
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
            pattern: ^[a-z_]+(,[a-z_]+)*$
            description: csv of visit kinds
        - name: sort
          in: query
          required: false
          schema:
            type: string
            maxLength: 14
            enum:
              - window_start
              - -window_start
              - route_sequence
              - created_at
              - -created_at
        - $ref: _common.yaml#/components/parameters/Limit
        - $ref: _common.yaml#/components/parameters/Cursor
      responses:
        "200":
          description: Page of visits.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/VisitSummaryDto"
                  page:
                    $ref: _common.yaml#/components/schemas/PageInfo
              examples:
                synthetic:
                  value:
                    data:
                      - id: 01950c17-0000-7000-8000-000000130001
                        version: 3
                        kind: booking
                        status: assigned
                        centre_id: 01950c17-0000-7000-8000-000000020009
                        branch_id: 01950c17-0000-7000-8000-000000020010
                        order_id: 01950c17-0000-7000-8000-000000050002
                        patient_id: 01950c17-0000-7000-8000-000000040042
                        patient_display_name: Test Patient 0042
                        window_start: 2026-11-06T01:15:00.000Z
                        window_end: 2026-11-06T01:45:00.000Z
                        route_id: 01950c17-0000-7000-8000-000000170001
                        route_date: 2026-11-06
                        route_sequence: 1
                        phlebotomist:
                          membership_id: 01950c17-0000-7000-8000-000000160001
                          display_name: Synthetic Phlebotomist 01
                        area_hint: House 12, Synthetic Tole, Ward 4
                        open_flag_kinds: []
                        specimens_summary:
                          expected: 1
                          collected: 0
                          held: 0
                          received: 0
                          rejected: 0
                    page:
                      limit: 50
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
