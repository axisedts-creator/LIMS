                    aal: aal2
                    idle_expires_at: 2026-11-05T04:45:00.000Z
                    absolute_expires_at: 2026-11-05T16:15:00.000Z
                    actor: { display_name: Demo Lab Admin, tenant_code: demo_lab, roles: [ tenant_admin ] }
        "400": { $ref: _common.yaml#/components/responses/BadRequest }
        "401": { $ref: _common.yaml#/components/responses/Unauthorized }
        "409": { $ref: _common.yaml#/components/responses/Conflict }
