# contracts/openapi/identity.yaml (C2) — transcription of spec/chunks/C2-identity-admin/02-TRD.md §5 (T0C-10.C2; AC-0C-1.4/1.5).
# Generated once from the TRD tables, then owned by C2. Notes:
# - Examples are synthetic. E-mail fields show the placeholder "<synthetic-email>" (lint AB-20 rejects e-mail-shaped strings).
# - [CONV] audit old_values/new_values and access-log detail are JSON objects serialised as text: free-form maps cannot satisfy
#   lint rule 3 (additionalProperties: false) and OAS 3.0 has no patternProperties.
# - Open conflicts with lint (see .orchestra/cr/T0C-10.C2.md): POSTs with x-idempotency none outside E1/E2; tenant_id in openSupportSession body.
openapi: 3.0.3
info: { title: LIMS identity (C2), version: 1.0.0, description: Transcribed from spec/chunks/C2-identity-admin/02-TRD.md §5 (T0C-10.C2). }
paths:
  /v1/identity/auth/login:
    post:
      operationId: loginStaff
      tags: [ identity ]
      summary: Staff login (email + password)
      security: []
      x-public: pre-authentication; reachable only from the BFF network (CR-C2-012)
      x-context: identity_auth
      x-edge-exposure: internal
      x-idempotency: none
      x-idempotency-justification: "E1 secret shown once: the 2xx body carries the BFF session token; storing it for replay would persist the secret."
      x-rate-limit-tier: login
      x-error-codes: [ auth.login_failed, auth.step_up_required, auth.account_locked, identity.membership_inactive, identity.tenant_suspended, identity.platform_ip_denied ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            examples:
              synthetic:
                value: { email: <synthetic-email>, password: synthetic-password-1 }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
              examples:
                synthetic:
                  value:
                    session_token: SyntheticOpaqueSessionToken_xxxxxxxxxxxxxxx
                    session:
                      session_id: 0193a5c0-0000-7000-8000-000000000001
                      kind: tenant_staff
                      state: mfa_pending
                      aal: aal1
                      idle_expires_at: 2026-11-05T04:45:00.000Z
                      absolute_expires_at: 2026-11-05T16:15:00.000Z
                      actor: { display_name: Demo Lab Admin, tenant_code: demo_lab, roles: [ tenant_admin ] }
        "400": { $ref: _common.yaml#/components/responses/BadRequest }
        "401": { $ref: _common.yaml#/components/responses/Unauthorized }
        "403": { $ref: _common.yaml#/components/responses/Forbidden }
        "429": { $ref: _common.yaml#/components/responses/TooManyRequests }
        "500": { $ref: _common.yaml#/components/responses/Internal }
  /v1/identity/auth/mfa/verify:
    post:
      operationId: verifyMfaChallenge
      tags: [ identity ]
      summary: Verify the MFA code of a pending login
      security:
        - { bffSession: [] }
