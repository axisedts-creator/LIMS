        "401": { $ref: _common.yaml#/components/responses/Unauthorized }
        "403": { $ref: _common.yaml#/components/responses/Forbidden }
        "429": { $ref: _common.yaml#/components/responses/TooManyRequests }
        "500": { $ref: _common.yaml#/components/responses/Internal }
components:
  schemas:
    SessionState:
      type: object
      additionalProperties: false
      required: [ session_id, kind, state, aal, idle_expires_at, absolute_expires_at, actor ]
      properties:
        session_id: { $ref: _common.yaml#/components/schemas/Uuid }
        kind: { type: string, maxLength: 12, enum: [ tenant_staff, platform, partner, patient, staff_mobile ] }
        state: { type: string, maxLength: 22, enum: [ password_setup, mfa_pending, mfa_enrolment_required, active ] }
        aal: { type: string, maxLength: 4, enum: [ aal1, aal2 ] }
        idle_expires_at: { $ref: _common.yaml#/components/schemas/IsoUtc }
        absolute_expires_at: { $ref: _common.yaml#/components/schemas/IsoUtc }
        actor:
          type: object
          additionalProperties: false
          required: [ display_name, roles ]
          properties:
            display_name: { type: string, maxLength: 120, minLength: 1 }
            tenant_code: { type: string, maxLength: 32, pattern: "^[a-z][a-z0-9_]{2,31}$" }
            roles:
              type: array
              maxItems: 20
              items: { type: string, maxLength: 40 }
            support_session:
              type: object
              additionalProperties: false
              required: [ id, tenant_code, scope, expires_at ]
              properties:
                id: { $ref: _common.yaml#/components/schemas/Uuid }
                tenant_code: { type: string, maxLength: 32, pattern: "^[a-z][a-z0-9_]{2,31}$" }
                scope: { type: string, maxLength: 9, enum: [ read_only, admin ] }
                expires_at: { $ref: _common.yaml#/components/schemas/IsoUtc }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [ email, password ]
      properties:
        email: { type: string, maxLength: 254, format: email, minLength: 3 }
        password: { type: string, maxLength: 128, minLength: 1 }
    LoginResult:
      type: object
      additionalProperties: false
      required: [ session_token, session ]
      properties:
        session_token: { type: string, maxLength: 43, minLength: 43, pattern: "^[A-Za-z0-9_-]{43}$" }
        session: { $ref: "#/components/schemas/SessionState" }
    MfaCodeRequest:
      type: object
      additionalProperties: false
      required: [ code ]
      properties:
        code: { type: string, maxLength: 6, pattern: "^[0-9]{6}$" }
    MfaEnrolmentStartRequest:
      type: object
      additionalProperties: false
      properties:
        friendly_name: { type: string, maxLength: 40, minLength: 1 }
    MfaEnrolmentStart:
      type: object
      additionalProperties: false
      required: [ factor_id, otpauth_uri, secret_base32 ]
      properties:
        factor_id: { $ref: _common.yaml#/components/schemas/Uuid }
        otpauth_uri: { type: string, maxLength: 512, pattern: ^otpauth:// }
        qr_svg_base64: { type: string, maxLength: 20000 }
        secret_base32: { type: string, maxLength: 64, pattern: "^[A-Z2-7]+=*$" }
    SessionResolveRequest:
      type: object
      additionalProperties: false
      required: [ touch ]
      properties:
        touch: { type: boolean }
    ResolvedSession:
      type: object
      additionalProperties: false
      required: [ access_token, access_expires_at, session ]
      properties:
        access_token: { type: string, maxLength: 4096, minLength: 1 }
        access_expires_at: { $ref: _common.yaml#/components/schemas/IsoUtc }
        session: { $ref: "#/components/schemas/SessionState" }
    PasswordRecoveryRequest:
      type: object
      additionalProperties: false
      required: [ email ]
      properties:
        email: { type: string, maxLength: 254, format: email, minLength: 3 }
    Empty:
      type: object
      additionalProperties: false
      properties: {}
    EmailTokenConfirmRequest:
      type: object
      additionalProperties: false
      required: [ token_hash, type ]
      properties:
        token_hash: { type: string, maxLength: 256, minLength: 1 }
        type: { type: string, maxLength: 8, enum: [ invite, recovery ] }
    PasswordSetRequest:
      type: object
      additionalProperties: false
      required: [ new_password ]
      properties:
        new_password: { type: string, maxLength: 128, minLength: 1 }
    MobileSessionOpenRequest:
      type: object
      additionalProperties: false
      required: [ email, password, app_instance_id, app_platform ]
      properties:
        email: { type: string, maxLength: 254, format: email, minLength: 3 }
        password: { type: string, maxLength: 128, minLength: 1 }
        app_instance_id: { $ref: _common.yaml#/components/schemas/Uuid }
        app_platform: { type: string, maxLength: 7, enum: [ android, ios ] }
    MobileSessionTokenRequest:
      type: object
      additionalProperties: false
      required: [ session_token ]
      properties:
        session_token: { type: string, maxLength: 43, minLength: 43, pattern: "^[A-Za-z0-9_-]{43}$" }
    MobileSession:
      type: object
      additionalProperties: false
      required: [ session_token, access_token, access_expires_at, session_expires_at, session ]
      properties:
        session_token: { type: string, maxLength: 43, minLength: 43, pattern: "^[A-Za-z0-9_-]{43}$" }
        access_token: { type: string, maxLength: 4096, minLength: 1 }
        access_expires_at: { $ref: _common.yaml#/components/schemas/IsoUtc }
        session_expires_at: { $ref: _common.yaml#/components/schemas/IsoUtc }
        session: { $ref: "#/components/schemas/SessionState" }
    RoleRef:
      type: object
      additionalProperties: false
      required: [ role_id, code, name ]
      properties:
        role_id: { $ref: _common.yaml#/components/schemas/Uuid }
        code: { type: string, maxLength: 40, pattern: "^[a-z][a-z0-9_]{1,39}$" }
        name: { type: string, maxLength: 80, minLength: 1 }
    CentreScope:
      type: object
      additionalProperties: false
      required: [ all, centre_ids ]
      properties:
        all: { type: boolean }
        centre_ids:
          type: array
          maxItems: 200
          items: { $ref: _common.yaml#/components/schemas/Uuid }
    Me:
      type: object
      additionalProperties: false
      required: [ membership_id, display_name, email, roles, permissions, centre_scope, mfa ]
      properties:
        membership_id: { $ref: _common.yaml#/components/schemas/Uuid }
        display_name: { type: string, maxLength: 120, minLength: 1 }
        email: { type: string, maxLength: 254, format: email, minLength: 3 }
        roles:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/RoleRef" }
        permissions:
          type: array
          maxItems: 500
          items: { type: string, maxLength: 100 }
        centre_scope: { $ref: "#/components/schemas/CentreScope" }
        mfa:
          type: object
          additionalProperties: false
          required: [ enrolled, level ]
          properties:
            enrolled: { type: boolean }
            level: { type: string, maxLength: 4, enum: [ aal1, aal2 ] }
        last_login_at: { $ref: _common.yaml#/components/schemas/IsoUtc }
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [ current_password, new_password ]
      properties:
        current_password: { type: string, maxLength: 128, minLength: 1 }
        new_password: { type: string, maxLength: 128, minLength: 1 }
    SessionSummary:
      type: object
      additionalProperties: false
      required: [ session_id, display_name, state, aal, created_at, last_seen_at, idle_expires_at, absolute_expires_at, is_support ]
      properties:
        session_id: { $ref: _common.yaml#/components/schemas/Uuid }
        membership_id: { $ref: _common.yaml#/components/schemas/Uuid }
        platform_staff_id: { $ref: _common.yaml#/components/schemas/Uuid }
        display_name: { type: string, maxLength: 120 }
        state: { type: string, maxLength: 22, enum: [ password_setup, mfa_pending, mfa_enrolment_required, active, revoked, expired ] }
        aal: { type: string, maxLength: 4, enum: [ aal1, aal2 ] }
        created_at: { $ref: _common.yaml#/components/schemas/IsoUtc }
        last_seen_at: { $ref: _common.yaml#/components/schemas/IsoUtc }
        idle_expires_at: { $ref: _common.yaml#/components/schemas/IsoUtc }
        absolute_expires_at: { $ref: _common.yaml#/components/schemas/IsoUtc }
        client_ip_masked: { type: string, maxLength: 64 }
        user_agent_family: { type: string, maxLength: 64 }
        is_support: { type: boolean }
    SessionSummaryPage:
      type: object
      additionalProperties: false
      required: [ data, page ]
      properties:
        data:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/SessionSummary" }
        page: { $ref: _common.yaml#/components/schemas/PageInfo }
    MfaFactor:
      type: object
      additionalProperties: false
      required: [ factor_id, status ]
      properties:
        factor_id: { $ref: _common.yaml#/components/schemas/Uuid }
        friendly_name: { type: string, maxLength: 40 }
        status: { type: string, maxLength: 10, enum: [ unverified, verified, removed ] }
        verified_at: { $ref: _common.yaml#/components/schemas/IsoUtc }
    MfaFactorList:
      type: object
      additionalProperties: false
      required: [ data ]
      properties:
        data:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/MfaFactor" }
    UserSummary:
      type: object
      additionalProperties: false
      required: [ membership_id, display_name, email_masked, status, is_locked, roles, all_centres, centre_count, mfa_enrolled, version ]
      properties:
        membership_id: { $ref: _common.yaml#/components/schemas/Uuid }
        display_name: { type: string, maxLength: 120, minLength: 1 }
        email_masked: { type: string, maxLength: 254 }
        status: { type: string, maxLength: 11, enum: [ invited, active, deactivated ] }
        is_locked: { type: boolean }
        roles:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/RoleRef" }
        all_centres: { type: boolean }
        centre_count: { type: integer, minimum: 0, maximum: 100000 }
        mfa_enrolled: { type: boolean }
        last_login_at: { $ref: _common.yaml#/components/schemas/IsoUtc }
        version: { $ref: _common.yaml#/components/schemas/Version }
    UserPage:
      type: object
      additionalProperties: false
      required: [ data, page ]
      properties:
        data:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/UserSummary" }
        page: { $ref: _common.yaml#/components/schemas/PageInfo }
    User:
      type: object
      additionalProperties: false
      required: [ membership_id, display_name, email_masked, status, is_locked, roles, all_centres, centre_count, mfa_enrolled, version, branch_ids, centre_ids ]
      properties:
        membership_id: { $ref: _common.yaml#/components/schemas/Uuid }
        display_name: { type: string, maxLength: 120, minLength: 1 }
        email_masked: { type: string, maxLength: 254 }
        status: { type: string, maxLength: 11, enum: [ invited, active, deactivated ] }
        is_locked: { type: boolean }
        roles:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/RoleRef" }
        all_centres: { type: boolean }
        centre_count: { type: integer, minimum: 0, maximum: 100000 }
        mfa_enrolled: { type: boolean }
        last_login_at: { $ref: _common.yaml#/components/schemas/IsoUtc }
        version: { $ref: _common.yaml#/components/schemas/Version }
        phone_masked: { type: string, maxLength: 20 }
        branch_ids:
          type: array
          maxItems: 50
          items: { $ref: _common.yaml#/components/schemas/Uuid }
        centre_ids:
          type: array
          maxItems: 200
          items: { $ref: _common.yaml#/components/schemas/Uuid }
        signatory:
          type: object
          additionalProperties: false
          properties:
            display_title: { type: string, maxLength: 80 }
            registration_no: { type: string, maxLength: 40 }
            signature_asset_id: { $ref: _common.yaml#/components/schemas/Uuid }
        lock:
          type: object
