        claimed_instrument_id:
          $ref: _common.yaml#/components/schemas/Uuid
        agent_message_id:
          $ref: _common.yaml#/components/schemas/Uuid
        reason_code:
          type: string
          maxLength: 30
          enum:
            - instruments.instrument_unknown
            - instruments.device_mismatch
            - instruments.message_too_large
        size_bytes:
          type: integer
          minimum: 0
          maximum: 2147483647
        raw_sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
      description: Never carries raw bytes.
    Message:
      type: object
      additionalProperties: false
      required:
        - agent_message_id
        - instrument_id
        - protocol
        - kind
        - raw_base64
        - raw_sha256
        - captured_at_agent
        - clock_offset_ms
      properties:
        agent_message_id:
          $ref: _common.yaml#/components/schemas/Uuidv7
        instrument_id:
          $ref: _common.yaml#/components/schemas/Uuidv7
        protocol:
          type: string
          maxLength: 5
          enum:
            - astm
            - hl7v2
        kind:
          type: string
          maxLength: 10
          enum:
            - data
            - incomplete
            - host_query
        raw_base64:
          type: string
          maxLength: 1398104
          pattern: ^[A-Za-z0-9+/]*={0,2}$
          minLength: 4
          description: ≤ 1,398,104 chars ≈ 1 MiB decoded.
        raw_sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
        captured_at_agent:
          $ref: _common.yaml#/components/schemas/IsoUtc
        clock_offset_ms:
          type: integer
          minimum: -1000000000
          maximum: 1000000000
        link_meta:
          type: object
          additionalProperties: false
          properties:
            frames:
              type: integer
              minimum: 0
              maximum: 2147483647
            retransmits:
              type: integer
              minimum: 0
              maximum: 2147483647
            naks_sent:
              type: integer
              minimum: 0
              maximum: 2147483647
            mllp_discarded_bytes:
              type: integer
              minimum: 0
              maximum: 2147483647
            incomplete_reason:
              type: string
              maxLength: 15
              enum:
                - frame_timeout
                - new_enq
                - new_start_block
                - msh_unparseable
                - process_restart
    Heartbeat:
      type: object
      additionalProperties: false
      required:
        - sent_at_agent
        - agent_version
        - launcher_version
        - os_version
        - queue
        - disk_free_mb
        - clock_offset_ms
        - clock_offset_uncertainty_ms
        - config
        - update
        - auth_state
        - instruments
        - counters
        - command_results
      properties:
        sent_at_agent:
          $ref: _common.yaml#/components/schemas/IsoUtc
        agent_version:
          type: string
          maxLength: 32
        launcher_version:
          type: string
          maxLength: 32
        os_version:
          type: string
          maxLength: 64
        queue:
          type: object
          additionalProperties: false
          required:
            - pending
            - uploading
            - rejected
            - oversize
            - uploaded_retained
            - oldest_pending_age_seconds
          properties:
            pending:
              type: integer
              minimum: 0
              maximum: 2147483647
            uploading:
              type: integer
              minimum: 0
              maximum: 2147483647
            rejected:
              type: integer
              minimum: 0
              maximum: 2147483647
            oversize:
              type: integer
              minimum: 0
              maximum: 2147483647
            uploaded_retained:
              type: integer
              minimum: 0
              maximum: 2147483647
            oldest_pending_age_seconds:
              type: integer
              minimum: 0
              maximum: 2147483647
        disk_free_mb:
          type: integer
          minimum: 0
          maximum: 2147483647
        clock_offset_ms:
          type: integer
          minimum: -1000000000
          maximum: 1000000000
        clock_offset_uncertainty_ms:
          type: integer
          minimum: 0
          maximum: 1000000000
        config:
          type: object
          additionalProperties: false
          required:
            - applied_version
            - state
          properties:
            applied_version:
              type: integer
              minimum: 0
              maximum: 2147483647
            state:
              type: string
              maxLength: 17
              enum:
                - ok
                - signature_invalid
                - agent_mismatch
                - rollback_rejected
                - schema_invalid
        update:
          type: object
          additionalProperties: false
          required:
            - state
          properties:
            state:
              type: string
              maxLength: 13
              enum:
                - idle
                - downloading
                - verifying
                - staged
                - applying
                - rolled_back
                - verify_failed
                - failed
            target_version:
              type: string
              maxLength: 32
            error_code:
              type: string
              maxLength: 64
        auth_state:
          type: string
          maxLength: 8
          enum:
            - ok
            - rejected
        instruments:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - instrument_id
              - link_state
              - messages_last_interval
              - errors_last_interval
            properties:
              instrument_id:
                $ref: _common.yaml#/components/schemas/Uuid
              link_state:
                type: string
                maxLength: 10
                enum:
                  - up
                  - down
                  - listening
                  - connecting
                  - error
                  - disabled
              last_message_at_agent:
                $ref: _common.yaml#/components/schemas/IsoUtc
              messages_last_interval:
                type: integer
                minimum: 0
                maximum: 2147483647
              errors_last_interval:
                type: integer
                minimum: 0
                maximum: 2147483647
              last_error_code:
                type: string
                maxLength: 64
        counters:
          type: object
          additionalProperties: false
          required:
            - astm_naks_sent
            - astm_naks_received
            - astm_incomplete_sessions
            - mllp_discarded_bytes
            - mllp_oversize
            - host_query_unavailable
          properties:
            astm_naks_sent:
              type: integer
              minimum: 0
              maximum: 2147483647
            astm_naks_received:
              type: integer
              minimum: 0
              maximum: 2147483647
            astm_incomplete_sessions:
              type: integer
              minimum: 0
              maximum: 2147483647
            mllp_discarded_bytes:
              type: integer
              minimum: 0
              maximum: 2147483647
            mllp_oversize:
              type: integer
              minimum: 0
              maximum: 2147483647
            host_query_unavailable:
              type: integer
              minimum: 0
              maximum: 2147483647
        command_results:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required:
              - command_id
              - state
            properties:
              command_id:
                $ref: _common.yaml#/components/schemas/Uuid
              state:
                type: string
                maxLength: 9
                enum:
                  - completed
                  - failed
              result_code:
                type: string
                maxLength: 64
    ConfigUpdateTarget:
      type: object
      additionalProperties: false
      required:
        - release_id
        - version
        - package_sha256
        - package_size
        - signature
        - key_id
        - authenticode_publisher
      properties:
        release_id:
          $ref: _common.yaml#/components/schemas/Uuidv7
        version:
          type: string
          maxLength: 32
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        package_sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
        package_size:
          type: integer
          minimum: 1
          maximum: 2147483647
        signature:
          type: string
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        key_id:
          type: string
          maxLength: 32
        authenticode_publisher:
          type: string
          maxLength: 200
    ConfigInstrument:
      type: object
      additionalProperties: false
      required:
        - instrument_id
        - instrument_code
        - state
        - protocol
        - driver_code
        - transport
        - capabilities
      properties:
        instrument_id:
          $ref: _common.yaml#/components/schemas/Uuid
        instrument_code:
          type: string
          maxLength: 32
          minLength: 2
          pattern: ^[A-Z0-9-]{2,32}$
        state:
          type: string
          maxLength: 13
          enum:
            - commissioning
            - live
            - suspended
        protocol:
          type: string
          maxLength: 9
          enum:
            - astm
            - hl7v2
            - file_drop
        driver_code:
          type: string
          maxLength: 64
        transport:
          $ref: "#/components/schemas/Transport"
        protocol_options:
          $ref: "#/components/schemas/ProtocolOptions"
        file_drop:
          $ref: "#/components/schemas/FileDropOptions"
        capabilities:
          $ref: "#/components/schemas/InstrumentCapabilities"
    ConfigDocument:
      type: object
      additionalProperties: false
      required:
        - schema
        - agent_id
        - centre_id
        - config_version
        - issued_at
        - heartbeat_interval_seconds
        - upload
        - rate_budget
        - tls
        - log_level
        - update
        - instruments
      properties:
        schema:
          type: string
          maxLength: 21
          enum:
            - lims.bridge.config.v1
        agent_id:
          $ref: _common.yaml#/components/schemas/Uuid
        centre_id:
          $ref: _common.yaml#/components/schemas/Uuid
        config_version:
          type: integer
          minimum: 1
          maximum: 2147483647
        issued_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        heartbeat_interval_seconds:
          type: integer
          minimum: 1
          maximum: 86400
        upload:
          type: object
          additionalProperties: false
          required:
            - max_batch_messages
            - max_batch_bytes
            - flush_interval_seconds
            - uploaded_retention_hours
          properties:
            max_batch_messages:
              type: integer
              minimum: 1
              maximum: 100
            max_batch_bytes:
              type: integer
              minimum: 1
              maximum: 4194304
            flush_interval_seconds:
              type: integer
              minimum: 1
              maximum: 3600
            uploaded_retention_hours:
              type: integer
              minimum: 1
              maximum: 72
        rate_budget:
          type: object
          additionalProperties: false
          required:
            - requests_per_minute
            - reserved_host_query_per_minute
            - reserved_heartbeat_per_minute
          properties:
            requests_per_minute:
              type: integer
              minimum: 1
              maximum: 100000
            reserved_host_query_per_minute:
              type: integer
              minimum: 0
              maximum: 100000
            reserved_heartbeat_per_minute:
              type: integer
              minimum: 0
              maximum: 100000
        tls:
          type: object
          additionalProperties: false
          required:
            - spki_pins_sha256
          properties:
            spki_pins_sha256:
              type: array
              maxItems: 8
              items:
                type: string
                minLength: 64
                maxLength: 64
                pattern: ^[0-9a-f]{64}$
        log_level:
          type: string
          maxLength: 16
          minLength: 1
        update:
          type: object
          additionalProperties: false
          required:
            - channel
            - allow_downgrade
          properties:
            channel:
              type: string
              maxLength: 6
              enum:
                - stable
                - beta
            target:
              $ref: "#/components/schemas/ConfigUpdateTarget"
            allow_downgrade:
              type: boolean
            window:
              type: object
              additionalProperties: false
              required:
                - from
                - to
                - timezone
              properties:
                from:
                  type: string
                  maxLength: 5
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                to:
                  type: string
                  maxLength: 5
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                timezone:
                  type: string
                  maxLength: 64
                  minLength: 1
        instruments:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ConfigInstrument"
      description: Signed document lims.bridge.config.v1 (§5.10). [CONV] closed per 02-CV §4 rule 3; an absent target/window/file_drop stands for the TRD's null.
  responses:
    DeviceTokenInvalid:
      description: Device credential missing, unknown, revoked or of the wrong kind.
      content:
        application/problem+json:
          schema:
            $ref: _common.yaml#/components/schemas/Problem
          examples:
            device_token_invalid:
              value:
                type: urn:lims:error:auth.device_token_invalid
                title: Device not authorised
                status: 401
                code: auth.device_token_invalid
                request_id: 01933b6f-0a11-7e2b-8c55-1d2e3f405162
