# contracts/openapi/instruments.yaml (C7) — transcription of spec/chunks/C7-instrument-integration/02-TRD.md §7.2–§7.4 (T0C-10.C7; AC-0C-1.4/1.5).
# Generated once from the TRD tables, then owned by C7. Notes:
# - Examples are synthetic (uuids 01a1a98a-ac40-7000-8000-…, "Synthetic …" strings, RFC 5737 IPs, placeholder credentials).
# - [CONV] staff ops list the six common codes; device ops list auth.device_token_invalid + validation_failed, rate_limited, internal.
# - [CONV] IM rows list common.version_conflict + common.precondition_required; required-idem rows list common.idempotency_key_reused; paged rows common.invalid_cursor.
# - [CONV] optional-idem rows declare an optional Idempotency-Key header. P-8 / LD-10: E01/E14 = E1 (secret in response), E34 = E3 (read-only POST).
# - [CONV] ConfigDocument and ParserOptions are closed (02-CV rule 3); enums not in 02-TRD §7.4 come from 05-SCHEMA CHECK constraints.
# - [EXCEPTION LD-78, API-T06] getAgentConfig (E02) response `document` is `type: object, additionalProperties: true`: explicit exception to 02-CV rule 3 (closed schemas) and the omit-null rule (X10). The signed bytes are opaque (02-TRD §7.4) and carry null for update.target/window.
openapi: 3.0.3
info:
  title: LIMS instruments (C7)
  version: 1.0.0
  description: Transcribed from spec/chunks/C7-instrument-integration/02-TRD.md §7 (T0C-10.C7).
paths:
  /v1/instruments/agent/enrolments:
    post:
      operationId: enrolAgent
      tags:
        - instruments
      summary: Enrol a bridge agent with a one-time enrolment code (E01)
      description: Accepts only an enrolment_code credential (AC-01.6). Response carries the device token once.
      security:
        - deviceToken: []
      x-permission: instruments.ingest.enrol
      x-context: tenant
      x-idempotency: none
      x-idempotency-justification: "E1 secret shown once: the 201 body carries the new device token; storing it for replay would persist the secret."
      x-rate-limit-tier: ingest
      x-error-codes:
        - common.validation_failed
        - common.rate_limited
        - common.internal
        - auth.device_token_invalid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - host_fingerprint_sha256
                - agent_version
                - launcher_version
                - os_version
              properties:
                host_fingerprint_sha256:
                  type: string
                  minLength: 64
                  maxLength: 64
                  pattern: ^[0-9a-f]{64}$
                agent_version:
                  type: string
                  maxLength: 32
                  minLength: 1
                launcher_version:
                  type: string
                  maxLength: 32
                  minLength: 1
                os_version:
                  type: string
                  maxLength: 64
                  minLength: 1
            examples:
              synthetic:
                value:
                  host_fingerprint_sha256: 3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a
                  agent_version: 1.2.0
                  launcher_version: 1.0.1
                  os_version: Windows 10.0.19045
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - agent_id
                  - centre_id
                  - device_token
                  - server_time
                  - config_version
                properties:
                  agent_id:
                    $ref: _common.yaml#/components/schemas/Uuid
                  centre_id:
                    $ref: _common.yaml#/components/schemas/Uuid
                  device_token:
                    type: string
                    maxLength: 48
                    minLength: 1
                    description: lmsd_ + 43 base64url chars; shown once.
                  server_time:
                    $ref: _common.yaml#/components/schemas/IsoUtc
                  config_version:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
              examples:
                synthetic:
                  value:
                    agent_id: 01a1a98a-ac40-7000-8000-0000000d0101
                    centre_id: 01a1a98a-ac40-7000-8000-000000020001
                    device_token: lmsd_SYNTHETIC
                    server_time: 2026-11-06T04:00:00.000Z
                    config_version: 7
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: "#/components/responses/DeviceTokenInvalid"
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
  /v1/instruments/agent/config:
    get:
      operationId: getAgentConfig
      tags:
        - instruments
      summary: Get the signed agent configuration (E02)
      security:
        - deviceToken: []
      x-permission: instruments.ingest.config_read
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: ingest
      x-error-codes:
        - common.validation_failed
        - common.rate_limited
        - common.internal
        - auth.device_token_invalid
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - alg
                  - key_id
                  - signature
                  - document
                properties:
                  alg:
                    type: string
                    maxLength: 7
                    enum:
                      - Ed25519
                  key_id:
                    type: string
                    maxLength: 32
                    minLength: 1
                  signature:
                    type: string
                    maxLength: 128
                    pattern: ^[A-Za-z0-9_-]+$
                  document:
                    type: object
                    additionalProperties: true
                    description: "Signed canonical JSON, schema lims.bridge.config.v1; opaque payload per 02-TRD §7.4 (null allowed inside, e.g. update.target and update.window; bytes returned exactly as stored). LD-78."
              examples:
                synthetic:
                  value:
                    alg: Ed25519
                    key_id: cfg-2026-11
                    signature: c3ludGhldGljLXNpZ25hdHVyZQ
                    document:
                      schema: lims.bridge.config.v1
                      agent_id: 01a1a98a-ac40-7000-8000-0000000d0101
                      centre_id: 01a1a98a-ac40-7000-8000-000000020001
                      config_version: 7
                      issued_at: 2026-11-06T04:00:00.000Z
                      heartbeat_interval_seconds: 60
                      upload:
                        max_batch_messages: 100
                        max_batch_bytes: 3145728
                        flush_interval_seconds: 2
                        uploaded_retention_hours: 24
                      rate_budget:
                        requests_per_minute: 60
                        reserved_host_query_per_minute: 20
                        reserved_heartbeat_per_minute: 2
                      tls:
                        spki_pins_sha256: []
                      log_level: info
                      update:
                        channel: stable
                        allow_downgrade: false
                      instruments:
                        - instrument_id: 01a1a98a-ac40-7000-8000-0000000d0001
                          instrument_code: SIM-CHEM-1
                          state: commissioning
                          protocol: astm
                          driver_code: astm_generic_e1394
                          transport:
                            kind: serial
                            port_name: COM3
                            baud_rate: 9600
                            data_bits: 8
                            parity: none
                            stop_bits: "1"
                          protocol_options:
                            astm:
                              establish_reply_s: 15
                              transfer_reply_s: 15
                              receiver_frame_wait_s: 30
                              host_contention_defer_s: 20
                              nak_retry_delay_s: 10
                              receiver_interrupt_backoff_s: 15
                              max_frame_sends: 6
                              max_establish_attempts: 6
                              outbound_retry_cycle_s: 60
                              max_outbound_cycles: 3
                              encoding: latin1
                          capabilities:
                            host_query: false
                            worklist_download: false
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: "#/components/responses/DeviceTokenInvalid"
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
  /v1/instruments/agent/heartbeats:
    post:
      operationId: submitAgentHeartbeat
      tags:
        - instruments
      summary: Submit an agent heartbeat (E03)
      security:
        - deviceToken: []
      x-permission: instruments.ingest.heartbeat
      x-context: tenant
      x-idempotency: optional
      x-rate-limit-tier: ingest
      x-error-codes:
        - common.validation_failed
        - common.rate_limited
        - common.internal
        - auth.device_token_invalid
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional (02-CV §4.5).
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]{1,64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Heartbeat"
            examples:
              synthetic:
                value:
                  sent_at_agent: 2026-11-06T04:00:00.000Z
                  agent_version: 1.2.0
                  launcher_version: 1.0.1
                  os_version: Windows 10.0.19045
                  queue:
                    pending: 0
                    uploading: 0
                    rejected: 0
                    oversize: 0
                    uploaded_retained: 12
                    oldest_pending_age_seconds: 0
                  disk_free_mb: 20480
                  clock_offset_ms: 120
                  clock_offset_uncertainty_ms: 15
                  config:
                    applied_version: 7
                    state: ok
                  update:
                    state: idle
                  auth_state: ok
                  instruments:
                    - instrument_id: 01a1a98a-ac40-7000-8000-0000000d0001
                      link_state: up
                      last_message_at_agent: 2026-11-06T04:00:00.000Z
                      messages_last_interval: 3
                      errors_last_interval: 0
                  counters:
                    astm_naks_sent: 0
                    astm_naks_received: 0
                    astm_incomplete_sessions: 0
                    mllp_discarded_bytes: 0
                    mllp_oversize: 0
                    host_query_unavailable: 0
                  command_results: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - server_time
                  - latest_config_version
                  - health_state
                  - commands
                properties:
                  server_time:
                    $ref: _common.yaml#/components/schemas/IsoUtc
                  latest_config_version:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                  health_state:
                    type: string
                    maxLength: 8
                    enum:
                      - online
                      - offline
                      - backlog
                      - degraded
                  commands:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - command_id
                        - kind
                        - params
                        - expires_at
                      properties:
                        command_id:
                          $ref: _common.yaml#/components/schemas/Uuid
                        kind:
                          type: string
                          maxLength: 15
                          enum:
                            - upload_logs
                            - refresh_config
                            - restart_service
                            - reupload_since
                        params:
                          $ref: "#/components/schemas/CommandParams"
                        expires_at:
                          $ref: _common.yaml#/components/schemas/IsoUtc
              examples:
                synthetic:
                  value:
                    server_time: 2026-11-06T04:00:00.000Z
                    latest_config_version: 7
                    health_state: online
                    commands:
                      - command_id: 01a1a98a-ac40-7000-8000-0000000c0001
                        kind: refresh_config
                        params: {}
                        expires_at: 2026-11-06T04:05:00.000Z
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: "#/components/responses/DeviceTokenInvalid"
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
  /v1/instruments/agent/message-batches:
    post:
      operationId: submitMessageBatch
      tags:
        - instruments
      summary: Submit a batch of captured instrument messages (E04)
      description: Route body limit 4 MiB (4194304 bytes, CR-C7-009). Per-message results in request order (§6.4).
      security:
        - deviceToken: []
      x-permission: instruments.ingest.submit
      x-context: tenant
      x-idempotency: required
      x-rate-limit-tier: ingest
      x-error-codes:
        - common.validation_failed
        - common.rate_limited
        - common.internal
        - auth.device_token_invalid
        - common.idempotency_key_reused
        - instruments.batch_too_large
        - common.payload_too_large
      parameters:
        - $ref: _common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - sent_at_agent
                - clock_offset_ms
                - messages
              properties:
                sent_at_agent:
                  $ref: _common.yaml#/components/schemas/IsoUtc
                clock_offset_ms:
                  type: integer
                  minimum: -1000000000
                  maximum: 1000000000
                messages:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/Message"
            examples:
              synthetic:
                value:
                  sent_at_agent: 2026-11-06T04:00:00.000Z
                  clock_offset_ms: 120
                  messages:
                    - agent_message_id: 01a1a98a-ac40-7000-8000-000000090001
                      instrument_id: 01a1a98a-ac40-7000-8000-0000000d0001
                      protocol: astm
                      kind: data
                      raw_base64: U1lOVEhFVElD
                      raw_sha256: 3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a
                      captured_at_agent: 2026-11-06T04:00:00.000Z
                      clock_offset_ms: 120
                      link_meta:
                        frames: 2
                        retransmits: 0
                        naks_sent: 0
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - server_time
                  - results
                properties:
                  server_time:
                    $ref: _common.yaml#/components/schemas/IsoUtc
                  results:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - agent_message_id
                        - outcome
                      properties:
                        agent_message_id:
                          $ref: _common.yaml#/components/schemas/Uuidv7
                        outcome:
                          type: string
                          maxLength: 11
                          enum:
                            - accepted
                            - duplicate
                            - rejected
                            - quarantined
                            - retry
                        instrument_message_id:
                          $ref: _common.yaml#/components/schemas/Uuid
                        error_code:
                          type: string
                          maxLength: 64
              examples:
                synthetic:
                  value:
                    server_time: 2026-11-06T04:05:00.000Z
                    results:
                      - agent_message_id: 01a1a98a-ac40-7000-8000-000000090001
                        outcome: accepted
                        instrument_message_id: 01a1a98a-ac40-7000-8000-0000000e0001
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: "#/components/responses/DeviceTokenInvalid"
        "413":
          $ref: _common.yaml#/components/responses/PayloadTooLarge
        "422":
          $ref: _common.yaml#/components/responses/Unprocessable
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
  /v1/instruments/agent/host-queries:
    post:
      operationId: submitHostQuery
      tags:
        - instruments
      summary: Submit an instrument host query and get the reply (E05)
      security:
        - deviceToken: []
      x-permission: instruments.ingest.host_query
      x-context: tenant
      x-idempotency: required
      x-rate-limit-tier: ingest
      x-error-codes:
        - common.validation_failed
        - common.rate_limited
        - common.internal
        - auth.device_token_invalid
        - common.idempotency_key_reused
        - instruments.capability_not_supported
        - instruments.instrument_unknown
        - instruments.device_mismatch
        - instruments.message_malformed
        - instruments.driver_not_available
        - common.not_found
      parameters:
        - $ref: _common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - instrument_id
                - agent_message_id
                - protocol
                - raw_base64
                - raw_sha256
                - captured_at_agent
                - clock_offset_ms
              properties:
                instrument_id:
                  $ref: _common.yaml#/components/schemas/Uuidv7
                agent_message_id:
                  $ref: _common.yaml#/components/schemas/Uuidv7
                protocol:
                  type: string
                  maxLength: 5
                  enum:
                    - astm
                    - hl7v2
                raw_base64:
                  type: string
                  maxLength: 87384
                  pattern: ^[A-Za-z0-9+/]*={0,2}$
                  minLength: 4
                  description: ≤ 64 KiB decoded [CONV].
                raw_sha256:
                  type: string
                  minLength: 64
                  maxLength: 64
                  pattern: ^[0-9a-f]{64}$
                captured_at_agent:
                  $ref: _common.yaml#/components/schemas/IsoUtc
                clock_offset_ms:
                  type: integer
                  minimum: -1000000000
                  maximum: 1000000000
            examples:
              synthetic:
                value:
                  instrument_id: 01a1a98a-ac40-7000-8000-0000000d0001
                  agent_message_id: 01a1a98a-ac40-7000-8000-000000090002
                  protocol: astm
                  raw_base64: U1lOVEhFVElD
                  raw_sha256: 3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a
                  captured_at_agent: 2026-11-06T04:00:00.000Z
                  clock_offset_ms: 120
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - server_time
                  - instrument_message_id
                  - reply_messages
                  - answer_summary
                properties:
                  server_time:
                    $ref: _common.yaml#/components/schemas/IsoUtc
                  instrument_message_id:
                    $ref: _common.yaml#/components/schemas/Uuid
                  reply_messages:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - raw_base64
                      properties:
                        raw_base64:
                          type: string
                          maxLength: 1398104
                          pattern: ^[A-Za-z0-9+/]*={0,2}$
                  answer_summary:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - index
                        - status
                        - test_count
                      properties:
                        index:
                          type: integer
                          minimum: 0
                          maximum: 49
                        status:
                          type: string
                          maxLength: 32
                        test_count:
                          type: integer
                          minimum: 0
                          maximum: 2147483647
                    description: Carries no barcode.
              examples:
                synthetic:
                  value:
                    server_time: 2026-11-06T04:05:00.000Z
                    instrument_message_id: 01a1a98a-ac40-7000-8000-0000000e0001
                    reply_messages:
                      - raw_base64: U1lOVEhFVElD
                    answer_summary:
                      - index: 0
                        status: no_mapped_tests
                        test_count: 0
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: "#/components/responses/DeviceTokenInvalid"
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "422":
          $ref: _common.yaml#/components/responses/Unprocessable
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
  /v1/instruments/agent/attachments:
    post:
      operationId: submitAttachment
      tags:
        - instruments
      summary: Submit a file-drop attachment (E06)
      security:
        - deviceToken: []
      x-permission: instruments.ingest.submit
      x-context: tenant
      x-idempotency: required
      x-rate-limit-tier: ingest
      x-error-codes:
        - common.validation_failed
        - common.rate_limited
        - common.internal
        - auth.device_token_invalid
        - common.idempotency_key_reused
        - common.payload_too_large
        - common.unsupported_media_type
        - instruments.instrument_unknown
        - instruments.device_mismatch
        - instruments.capability_not_supported
      x-upload:
        - application/pdf
        - image/png
        - image/jpeg
      parameters:
        - $ref: _common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - metadata
                - file
              properties:
                metadata:
                  type: object
                  additionalProperties: false
                  required:
                    - agent_message_id
                    - instrument_id
                    - file_name
                    - file_sha256
                    - file_size
                    - captured_at_agent
                    - clock_offset_ms
                    - file_mtime_agent
                  properties:
                    agent_message_id:
                      $ref: _common.yaml#/components/schemas/Uuidv7
                    instrument_id:
                      $ref: _common.yaml#/components/schemas/Uuidv7
                    file_name:
                      type: string
                      maxLength: 255
                      minLength: 1
                    file_sha256:
                      type: string
                      minLength: 64
                      maxLength: 64
                      pattern: ^[0-9a-f]{64}$
                    file_size:
                      type: integer
                      minimum: 1
                      maximum: 15728640
                    barcode:
                      type: string
                      maxLength: 40
                      minLength: 1
                    captured_at_agent:
                      $ref: _common.yaml#/components/schemas/IsoUtc
                    clock_offset_ms:
                      type: integer
                      minimum: -1000000000
                      maximum: 1000000000
                    file_mtime_agent:
                      $ref: _common.yaml#/components/schemas/IsoUtc
                file:
                  type: string
                  format: binary
                  maxLength: 15728640
                  description: ≤ 15 MB.
            encoding:
              metadata:
                contentType: application/json
              file:
                contentType: application/pdf, image/png, image/jpeg
            examples:
              synthetic:
                value:
                  metadata:
                    agent_message_id: 01a1a98a-ac40-7000-8000-000000090003
                    instrument_id: 01a1a98a-ac40-7000-8000-0000000d0001
                    file_name: synthetic-report.pdf
                    file_sha256: 3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a
                    file_size: 2048
                    captured_at_agent: 2026-11-06T04:00:00.000Z
                    clock_offset_ms: 120
                    file_mtime_agent: 2026-11-06T04:00:00.000Z
                  file: synthetic-file-bytes
      responses:
        "202":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - outcome
                  - instrument_message_id
                  - attachment_id
                  - scan_state
                properties:
                  outcome:
                    type: string
                    maxLength: 9
                    enum:
                      - accepted
                      - duplicate
                  instrument_message_id:
                    $ref: _common.yaml#/components/schemas/Uuid
                  attachment_id:
                    $ref: _common.yaml#/components/schemas/Uuid
                  scan_state:
                    type: string
                    maxLength: 11
                    enum:
                      - pending
                      - clean
                      - quarantined
                      - failed
              examples:
                synthetic:
                  value:
                    outcome: accepted
                    instrument_message_id: 01a1a98a-ac40-7000-8000-0000000e0001
                    attachment_id: 01a1a98a-ac40-7000-8000-0000000e4001
                    scan_state: pending
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: "#/components/responses/DeviceTokenInvalid"
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
