  /v1/instruments/rejections:
    get:
      operationId: listMessageRejections
      tags:
        - instruments
      summary: List rejected instrument messages (no raw) (E42)
      description: received_at_from/_to span ≤ 31 days.
      security:
        - bearerJwt: []
      x-permission: instruments.message.read
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.invalid_cursor
      parameters:
        - name: received_at_from
          in: query
          required: true
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: received_at_to
          in: query
          required: true
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: agent_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: reason
          in: query
          required: false
          schema:
            type: string
            maxLength: 30
            enum:
              - instruments.instrument_unknown
              - instruments.device_mismatch
              - instruments.message_too_large
        - $ref: _common.yaml#/components/parameters/Cursor
        - $ref: _common.yaml#/components/parameters/Limit
      responses:
