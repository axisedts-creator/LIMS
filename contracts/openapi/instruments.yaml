components:
  schemas:
    TransportSerial:
      type: object
      additionalProperties: false
      required:
        - kind
        - port_name
        - baud_rate
        - data_bits
        - parity
        - stop_bits
      properties:
        kind:
          type: string
          maxLength: 6
          enum:
            - serial
        port_name:
          type: string
          maxLength: 6
          pattern: ^COM[1-9][0-9]{0,2}$
        baud_rate:
          type: integer
          minimum: 1200
          maximum: 115200
          enum:
            - 1200
            - 2400
            - 4800
            - 9600
            - 19200
            - 38400
            - 57600
            - 115200
        data_bits:
          type: integer
          minimum: 7
          maximum: 8
          enum:
            - 7
            - 8
        parity:
          type: string
          maxLength: 5
          enum:
            - none
            - odd
            - even
            - mark
            - space
        stop_bits:
          type: string
          maxLength: 3
          enum:
            - "1"
            - "1.5"
            - "2"
        dtr:
          type: boolean
        rts:
          type: boolean
    TransportTcpClient:
      type: object
      additionalProperties: false
      required:
        - kind
        - host
        - port
      properties:
        kind:
          type: string
          maxLength: 10
          enum:
            - tcp_client
        host:
          type: string
          maxLength: 253
          minLength: 1
          pattern: ^[A-Za-z0-9.-]{1,253}$
        port:
          type: integer
          minimum: 1
          maximum: 65535
        connect_timeout_s:
          type: integer
          minimum: 1
          maximum: 60
        reconnect_max_backoff_s:
          type: integer
          minimum: 1
          maximum: 300
    TransportTcpServer:
      type: object
      additionalProperties: false
      required:
        - kind
        - bind_address
        - port
        - allowed_peers
      properties:
        kind:
          type: string
          maxLength: 10
          enum:
            - tcp_server
        bind_address:
          type: string
          maxLength: 15
          pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$
          description: IPv4; not 0.0.0.0 and not a loopback address (server-validated).
        port:
          type: integer
          minimum: 1024
          maximum: 65535
        allowed_peers:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            maxLength: 15
            pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$
          uniqueItems: true
    TransportFileDrop:
      type: object
      additionalProperties: false
      required:
        - kind
        - directory
        - filename_pattern
        - allowed_types
        - attachment_instrument_code
      properties:
        kind:
          type: string
          maxLength: 9
          enum:
            - file_drop
        directory:
          type: string
          maxLength: 240
          minLength: 3
          pattern: ^([A-Za-z]:\\|\\\\)
          description: Absolute Windows path (drive or UNC).
        filename_pattern:
          type: string
          maxLength: 200
          minLength: 1
          description: Go RE2.
        barcode_regex:
          type: string
          maxLength: 200
          minLength: 1
          description: Go RE2; must contain the named group (?P<barcode>…).
        allowed_types:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            maxLength: 3
            enum:
              - pdf
              - png
              - jpg
          uniqueItems: true
        stable_seconds:
          type: integer
          minimum: 2
          maximum: 60
        move_after_capture:
          type: boolean
        captured_subdirectory:
          type: string
          maxLength: 60
          pattern: ^[A-Za-z0-9_-]{1,60}$
        attachment_instrument_code:
          type: string
          maxLength: 64
          minLength: 1
    FileDropOptions:
      type: object
      additionalProperties: false
      required:
        - directory
        - filename_pattern
        - allowed_types
        - attachment_instrument_code
      properties:
        directory:
          type: string
          maxLength: 240
          minLength: 3
          pattern: ^([A-Za-z]:\\|\\\\)
          description: Absolute Windows path (drive or UNC).
        filename_pattern:
          type: string
          maxLength: 200
          minLength: 1
          description: Go RE2.
        barcode_regex:
          type: string
          maxLength: 200
          minLength: 1
          description: Go RE2; must contain the named group (?P<barcode>…).
        allowed_types:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            maxLength: 3
            enum:
              - pdf
              - png
              - jpg
          uniqueItems: true
        stable_seconds:
          type: integer
          minimum: 2
          maximum: 60
        move_after_capture:
          type: boolean
        captured_subdirectory:
          type: string
          maxLength: 60
          pattern: ^[A-Za-z0-9_-]{1,60}$
        attachment_instrument_code:
          type: string
          maxLength: 64
          minLength: 1
      description: Secondary file-drop channel on an astm/hl7v2 instrument (§5.8).
    Transport:
      description: 02-TRD §5.8; oneOf + discriminator with explicit mapping (02-CV §4.12).
      oneOf:
        - $ref: "#/components/schemas/TransportSerial"
        - $ref: "#/components/schemas/TransportTcpClient"
        - $ref: "#/components/schemas/TransportTcpServer"
        - $ref: "#/components/schemas/TransportFileDrop"
      discriminator:
        propertyName: kind
        mapping:
          serial: "#/components/schemas/TransportSerial"
          tcp_client: "#/components/schemas/TransportTcpClient"
          tcp_server: "#/components/schemas/TransportTcpServer"
          file_drop: "#/components/schemas/TransportFileDrop"
    AstmOptions:
      type: object
      additionalProperties: false
      properties:
        establish_reply_s:
          type: integer
          minimum: 1
          maximum: 300
        nak_retry_delay_s:
          type: integer
          minimum: 1
          maximum: 300
        host_contention_defer_s:
          type: integer
          minimum: 1
          maximum: 300
        instrument_contention_retry_s:
          type: integer
          minimum: 1
          maximum: 300
        transfer_reply_s:
          type: integer
          minimum: 1
          maximum: 300
        receiver_frame_wait_s:
          type: integer
          minimum: 1
          maximum: 300
        receiver_interrupt_backoff_s:
          type: integer
          minimum: 1
          maximum: 300
        outbound_retry_cycle_s:
          type: integer
          minimum: 1
          maximum: 300
        max_frame_sends:
          type: integer
          minimum: 1
          maximum: 10
        max_establish_attempts:
          type: integer
          minimum: 1
          maximum: 20
        max_outbound_cycles:
          type: integer
          minimum: 1
          maximum: 10
        encoding:
          type: string
          maxLength: 16
          minLength: 1
    Hl7v2Options:
      type: object
      additionalProperties: false
      properties:
        ack_mode:
          type: string
          maxLength: 32
          minLength: 1
        ack_sending_app:
          type: string
          maxLength: 20
          pattern: ^[A-Z0-9_]+$
        ack_sending_facility:
          type: string
          maxLength: 20
        ack_timeout_s:
          type: integer
          minimum: 1
          maximum: 60
        send_retries:
          type: integer
          minimum: 0
          maximum: 5
        max_message_bytes:
          type: integer
          minimum: 1024
          maximum: 1048576
    ProtocolOptions:
      type: object
      additionalProperties: false
      properties:
