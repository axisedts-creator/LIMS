  /v1/inventory/reports/{report_code}/export.csv:
    get:
      operationId: exportInventoryReport
      tags:
        - inventory
      summary: "Export inventory report (TRD §5 #93)"
      description: "Same parameters as #92; CSV up to 50,000 rows. cost_per_test also needs inventory.cost.read. Writes access_log data.export (TRD §5.10)."
      security:
        - bearerJwt: []
      x-permission: inventory.report.export
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - inventory.export_too_large
        - inventory.range_too_large
        - auth.mfa_required
      parameters:
        - name: report_code
          in: path
          required: true
          schema:
            type: string
            maxLength: 26
            enum:
              - daily_consumption
              - analyser_consumption
              - cost_per_test
              - wastage
              - expiry
              - stock_valuation
              - consumption_reconciliation
        - name: business_date_from
          in: query
          required: false
          description: Inclusive (CV §4.4).
          schema:
            $ref: _common.yaml#/components/schemas/IsoDate
        - name: business_date_to
          in: query
          required: false
          description: Exclusive (CV §4.4); range ≤ 366 days.
          schema:
            $ref: _common.yaml#/components/schemas/IsoDate
        - name: store_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: branch_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: instrument_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: test_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: item_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: as_of
          in: query
          required: false
          description: stock_valuation only.
          schema:
            $ref: _common.yaml#/components/schemas/IsoDate
        - name: within_days
          in: query
          required: false
          description: expiry only; default settings.expiry_alert_days.
          schema:
            type: integer
            minimum: 1
            maximum: 365
        - name: group_by
          in: query
          required: false
          description: "Per-report grouping (TRD §5 #92; values not enumerated in the TRD — validated server-side)."
          schema:
            type: string
            maxLength: 32
            pattern: ^[a-z][a-z0-9_]{0,31}$
      responses:
        "200":
          description: CSV attachment.
          headers:
            Content-Disposition:
              description: attachment; filename="<name>.csv"
              schema:
                type: string
                maxLength: 200
            Cache-Control:
              schema:
                type: string
                maxLength: 8
                enum:
                  - no-store
            X-Content-Type-Options:
              schema:
                type: string
                maxLength: 7
                enum:
                  - nosniff
          content:
            text/csv:
              schema:
                type: string
                format: binary
                maxLength: 52428800
              examples:
                synthetic:
                  value: |
                    store_code,item_code,qty_base
                    SYN-MAIN,SYN-ITEM-001,10
