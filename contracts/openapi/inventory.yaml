# contracts/openapi/inventory.yaml (C12) — transcription of spec/chunks/C12-inventory/02-TRD.md §5 (93 ops, #1–#93), §6 DTOs (T0C-10.C12; AC-0C-1.4/1.5).
# LD-103 (2026-11-11): wave-2 OpenAPI transcription added by the human lead; owner approval given by that decision. Owned by C12 after this.
# Notes:
# - Examples are synthetic (uuids 0193c4a0-0000-7000-8000-…, "Synthetic …" / "SYN-…" values).
# - Every operation lists the six common codes (TRD §5 intro); required-idempotency ops add common.idempotency_*; If-Match ops add
#   common.version_conflict + common.precondition_required; privileged x-permission (stock.adjust, po.approve, report.export) and "+ code" rows add auth.mfa_required.
# - x-permission = first code of the TRD Permission column (P-10); the "+ code when …" checks are handler-side (described per operation).
# - [CONV] upsert PUTs (#16 #22 #24 #29) take an optional If-Match (required only when the row exists); #27 settings and draft PUTs require it; #66 has none.
# - [CONV] #12 createInventoryStore keeps the TRD row's Idem "O" verbatim; it conflicts with the §5 "creates are R" rule → CR .orchestra/cr/T0C-10.C12.md.
# - [CONV] shapes the TRD leaves open: ColumnMeta {key, label, is_cost}; ReportRow = union of the §5.11 report columns (all optional); ReportParams;
#   Alert.details = key/value pairs; group_by is a pattern-checked string (per-report values not enumerated in the TRD); Count.lines ≤ 200 per page + lines_page.
# - Cost fields (*_paisa, *_paisa_x1e6, value_basis) are optional in every response: omitted without inventory.cost.read (REQ-SEC-081, TRD §6.3);
#   PoPrintView is cost-only (403 without it) and keeps its amounts required.
openapi: 3.0.3
info:
  title: LIMS inventory (C12)
  version: 1.0.0
  description: Transcribed from spec/chunks/C12-inventory/02-TRD.md §5, §6 (T0C-10.C12, LD-103).
