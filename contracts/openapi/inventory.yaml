        - bearerJwt: []
      x-permission: inventory.item.read
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            maxLength: 10
            enum:
              - reagent
              - kit
              - consumable
              - control
              - calibrator
              - other
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          description: "Prefix (≤ 60) of item_code or lower(name). Barcodes: use #10 lookupInventoryBarcode."
          schema:
            type: string
            maxLength: 60
        - name: sort
          in: query
          required: false
          schema:
            type: string
            maxLength: 11
            enum:
              - item_code
              - name
              - -updated_at
            default: item_code
        - $ref: _common.yaml#/components/parameters/Cursor
        - $ref: _common.yaml#/components/parameters/Limit
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/ItemSummary"
                  page:
                    $ref: _common.yaml#/components/schemas/PageInfo
              examples:
                synthetic:
                  value:
                    data:
                      - id: 0193c4a0-0000-7000-8000-000000000001
                        item_code: SYN-ITEM-001
                        name: Synthetic name
                        category: reagent
                        base_uom_code: unit
                        storage_condition: ambient
                        is_lot_tracked: false
                        requires_expiry: false
                        is_active: false
                        version: 3
                    page:
