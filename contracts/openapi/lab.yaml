# contracts/openapi/lab.yaml (C5) — transcription of spec/chunks/C5-lab-workflow/02-TRD.md §5.1–§5.9 (T0C-10.C5; AC-0C-1.4/1.5).
# Generated once from the TRD tables, then owned by C5. Notes:
# - Examples are synthetic (uuids 0193c4a0-0000-7000-8000-…, "Synthetic …" strings).
# - [CONV] IM rows (TRD §3.2) list common.version_conflict + common.precondition_required; required-idem rows list common.idempotency_key_reused.
# - [CONV] shapes the TRD names without fields are marked [CONV] in their description.
# - P-8: #14a requestOrderLabelPrint (read-only POST) carries E3 per LD-10 (2026-11-07).
openapi: 3.0.3
info:
  title: LIMS lab (C5)
  version: 1.0.0
  description: Transcribed from spec/chunks/C5-lab-workflow/02-TRD.md §5 (T0C-10.C5).
paths:
  /v1/lab/specimens/lookup:
    post:
      operationId: lookupSpecimenByBarcode
      tags:
        - lab
      summary: Look up specimens by barcode or registration number
      security:
        - bearerJwt: []
      x-permission: lab.specimen.read
      x-context: tenant
      x-idempotency: optional
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - barcode
                  properties:
                    barcode:
                      type: string
                      maxLength: 20
                      pattern: ^[A-Z0-9]{1,20}$
                - type: object
                  additionalProperties: false
                  required:
                    - registration_no
                  properties:
                    registration_no:
                      type: string
                      maxLength: 40
                      pattern: ^[A-Z0-9]{1,40}$
              description: "Body, never URL (P2). Unknown barcode → 404 common.not_found; unknown registration no → 200 { data: [] }."
            examples:
              synthetic:
                value:
                  barcode: E2600000101
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SpecimenDto"
                  - $ref: "#/components/schemas/SpecimenList"
                description: "barcode → SpecimenDto; registration_no → { data: SpecimenDto[] }."
              examples:
                synthetic:
                  value:
                    id: 0193c4a0-0000-7000-8000-000000000001
                    version: 1
                    barcode: E2600000101
                    order_id: 0193c4a0-0000-7000-8000-000000000002
                    registration_no: R2611050001
                    specimen_type_code: SYN_CODE
                    container_code: SYN_CODE
                    status: ordered
                    priority: SYN_CODE
                    centre_id: 0193c4a0-0000-7000-8000-000000000003
                    processing_centre_id: 0193c4a0-0000-7000-8000-000000000004
                    parent_specimen_id: 0193c4a0-0000-7000-8000-000000000005
                    replaces_specimen_id: 0193c4a0-0000-7000-8000-000000000006
                    is_active: false
                    collected_at: 2026-11-05T04:15:00.000Z
                    in_transit_at: 2026-11-05T04:15:00.000Z
                    received_at: 2026-11-05T04:15:00.000Z
                    rejected_at: 2026-11-05T04:15:00.000Z
                    rejection_reason_code: SYN_CODE
                    collection_barcode_unverified: false
                    label_print_count: 1
                    tests:
                      - test_id: 0193c4a0-0000-7000-8000-000000000007
                        test_code: SYN_CODE
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
  /v1/lab/specimens:
    get:
      operationId: listSpecimens
      tags:
        - lab
      summary: List specimens
      security:
        - bearerJwt: []
      x-permission: lab.specimen.read
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.invalid_cursor
      parameters:
        - name: order_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
            pattern: ^(ordered|collected|in_transit|received|aliquoted|in_process|resulted|verified|approved|reported|rejected|recollection_ordered|stored|discarded)(,(ordered|collected|in_transit|received|aliquoted|in_process|resulted|verified|approved|reported|rejected|recollection_ordered|stored|discarded))*$
            description: Comma-separated, values ∈ {ordered, collected, in_transit, received, aliquoted, in_process, resulted, verified, approved, reported, rejected, recollection_ordered, stored, discarded}.
        - name: centre_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: processing_centre_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: priority
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Code
        - name: received_at_from
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: received_at_to
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: sort
          in: query
          required: false
          description: Leading `-` = descending; `id` is always appended (02-CV §4.4).
          schema:
            type: string
            maxLength: 12
            enum:
              - -created_at
              - received_at
              - -received_at
        - $ref: _common.yaml#/components/parameters/Cursor
        - $ref: _common.yaml#/components/parameters/Limit
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecimenPage"
              examples:
                synthetic:
                  value:
                    data:
                      - id: 0193c4a0-0000-7000-8000-000000000008
                        version: 1
                        barcode: E2600000101
                        order_id: 0193c4a0-0000-7000-8000-000000000009
                        registration_no: R2611050001
                        specimen_type_code: SYN_CODE
                        container_code: SYN_CODE
                        status: ordered
                        priority: SYN_CODE
                        centre_id: 0193c4a0-0000-7000-8000-000000000010
                        processing_centre_id: 0193c4a0-0000-7000-8000-000000000011
                        parent_specimen_id: 0193c4a0-0000-7000-8000-000000000012
                        replaces_specimen_id: 0193c4a0-0000-7000-8000-000000000013
                        is_active: false
                        collected_at: 2026-11-05T04:15:00.000Z
                        in_transit_at: 2026-11-05T04:15:00.000Z
                        received_at: 2026-11-05T04:15:00.000Z
                        rejected_at: 2026-11-05T04:15:00.000Z
                        rejection_reason_code: SYN_CODE
                        collection_barcode_unverified: false
                        label_print_count: 1
                        tests:
                          - test_id: 0193c4a0-0000-7000-8000-000000000014
                            test_code: SYN_CODE
                    page:
                      next_cursor: Synthetic next_cursor
                      limit: 1
        "400":
