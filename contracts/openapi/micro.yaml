  /v1/micro/breakpoint-import-template:
    get:
      operationId: downloadBreakpointTemplate
      tags:
        - micro
      summary: Download the breakpoint CSV template (header + comment lines, no values) (TRD §5 M49)
      security:
        - bearerJwt: []
      x-permission: micro.breakpoint.manage
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - auth.mfa_required
      responses:
        "200":
          description: "CSV template: header line + two comment lines, no values (TRD §9.1)."
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
                maxLength: 46
                enum:
                  - attachment; filename="breakpoint-template.csv"
            Cache-Control:
              required: true
              schema:
                type: string
                maxLength: 8
                enum:
                  - no-store
          content:
            text/csv:
              schema:
                type: string
                minLength: 1
                maxLength: 1000
              example: |
                organism_scope,organism_code,antibiotic_code,method,specimen_site_code,qualifier_code,category_code,lower_value,lower_inclusive,upper_value,upper_inclusive,note
                # One line per interpretive band; see the user manual.
                # This file must contain only breakpoint data your laboratory is licensed to use.
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
