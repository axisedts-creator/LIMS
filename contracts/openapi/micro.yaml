            type: boolean
        - name: updated_at_from
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: include_total
          in: query
          required: false
          schema:
            type: boolean
          description: Adds page.total (count capped at 10,000 [CONV]).
        - name: sort
          in: query
          required: false
          schema:
            type: string
            maxLength: 16
            enum:
              - received_at
              - -received_at
              - next_read_due_at
