# contracts/openapi/micro.yaml (C10) — transcription of spec/chunks/C10-microbiology/02-TRD.md §5 (M1–M49), §5.6 (DTO allowlists), §9.1 (CSV template);
# 49 ops (T0C-10.C10; AC-0C-1.4/1.5).
# LD-103 (2026-11-11): wave-2 transcription scheduled by the human lead; owner approval given by that decision. Generated once from the TRD tables, then owned by C10.
# Notes:
# - Examples are synthetic (uuids 01950c10-0000-7000-8000-…, "Synthetic …" labels, syn_* codes).
# - Every op lists the six §5 common codes; R ops add the Idempotency-Key header + three idempotency codes; If-Match rows (TRD §5 intro list) add
#   common.version_conflict + common.precondition_required; M24/M38 use an optional If-Match ("when the row exists"); paged lists add common.invalid_cursor;
#   micro.breakpoint.manage (privileged) ops add auth.mfa_required. Error responses derive from errors.yaml http.
# - [CONV] Success status 201 only where the TRD gives it (M14 M26 M30 M34 M42); otherwise 200. M12 per-entry codes travel in the 200 body (not in x-error-codes).
# - [CONV] Enums from 05-SCHEMA §2 CHECKs; coded sets micro.<set> with the 05-SCHEMA §3.1 code pattern; category_code uses micro.ast_interpretations.
# - [CONV] Detail DTOs (CultureDetailDto, ReportVersionDto) are flat copies of the summary fields (closed schemas cannot be combined with allOf);
#   ReportVersionDto.isolates/ast use the 05-SCHEMA §6 snapshot item schemas. Config DTOs = 05-SCHEMA columns minus tenant_id/created_by/updated_by.
# - [CONV] MicroSettingsDto: id/created_at/updated_at absent while no settings row exists (M39 returns defaults).
openapi: 3.0.3
info:
