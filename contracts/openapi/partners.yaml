# contracts/openapi/partners.yaml (C13) — transcription of spec/chunks/C13-b2b-partner-portal/02-TRD.md §5.1–§5.3, 68 ops (41 partner-facing + 27 staff) (T0C-10.C13; AC-0C-1.4/1.5).
# LD-103 (2026-11-11): wave-2 transcription scheduled by the human lead; owner approval given by that decision. Generated once from the TRD tables, then owned by C13.
# Notes:
# - Examples are synthetic (uuids 01940e00-0000-7000-8000-c13…, "Synthetic …" labels, SYN-… numbers, <synthetic-email>); no token, link or secret appears anywhere.
# - [CONV] every op lists validation_failed, auth.forbidden, auth.unauthenticated, rate_limited, internal; path-parameter ops add common.not_found; paged ops add
#   common.invalid_cursor; partner-facing ops add partners.partner_inactive (TRD §5 intro); privileged permissions (partners.partner.manage,
#   partners.partner_user.manage) add auth.mfa_required; required-idempotency ops add the three idempotency codes and the Idempotency-Key header;
#   If-Match ops add version_conflict + precondition_required. Error responses derive from errors.yaml http.
# - [CONV] Ruling T0C-10.C13 (02-CV §4.5 lines 371-375): TRD-"none" state-action POSTs are x-idempotency optional (no Idempotency-Key header, wave-1
#   convention); O2 searchPartnerOrders stays none with E3 (read-only POST, LD-10).
# - [CONV] TRD-open shapes: csv state filters = patterned strings; coded sets x-coded-set partners.<set> (05-SCHEMA §5); bare "200" rows return the resource DTO
#   (PartnerReferrer, PartnerUser, PartnerAdmin, ManifestLine, PickupRequestAdmin, ReferrerMapping); SR1 item = ReferrerMapping; M8/M10/R4/F4/F5/U5/U6/SA6/SA10
#   reactivate/SR3 unmap take no body; SS1 PartnerSettings per TRD §10.2 (the §5.3 cell's "§11.2" is stale). Staff audit fields (created_by, received_by) are
#   not modelled: the TRD gives no shape.
openapi: 3.0.3
info:
  title: LIMS partners (C13)
  version: 1.0.0
  description: Transcribed from spec/chunks/C13-b2b-partner-portal/02-TRD.md §5.1–§5.3 (T0C-10.C13, LD-103).
