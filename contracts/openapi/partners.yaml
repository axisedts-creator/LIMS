components:
  schemas:
    PartnerContext:
      type: object
      additionalProperties: false
      required:
        - partner
        - user
        - tenant
        - permissions
        - features
      properties:
        partner:
          type: object
          additionalProperties: false
          required:
            - id
            - partner_code
            - name
          properties:
            id:
              $ref: _common.yaml#/components/schemas/Uuid
            partner_code:
              type: string
              pattern: ^[A-Z0-9_-]{1,20}$
              maxLength: 20
            name:
              type: string
              minLength: 1
              maxLength: 160
        user:
          type: object
          additionalProperties: false
          required:
            - partner_user_id
            - display_name
            - partner_role
            - mfa_enrolled
          properties:
            partner_user_id:
              $ref: _common.yaml#/components/schemas/Uuid
            display_name:
              type: string
              minLength: 1
              maxLength: 120
            partner_role:
              type: string
              maxLength: 14
              enum:
                - partner_admin
                - partner_member
            mfa_enrolled:
              type: boolean
        tenant:
          type: object
          additionalProperties: false
          required:
            - display_name
            - calendar_display
            - timezone
          properties:
            display_name:
              type: string
              minLength: 1
              maxLength: 160
            calendar_display:
              type: string
              maxLength: 16
            timezone:
              type: string
              maxLength: 64
        permissions:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 100
        features:
          type: object
          additionalProperties: false
          required:
            - access_slip_enabled
            - conversion_mode
            - include_default_price_list
          properties:
            access_slip_enabled:
              type: boolean
            conversion_mode:
              type: string
              maxLength: 10
              enum:
                - on_receipt
                - on_submit
            include_default_price_list:
              type: boolean
    ManifestSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - manifest_no
        - state
        - line_count
        - lines_converted
        - lines_failed
        - receiving_centre
        - created_at
        - version
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuid
        manifest_no:
          type: string
          maxLength: 32
        state:
          type: string
          maxLength: 18
          enum:
            - draft
            - submitted
            - partially_received
            - received
            - withdrawn
            - discarded
        line_count:
          type: integer
          minimum: 0
          maximum: 200
        lines_converted:
          type: integer
          minimum: 0
          maximum: 200
        lines_failed:
          type: integer
          minimum: 0
          maximum: 200
        receiving_centre:
          type: object
          additionalProperties: false
          required:
            - id
            - name
          properties:
            id:
              $ref: _common.yaml#/components/schemas/Uuid
            name:
              type: string
              minLength: 1
              maxLength: 160
        submitted_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        received_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        pickup_request_id:
          $ref: _common.yaml#/components/schemas/Uuid
        created_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        version:
          $ref: _common.yaml#/components/schemas/Version
    Manifest:
      type: object
      additionalProperties: false
      required:
        - id
        - manifest_no
        - state
        - line_count
        - lines_converted
        - lines_failed
        - receiving_centre
        - created_at
        - version
        - lines
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuid
        manifest_no:
          type: string
          maxLength: 32
        state:
          type: string
          maxLength: 18
          enum:
            - draft
            - submitted
            - partially_received
            - received
            - withdrawn
            - discarded
        line_count:
          type: integer
          minimum: 0
          maximum: 200
        lines_converted:
          type: integer
          minimum: 0
          maximum: 200
        lines_failed:
          type: integer
          minimum: 0
          maximum: 200
        receiving_centre:
          type: object
          additionalProperties: false
          required:
            - id
            - name
          properties:
            id:
              $ref: _common.yaml#/components/schemas/Uuid
            name:
              type: string
              minLength: 1
              maxLength: 160
        submitted_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        received_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        pickup_request_id:
          $ref: _common.yaml#/components/schemas/Uuid
        created_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        version:
          $ref: _common.yaml#/components/schemas/Version
        notes:
          type: string
          maxLength: 500
        collected_on:
          $ref: _common.yaml#/components/schemas/IsoDate
        withdraw_reason_code:
          type: string
          maxLength: 64
          x-coded-set: partners.manifest_withdraw_reasons
        lines:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ManifestLine"
    ManifestLine:
      type: object
      additionalProperties: false
      required:
        - id
        - line_no
        - state
        - patient
        - consents
        - orderables
        - priority
        - version
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuid
        line_no:
          type: integer
          minimum: 1
          maximum: 200
        state:
          type: string
          maxLength: 17
          enum:
            - draft
            - submitted
            - converting
            - converted
            - conversion_failed
            - not_received
            - withdrawn
            - discarded
            - cancelled
        partner_sample_ref:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9_./-]+$
        patient:
          type: object
          additionalProperties: false
          required:
            - full_name
            - sex
          properties:
            full_name:
              type: string
              minLength: 1
              maxLength: 120
            sex:
              type: string
              maxLength: 7
              enum:
                - male
                - female
                - other
                - unknown
            birth_on:
              $ref: _common.yaml#/components/schemas/IsoDate
            age_years:
              type: integer
              minimum: 0
              maximum: 130
            phone_e164:
              type: string
              pattern: ^\+[1-9][0-9]{7,14}$
              maxLength: 16
        consents:
          type: object
          additionalProperties: false
          required:
            - sms
            - whatsapp
            - email
            - share_with_referrer
            - consent_text_version
          properties:
            sms:
              type: boolean
            whatsapp:
              type: boolean
            email:
              type: boolean
            share_with_referrer:
              type: boolean
            consent_text_version:
              type: string
              minLength: 1
              maxLength: 32
        orderables:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required:
              - orderable_id
              - kind
              - code
              - name
            properties:
              orderable_id:
                $ref: _common.yaml#/components/schemas/Uuid
              kind:
                type: string
                maxLength: 5
                enum:
                  - test
                  - panel
              code:
                $ref: _common.yaml#/components/schemas/Code
              name:
                type: string
                minLength: 1
                maxLength: 200
        priority:
          type: string
          maxLength: 7
          enum:
            - routine
            - urgent
        referrer:
          type: object
          additionalProperties: false
          required:
            - id
            - display_name
          properties:
            id:
              $ref: _common.yaml#/components/schemas/Uuid
            display_name:
              type: string
              minLength: 1
              maxLength: 120
        collected_at:
