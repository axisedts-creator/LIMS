        - bearerJwt: []
      x-permission: payments.intent.resolve
      x-context: tenant
      x-idempotency: required
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - payments.intent_not_verifiable
        - payments.intent_invalid_transition
        - auth.mfa_required
        - common.idempotency_key_required
        - common.idempotency_key_reused
        - common.idempotency_in_progress
        - common.version_conflict
        - common.precondition_required
      parameters:
