                      - from_status: created
                        to_status: initiated
                        cause: create
                        actor_type: user
                        at: 2026-01-15T04:30:00.000Z
                      - from_status: initiated
                        to_status: held_for_review
                        cause: poll
                        reason_code: amount_mismatch
                        actor_type: system
                        at: 2026-01-15T04:31:10.000Z
                    gateway_checks:
                      - operation: esewa_status
                        outcome: answer
