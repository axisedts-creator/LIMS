          items:
            type: object
            additionalProperties: false
            required:
              - operation
              - outcome
              - at
            properties:
              operation:
                type: string
                maxLength: 15
                enum:
                  - khalti_initiate
                  - khalti_lookup
                  - esewa_status
                  - khalti_refund
                  - credential_test
              outcome:
                type: string
                maxLength: 19
                enum:
                  - answer
                  - service_unavailable
                  - timeout
                  - network_error
                  - http_error
                  - auth_error
                  - not_found
                  - invalid_response
              gateway_status_raw:
                type: string
                maxLength: 64
              http_status:
                type: integer
                minimum: 100
                maximum: 599
              at:
                $ref: _common.yaml#/components/schemas/IsoUtc
        callbacks:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required:
              - kind
              - outcome_code
              - at
            properties:
              kind:
                type: string
                maxLength: 13
                enum:
                  - esewa_success
                  - esewa_failure
                  - khalti_return
                  - launch
              outcome_code:
                type: string
                maxLength: 26
                enum:
                  - ok
                  - payments.signature_invalid
                  - payments.callback_mismatch
                  - payments.callback_stale
                  - rate_limited
              signature_valid:
                type: boolean
              at:
                $ref: _common.yaml#/components/schemas/IsoUtc
        refunds:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/RefundDto"
    ReconciliationRunDto:
      type: object
      additionalProperties: false
      required:
        - id
        - business_date
        - trigger
        - status
        - started_at
        - counts
        - version
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuidv7
        business_date:
          $ref: _common.yaml#/components/schemas/IsoDate
        trigger:
          type: string
          maxLength: 6
          enum:
            - cron
            - manual
        status:
          type: string
          maxLength: 9
          enum:
            - running
            - completed
            - failed
        started_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        finished_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        counts:
          type: object
          additionalProperties: false
          required:
            - checked
            - ok
            - findings
            - critical
          properties:
            checked:
              type: integer
              minimum: 0
              maximum: 2147483647
            ok:
              type: integer
              minimum: 0
              maximum: 2147483647
            findings:
              type: integer
              minimum: 0
              maximum: 2147483647
            critical:
              type: integer
              minimum: 0
              maximum: 2147483647
        version:
          $ref: _common.yaml#/components/schemas/Version
    FindingDto:
      type: object
      additionalProperties: false
      required:
        - id
        - run_id
        - kind
        - severity
        - auto_action
        - status
        - created_at
        - version
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuidv7
        run_id:
          $ref: _common.yaml#/components/schemas/Uuidv7
        kind:
          type: string
          maxLength: 64
          pattern: ^[a-z0-9_]{1,64}$
          x-coded-set: payments.finding_kinds
        severity:
          type: string
          maxLength: 8
          enum:
            - info
            - warning
            - critical
        intent_id:
          $ref: _common.yaml#/components/schemas/Uuidv7
        refund_id:
          $ref: _common.yaml#/components/schemas/Uuidv7
        our_status:
          type: string
          maxLength: 32
        gateway_status_raw:
          type: string
          maxLength: 64
        our_amount:
          $ref: _common.yaml#/components/schemas/Money
        gateway_amount:
          $ref: _common.yaml#/components/schemas/Money
        auto_action:
          type: string
          maxLength: 15
          enum:
            - none
            - settled
            - held
            - ledger_repaired
        status:
          type: string
          maxLength: 8
          enum:
            - open
            - resolved
        resolution_code:
          type: string
          maxLength: 64
          pattern: ^[a-z0-9_]{1,64}$
          x-coded-set: payments.finding_resolutions
        note:
          type: string
          maxLength: 1000
        resolved_by:
          $ref: "#/components/schemas/MemberRef"
        resolved_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        created_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        version:
          $ref: _common.yaml#/components/schemas/Version
    StaticQrReconDto:
      type: object
      additionalProperties: false
      required:
        - id
        - business_date
        - system_entries
        - system_total
        - statement_total
        - difference
        - statement_reference
        - status
        - reconciled_by
        - created_at
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuidv7
        business_date:
          $ref: _common.yaml#/components/schemas/IsoDate
        centre_id:
          $ref: _common.yaml#/components/schemas/Uuidv7
        system_entries:
          type: integer
          minimum: 0
          maximum: 2147483647
        system_total:
          $ref: _common.yaml#/components/schemas/Money
        statement_total:
          $ref: _common.yaml#/components/schemas/Money
        difference:
          $ref: _common.yaml#/components/schemas/Money
        statement_reference:
          type: string
          maxLength: 100
          minLength: 1
        status:
          type: string
          maxLength: 24
          enum:
            - matched
            - accepted_with_difference
        note:
          type: string
          maxLength: 1000
        reconciled_by:
          $ref: "#/components/schemas/MemberRef"
        created_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
    MerchantAccountDto:
      type: object
      additionalProperties: false
      required:
        - gateway
        - environment
        - is_enabled
        - secret
        - api_refunds_enabled
        - version
      properties:
        gateway:
          type: string
          maxLength: 7
          enum:
            - esewa
            - khalti
            - fonepay
        environment:
          type: string
          maxLength: 10
          enum:
            - uat
            - production
        is_enabled:
          type: boolean
        esewa_product_code:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        khalti_website_url:
          type: string
          maxLength: 300
          pattern: ^https://
        secret:
          type: object
          additionalProperties: false
          required:
            - is_set
          properties:
            is_set:
              type: boolean
            set_at:
              $ref: _common.yaml#/components/schemas/IsoUtc
            fingerprint:
              type: string
              maxLength: 64
              pattern: ^[0-9a-f]{1,64}$
        api_refunds_enabled:
          type: boolean
        last_test:
          type: object
          additionalProperties: false
          required:
            - outcome
            - at
          properties:
            outcome:
              type: string
              maxLength: 26
              enum:
                - reachable_key_valid
                - reachable_key_unverifiable
                - auth_failed
                - unreachable
            at:
              $ref: _common.yaml#/components/schemas/IsoUtc
        version:
          $ref: _common.yaml#/components/schemas/Version
    PaymentSettingsDto:
      type: object
      additionalProperties: false
      required:
        - refund_two_person_threshold
        - purchase_order_label
        - reconciliation_enabled
        - version
      properties:
        refund_two_person_threshold:
          $ref: _common.yaml#/components/schemas/Money
        purchase_order_label:
          type: string
          maxLength: 50
          minLength: 1
          pattern: ^[A-Za-z0-9 .,&()-]+$
        reconciliation_enabled:
          type: boolean
        version:
          $ref: _common.yaml#/components/schemas/Version
  parameters:
    IntentId:
      name: intent_id
      in: path
      required: true
      schema:
        $ref: _common.yaml#/components/schemas/Uuidv7
    RefundId:
      name: refund_id
      in: path
      required: true
      schema:
        $ref: _common.yaml#/components/schemas/Uuidv7
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: _common.yaml#/components/schemas/Uuidv7
    FindingId:
      name: finding_id
      in: path
      required: true
      schema:
        $ref: _common.yaml#/components/schemas/Uuidv7
    GatewayPath:
      name: gateway
      in: path
      required: true
      schema:
        type: string
        maxLength: 7
        enum:
          - esewa
          - khalti
          - fonepay
    EnvironmentPath:
      name: environment
      in: path
      required: true
      schema:
        type: string
        maxLength: 10
        enum:
          - uat
          - production
    CallbackToken:
      name: callback_token
      in: path
      required: true
      description: Opaque per-intent callback token (a secret; excluded from access logs, CR-C15-008). Unknown, expired or forged tokens get 303 to the result page with outcome=unknown.
      schema:
        type: string
        maxLength: 128
        minLength: 16
        pattern: ^[A-Za-z0-9_-]{16,128}$
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: Required when the row exists; omitted when creating an absent row (TRD §5.1 P21).
      schema:
        type: string
        maxLength: 12
        pattern: ^"[1-9][0-9]*"$
  headers:
    CacheControlNoStore:
      description: Always no-store (TRD §5.2).
      schema:
        type: string
        maxLength: 8
        enum:
          - no-store
    ReferrerPolicyNoReferrer:
      description: Always no-referrer (TRD §5.2).
      schema:
        type: string
        maxLength: 11
        enum:
          - no-referrer
    ContentTypeOptionsNoSniff:
      description: Always nosniff (TRD §5.2).
      schema:
        type: string
        maxLength: 7
        enum:
          - nosniff
    ResultLocation:
      description: Result page /v1/payments/result?outcome=<settled|pending|failed|unknown>[&intent_id=<uuid>] (TRD §6.3).
      schema:
        type: string
        maxLength: 2048
