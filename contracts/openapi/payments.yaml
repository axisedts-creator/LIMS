# contracts/openapi/payments.yaml (C15) — transcription of spec/chunks/C15-payment-gateways/02-TRD.md §5.1 (P1–P24b) and §5.2 (P30–P34), 33 ops (T0C-10.C15; AC-0C-1.4/1.5).
# LD-103 (2026-11-11): wave-2 transcription scheduled by the human lead; owner approval given by that decision. Generated once from the TRD tables, then owned by C15.
# Notes:
# - Examples are synthetic (uuids 01940f00-0000-7000-8000-…, "Synthetic …" labels, codes SYN-…); no secret, token or callback URL appears anywhere.
# - [CONV] every staff operation lists the six common codes (validation_failed, not_found, forbidden, unauthenticated, rate_limited, internal); privileged
#   permissions add auth.mfa_required (02-CV §10.1); required-idempotency ops add the three idempotency codes; error responses derive from errors.yaml http.
# - [CONV] If-Match: required _common IfMatch on IM rows P4 P9 P10 P11 P11b P16 and PUT /settings (P23); P21 upsert takes an optional If-Match (absent row) and
#   lists only common.version_conflict. Optional-idempotency ops (P3 P7b P21 P22 P23) declare no Idempotency-Key header (wave-1 convention).
# - [CONV] public ops P30–P34 carry x-public + x-error-codes [validation_failed, rate_limited, internal] (strict query 400, per-IP/per-intent throttle);
#   token routes use security paymentCallbackToken (path parameter callback_token), P34 security [].
# - [CONV] TRD-open shapes: MemberRef {membership_id, display_name} also for FindingDto.resolved_by / StaticQrReconDto.reconciled_by; csv filters: enum lists as
#   form/explode=false arrays, coded-set lists (hold_reason, kind) as patterned csv strings with x-coded-set; callback_token 16–128 base64url chars;
#   transitions ≤ 200; refunds ≤ 200; html bodies ≤ 64 KiB; enum values copied from 05-SCHEMA CHECK constraints.
openapi: 3.0.3
info:
  title: LIMS payments (C15)
  version: 1.0.0
  description: Transcribed from spec/chunks/C15-payment-gateways/02-TRD.md §5.1, §5.2 (T0C-10.C15, LD-103).
paths:
  /v1/payments/intents:
    get:
      operationId: listPaymentIntents
      tags:
        - payments
      summary: List payment intents (TRD §5.1 P1)
      security:
        - bearerJwt: []
      x-permission: payments.reconciliation.read
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - auth.mfa_required
      parameters:
        - name: status
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            maxItems: 9
            items:
              type: string
              maxLength: 18
              enum:
                - created
                - initiated
                - pending
                - settled
                - failed
                - expired
                - held_for_review
                - refunded
                - partially_refunded
        - name: gateway
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            maxItems: 3
            items:
              type: string
              maxLength: 7
              enum:
                - esewa
                - khalti
                - fonepay
        - name: hold_reason
          in: query
          required: false
          description: Comma-separated codes.
          schema:
            type: string
            maxLength: 1300
            pattern: ^[a-z0-9_]{1,64}(,[a-z0-9_]{1,64}){0,19}$
            x-coded-set: payments.hold_reasons
        - name: order_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: centre_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: created_at_from
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: created_at_to
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: sort
          in: query
          required: false
          description: "-updated_at dropped: no index serves it (review m#21)."
          schema:
            type: string
            maxLength: 11
            enum:
              - -created_at
              - created_at
        - $ref: _common.yaml#/components/parameters/Cursor
        - $ref: _common.yaml#/components/parameters/Limit
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/PaymentIntentSummary"
                  page:
                    $ref: _common.yaml#/components/schemas/PageInfo
              examples:
                synthetic:
                  value:
                    data:
                      - id: 01940f00-0000-7000-8000-000000000001
                        order_id: 01940f00-0000-7000-8000-000000000101
                        centre_id: 01940f00-0000-7000-8000-000000000201
                        gateway: esewa
                        environment: uat
                        status: held_for_review
                        amount:
                          amount_paisa: 150000
                          currency: NPR
                        hold_reason: amount_mismatch
                        created_at: 2026-01-15T04:30:00.000Z
                        expires_at: 2026-01-15T05:00:00.000Z
                        last_checked_at: 2026-01-15T04:31:10.000Z
                        version: 3
                    page:
                      limit: 50
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
