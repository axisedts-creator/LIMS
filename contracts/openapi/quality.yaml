          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - code
                - name
                - levels
              properties:
                code:
                  type: string
                  minLength: 2
                  maxLength: 32
                  pattern: ^[A-Z0-9_-]{2,32}$
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                manufacturer:
                  type: string
                  minLength: 1
                  maxLength: 120
                matrix:
                  type: string
                  minLength: 1
                  maxLength: 60
                levels:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - level_code
                      - display_name
                      - sort_order
                    properties:
                      level_code:
                        type: string
                        minLength: 1
                        maxLength: 16
                        pattern: ^[A-Za-z0-9]{1,16}$
                      display_name:
                        type: string
                        minLength: 1
                        maxLength: 60
                      sort_order:
                        type: integer
                        minimum: 0
                        maximum: 99
            examples:
              synthetic:
                value:
                  code: SYN_CHEM_CTRL
                  name: Synthetic Chemistry Control
                  manufacturer: Synthetic Controls Co
                  matrix: serum
                  levels:
