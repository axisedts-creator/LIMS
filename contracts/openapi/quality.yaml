        maxLength: 18
        enum:
          - corrective_actions
          - exclusion_reasons
    CodeParam:
      name: code
      in: path
      required: true
      schema:
        $ref: _common.yaml#/components/schemas/Code
  schemas:
    QcPlanParams:
      type: object
      additionalProperties: false
      required:
        - controls_per_run
        - composition
      description: TRD §5.3; sum(composition.count) = controls_per_run (handler check).
      properties:
        controls_per_run:
          type: integer
          minimum: 2
          maximum: 4
          enum:
            - 2
            - 3
            - 4
        composition:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required:
              - level_id
              - count
            properties:
              level_id:
                $ref: _common.yaml#/components/schemas/Uuid
              count:
                type: integer
                minimum: 1
                maximum: 4
        mean_rule:
          type: string
          maxLength: 3
          enum:
            - 8x
            - 10x
            - 12x
            - 6x
            - 9x
          description: "N∈{2,4}: 8x/10x/12x (default 10x); N=3: 6x/9x (default 6x) — TRD §5.3."
        two_two_s_across_runs:
          type: boolean
          default: true
        count_rules_across_materials:
          type: boolean
          default: true
        exclude_rejected_runs_from_history:
          type: boolean
          default: true
        run_window_minutes:
          type: integer
          minimum: 5
          maximum: 240
          default: 30
        qc_validity_hours:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
        hold_lookback_hours:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
    QcPlanParamsDefaults:
      type: object
      additionalProperties: false
      description: QcPlanParams minus required fields (TRD §12.1 default_plan_params).
      properties:
