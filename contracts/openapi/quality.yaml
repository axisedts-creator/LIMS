          type: string
          maxLength: 3
          enum:
            - 8x
            - 10x
            - 12x
            - 6x
            - 9x
          description: "N∈{2,4}: 8x/10x/12x (default 10x); N=3: 6x/9x (default 6x) — TRD §5.3."
        two_two_s_across_runs:
          type: boolean
          default: true
        count_rules_across_materials:
          type: boolean
          default: true
        exclude_rejected_runs_from_history:
          type: boolean
          default: true
        run_window_minutes:
          type: integer
          minimum: 5
          maximum: 240
          default: 30
        qc_validity_hours:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
        hold_lookback_hours:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
