        $ref: _common.yaml#/components/schemas/Uuid
    TargetId:
      name: target_id
      in: path
      required: true
      schema:
        $ref: _common.yaml#/components/schemas/Uuid
    ObservationId:
      name: observation_id
      in: path
      required: true
