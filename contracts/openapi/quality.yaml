    SimulationReportDto:
      type: object
      additionalProperties: false
      required:
        - version_id
        - started_at
        - days_running
        - decisions
        - would_allow
        - would_deny
        - deny_by_reason
        - allow_later_manually_verified
        - allow_not_verified_yet
        - sample
      properties:
        version_id:
          $ref: _common.yaml#/components/schemas/Uuid
        started_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        days_running:
          type: integer
          minimum: 0
          maximum: 2147483647
        decisions:
          type: integer
          minimum: 0
          maximum: 2147483647
        would_allow:
          type: integer
          minimum: 0
          maximum: 2147483647
        would_deny:
          type: integer
          minimum: 0
          maximum: 2147483647
        deny_by_reason:
          type: object
          additionalProperties: false
          description: Count per deny reason (reason absent = 0).
          properties:
            manual_origin:
              type: integer
              minimum: 0
              maximum: 2147483647
            rule_missing:
              type: integer
              minimum: 0
              maximum: 2147483647
            critical:
              type: integer
              minimum: 0
              maximum: 2147483647
            delta_failure:
              type: integer
              minimum: 0
              maximum: 2147483647
            instrument_flag:
              type: integer
              minimum: 0
              maximum: 2147483647
            outside_autoverify_limits:
              type: integer
              minimum: 0
              maximum: 2147483647
            qc_out_of_control:
              type: integer
              minimum: 0
              maximum: 2147483647
            qc_warning:
              type: integer
              minimum: 0
              maximum: 2147483647
            qc_no_data:
              type: integer
              minimum: 0
              maximum: 2147483647
        allow_later_manually_verified:
          type: integer
          minimum: 0
          maximum: 2147483647
        allow_not_verified_yet:
          type: integer
          minimum: 0
          maximum: 2147483647
        live_comparison:
          type: object
          additionalProperties: false
          required:
            - both_allow
            - live_only_allow
            - shadow_only_allow
          properties:
            both_allow:
              type: integer
              minimum: 0
              maximum: 2147483647
            live_only_allow:
              type: integer
              minimum: 0
              maximum: 2147483647
            shadow_only_allow:
              type: integer
              minimum: 0
              maximum: 2147483647
        sample:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
              - decision_id
              - result_id
              - analyte_id
              - decided_at
              - shadow_decision
              - shadow_reasons
            properties:
              decision_id:
                $ref: _common.yaml#/components/schemas/Uuid
              result_id:
                $ref: _common.yaml#/components/schemas/Uuid
              order_id:
                $ref: _common.yaml#/components/schemas/Uuid
              analyte_id:
                $ref: _common.yaml#/components/schemas/Uuid
              decided_at:
                $ref: _common.yaml#/components/schemas/IsoUtc
              shadow_decision:
                type: string
                maxLength: 5
                enum:
                  - allow
                  - deny
              shadow_reasons:
                type: array
                uniqueItems: true
                maxItems: 9
                items:
                  type: string
                  maxLength: 25
                  enum:
                    - manual_origin
                    - rule_missing
                    - critical
                    - delta_failure
                    - instrument_flag
                    - outside_autoverify_limits
                    - qc_out_of_control
                    - qc_warning
                    - qc_no_data
              live_decision:
                type: string
                maxLength: 5
                enum:
                  - allow
                  - deny
              manually_verified_at:
                $ref: _common.yaml#/components/schemas/IsoUtc
    LjChartDto:
      type: object
      additionalProperties: false
      required:
        - plan
        - view
        - series
        - truncated
      description: TRD §7.10.
      properties:
        plan:
          type: object
          additionalProperties: false
          required:
            - id
            - instrument_id
            - analyte_id
            - analyte_code
            - decimals
          properties:
            id:
              $ref: _common.yaml#/components/schemas/Uuid
            instrument_id:
              $ref: _common.yaml#/components/schemas/Uuid
            analyte_id:
              $ref: _common.yaml#/components/schemas/Uuid
            analyte_code:
              $ref: _common.yaml#/components/schemas/Code
            unit_code:
              $ref: _common.yaml#/components/schemas/Code
            decimals:
              type: integer
              minimum: 0
              maximum: 10
        view:
          type: string
          maxLength: 5
          enum:
            - level
            - z
        series:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
              - level_id
              - level_code
              - lot_id
              - lot_no
              - points
              - targets
            properties:
              level_id:
                $ref: _common.yaml#/components/schemas/Uuid
              level_code:
                type: string
                minLength: 1
                maxLength: 16
                pattern: ^[A-Za-z0-9]{1,16}$
              lot_id:
                $ref: _common.yaml#/components/schemas/Uuid
              lot_no:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^[\x21-\x7E]([\x20-\x7E]{0,62}[\x21-\x7E])?$
              points:
                type: array
                maxItems: 2000
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - observation_id
                    - observed_at
                    - value
                    - status
                    - rule_hits
                  properties:
                    observation_id:
                      $ref: _common.yaml#/components/schemas/Uuid
                    observed_at:
                      $ref: _common.yaml#/components/schemas/IsoUtc
                    value:
                      $ref: _common.yaml#/components/schemas/DecimalString
                    z:
                      $ref: _common.yaml#/components/schemas/DecimalString
                    status:
                      type: string
                      maxLength: 11
                      enum:
                        - accepted
                        - warning
                        - rejected
                        - excluded
                        - unevaluated
                        - collecting
                    qc_run_id:
                      $ref: _common.yaml#/components/schemas/Uuid
                    rule_hits:
                      type: array
                      maxItems: 20
                      items:
                        $ref: _common.yaml#/components/schemas/Code
              targets:
                type: array
                maxItems: 200
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - target_id
                    - effective_from
                    - mean
                    - sd
                    - source
                  properties:
                    target_id:
                      $ref: _common.yaml#/components/schemas/Uuid
                    effective_from:
                      $ref: _common.yaml#/components/schemas/IsoUtc
                    effective_to:
                      $ref: _common.yaml#/components/schemas/IsoUtc
                    mean:
                      $ref: _common.yaml#/components/schemas/DecimalString
                    sd:
                      $ref: _common.yaml#/components/schemas/DecimalString
                    source:
                      type: string
                      maxLength: 12
                      enum:
                        - manufacturer
                        - established
        truncated:
          type: boolean
          description: More than LIMS_QUALITY_LJ_MAX_POINTS; newest kept.
    QualityCode:
      type: object
      additionalProperties: false
      required:
        - code
        - display
        - sort_order
        - is_active
        - source
      properties:
        code:
          $ref: _common.yaml#/components/schemas/Code
        display:
          type: string
          minLength: 1
          maxLength: 120
        sort_order:
          type: integer
          minimum: 0
          maximum: 999
        is_active:
          type: boolean
        source:
          type: string
          maxLength: 6
          enum:
            - global
            - tenant
