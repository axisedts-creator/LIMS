                type: string
                maxLength: 9
                enum:
                  - warning
                  - breached
                  - escalated
              raised_at:
                $ref: _common.yaml#/components/schemas/IsoUtc
              elapsed_seconds:
                type: integer
                minimum: 0
                maximum: 2147483647
              restart_no:
                type: integer
                minimum: 0
                maximum: 2147483647
        acknowledgements:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
              - level
              - acknowledged_by_display
              - created_at
            properties:
              level:
                type: string
                maxLength: 9
                enum:
                  - warning
                  - breached
                  - escalated
              note:
                type: string
                maxLength: 500
              acknowledged_by_display:
                type: string
                maxLength: 200
              created_at:
