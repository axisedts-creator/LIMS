# contracts/openapi/quality.yaml (C9) — transcription of spec/chunks/C9-quality-engine/02-TRD.md §5.1–§5.8 (#1–#54), DTOs §5.10, QcPlanParams §5.3,
# RuleSetDefinition §8.2, LjChartDto §7.10, SimulationReportDto §8.6, settings §12.1 — 54 ops (T0C-10.C9; AC-0C-1.4/1.5).
# LD-103 (2026-11-11): wave-2 transcription scheduled by the human lead; owner approval given by that decision. Generated once from the TRD tables, then owned by C9.
# Notes:
# - Examples are synthetic (uuids 01a1a98a-ac40-7000-8000-0000000c…, "Synthetic …" labels); no PHI, secret or token appears anywhere.
# - [CONV] every operation lists the §5.0 common codes incl. common.feature_disabled (phase gate); quality.autoverify.manage ops add auth.mfa_required; Idem R ops add
#   the Idempotency-Key header + three idempotency codes; If-Match rows add _common IfMatch + version_conflict + precondition_required; paged lists add invalid_cursor;
#   error responses derive from errors.yaml http. Optional-idempotency ops declare no Idempotency-Key header (wave-1 convention).
# - [CONV] TRD-open shapes: csv filters as patterned strings; rule names (1-2s, …) as Code; observation status enum from TRD §6.3; rule_mode / alert_level /
#   stop_source enums from 05-SCHEMA CHECKs; deny_by_reason as a closed object keyed by reason; #15/#16 responses QcPlanDtoWithWarnings / QcPlanDtoWithVersions;
#   QcRunDto observations = QcRunObservationDto (QcObservationDto + rule_hits); #37 "exactly one" = oneOf; fields not marked "?" in §5.10 but absent by state
#   (e.g. outcome while collecting, closed_at, effective_to, unit_code) are optional (no null on the wire, 02-CV §4.2).
openapi: 3.0.3
info:
  title: LIMS quality (C9)
  version: 1.0.0
  description: Transcribed from spec/chunks/C9-quality-engine/02-TRD.md §5.0–§5.10, §7.10, §8.2, §8.6, §12.1 (T0C-10.C9, LD-103).
paths:
  /v1/quality/control-materials:
    get:
      operationId: listControlMaterials
      tags:
        - quality
      summary: "List control materials (TRD §5 #1)"
      security:
        - bearerJwt: []
      x-permission: quality.qc_run.read
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - auth.unauthenticated
        - auth.token_invalid
        - auth.token_expired
        - auth.forbidden
        - auth.account_locked
        - common.not_found
        - common.rate_limited
        - common.internal
        - common.dependency_unavailable
        - common.feature_disabled
        - common.invalid_cursor
      parameters:
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: q
          in: query
          required: false
          description: Code or name prefix.
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - name: sort
          in: query
          required: false
          schema:
            type: string
            maxLength: 11
            enum:
              - code
              - -created_at
            default: code
        - $ref: _common.yaml#/components/parameters/Cursor
        - $ref: _common.yaml#/components/parameters/Limit
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/ControlMaterialDto"
                  page:
                    $ref: _common.yaml#/components/schemas/PageInfo
              examples:
                synthetic:
                  value:
                    data:
                      - id: 01a1a98a-ac40-7000-8000-0000000c1003
                        version: 1
                        code: SYN_CHEM_CTRL
                        name: Synthetic Chemistry Control
                        manufacturer: Synthetic Controls Co
                        matrix: serum
                        is_active: true
                        levels:
                          - id: 01a1a98a-ac40-7000-8000-0000000c1004
                            version: 1
                            material_id: 01a1a98a-ac40-7000-8000-0000000c1003
                            level_code: L1
                            display_name: Synthetic Level 1
                            sort_order: 1
                            is_active: true
                          - id: 01a1a98a-ac40-7000-8000-0000000c1005
                            version: 1
                            material_id: 01a1a98a-ac40-7000-8000-0000000c1003
                            level_code: L2
                            display_name: Synthetic Level 2
                            sort_order: 2
                            is_active: true
