    SmartSummary:
      type: object
      additionalProperties: false
      required:
        - summaryId
        - orderId
        - reportVersionNo
        - templateLibraryVersion
        - status
        - panels
        - deranged
        - advice
        - followUps
        - trends
        - disclaimerBlockId
      properties:
        summaryId:
          $ref: _common.yaml#/components/schemas/Uuidv7
        orderId:
          $ref: _common.yaml#/components/schemas/Uuidv7
        reportVersionNo:
          type: integer
          minimum: 1
          maximum: 100000
        templateLibraryVersion:
          type: string
          maxLength: 40
        status:
          type: string
          maxLength: 8
          enum:
            - draft
            - approved
        approvedByMembershipId:
          $ref: _common.yaml#/components/schemas/Uuidv7
        approvedAt:
          $ref: _common.yaml#/components/schemas/IsoUtc
        healthScore:
          type: object
          additionalProperties: false
          required:
            - value
            - band
            - formulaVersion
            - panelsScored
          properties:
            value:
              type: number
              minimum: 0
              maximum: 100
            band:
              type: string
              maxLength: 15
              enum:
                - good
                - fair
                - needs_attention
            formulaVersion:
              type: string
              maxLength: 40
            panelsScored:
              type: integer
              minimum: 0
              maximum: 200
            explanationText:
              type: string
              maxLength: 2000
        panels:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
              - panelCode
              - status
              - resultIds
            properties:
              panelCode:
                $ref: _common.yaml#/components/schemas/Code
              status:
                type: string
                maxLength: 12
                enum:
                  - in_range
                  - borderline
                  - out_of_range
                  - critical
              resultIds:
                type: array
                maxItems: 200
                items:
                  $ref: _common.yaml#/components/schemas/Uuidv7
              displayName:
                type: string
                maxLength: 200
        deranged:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
              - resultId
              - analyteId
              - direction
              - severity
              - templateBlockId
              - text
            properties:
              resultId:
                $ref: _common.yaml#/components/schemas/Uuidv7
              analyteId:
                $ref: _common.yaml#/components/schemas/Uuidv7
              direction:
                type: string
                maxLength: 8
                enum:
                  - low
                  - high
                  - abnormal
              severity:
                type: string
                maxLength: 12
                enum:
                  - in_range
                  - borderline
                  - out_of_range
                  - critical
              templateBlockId:
                $ref: _common.yaml#/components/schemas/Uuidv7
              text:
                type: string
                maxLength: 2000
              analyteName:
                type: string
                maxLength: 200
        advice:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
              - templateBlockId
              - text
            properties:
              templateBlockId:
                $ref: _common.yaml#/components/schemas/Uuidv7
              text:
                type: string
                maxLength: 2000
        followUps:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
              - ruleId
              - suggestedTestCode
              - intervalDays
              - text
            properties:
              ruleId:
                $ref: _common.yaml#/components/schemas/Uuidv7
              suggestedTestCode:
                $ref: _common.yaml#/components/schemas/Code
              intervalDays:
                type: integer
                minimum: 1
                maximum: 3650
              text:
                type: string
                maxLength: 2000
              suggestedTestName:
                type: string
                maxLength: 200
        trends:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
              - analyteId
              - direction
              - pointResultIds
            properties:
              analyteId:
                $ref: _common.yaml#/components/schemas/Uuidv7
              direction:
                type: string
                maxLength: 8
                enum:
                  - improved
                  - worsened
                  - stable
              pointResultIds:
                type: array
                maxItems: 200
                items:
                  $ref: _common.yaml#/components/schemas/Uuidv7
              analyteName:
                type: string
                maxLength: 200
              unitCode:
                $ref: _common.yaml#/components/schemas/Code
              points:
                type: array
                maxItems: 200
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - resultId
                    - approvedAt
                    - valueNumeric
                  properties:
                    resultId:
                      $ref: _common.yaml#/components/schemas/Uuidv7
                    approvedAt:
                      $ref: _common.yaml#/components/schemas/IsoUtc
                    valueNumeric:
                      $ref: _common.yaml#/components/schemas/DecimalString
        disclaimerBlockId:
          $ref: _common.yaml#/components/schemas/Uuidv7
        language:
          type: string
          maxLength: 2
          enum:
            - en
            - ne
        builtAt:
          $ref: _common.yaml#/components/schemas/IsoUtc
        disclaimerText:
          type: string
          maxLength: 2000
      description: 03-IC §4.10 SmartSummary (camelCase, as stored in report_versions.smart_summary_json).
