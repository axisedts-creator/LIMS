        - common.internal
        - reporting.verify_not_found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - qr_token
              properties:
                qr_token:
                  type: string
                  maxLength: 64
            examples:
              synthetic:
                value:
                  qr_token: SyntheticQrToken000001
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - lab_name
                  - patient_display
                  - panel_names
                  - issued_at
                  - version_no
                  - status
                properties:
                  lab_name:
                    type: string
                    maxLength: 200
                  patient_display:
                    type: string
                    maxLength: 60
                  panel_names:
                    type: array
                    maxItems: 200
                    items:
                      type: string
                      maxLength: 200
                  issued_at:
                    $ref: _common.yaml#/components/schemas/IsoUtc
                  version_no:
                    type: integer
                    minimum: 1
                    maximum: 100000
                  status:
                    type: string
                    maxLength: 10
                    enum:
                      - valid
                      - superseded
              examples:
                synthetic:
                  value:
                    lab_name: Synthetic Lab
                    patient_display: Synthetic P.
                    panel_names:
                      - Synthetic panel names
                    issued_at: 2026-11-05T04:15:00.000Z
                    version_no: 1
                    status: valid
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
  /v1/reporting/provider-callbacks/{callback_token}:
    post:
      operationId: receiveProviderCallback
      tags:
        - reporting
      summary: Receive a provider delivery-status callback (CB1)
      description: nginx 60 r/m/IP flood guard (CR-C6-013). Never trusts the body to identify a tenant.
      security: []
      x-public: provider delivery-status callbacks, authenticated by per-account path token + adapter signature check
      x-idempotency: none
      x-idempotency-justification: "E4 pre-auth callback (LD-10): no client Idempotency-Key exists; duplicates are dropped by the provider_events unique key; the empty response is not replayed."
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.rate_limited
        - common.internal
        - reporting.callback_rejected
      x-raw-body: true
      parameters:
        - name: callback_token
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]{1,64}$
            description: Per-account callback path token (hashed server-side).
      requestBody:
        required: true
        description: Raw provider body (CR-C6-001 raw-body mode, ≤ 256 KB); parsed and signature-checked by the adapter.
        content:
          "*/*":
            schema:
              type: string
              format: binary
              maxLength: 262144
            examples:
              synthetic:
                value: synthetic-provider-body
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties: {}
              examples:
                synthetic:
                  value: {}
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
    get:
      operationId: verifyProviderCallback
      tags:
        - reporting
      summary: Answer a provider verification handshake (CB2)
      description: Query passed raw to the adapter (only if the provider's documented handshake needs it — UNVERIFIED).
      security: []
      x-public: provider delivery-status callbacks, authenticated by per-account path token + adapter signature check
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.rate_limited
        - common.internal
        - reporting.callback_rejected
      parameters:
        - name: callback_token
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]{1,64}$
            description: Per-account callback path token (hashed server-side).
      responses:
        "200":
          description: Adapter-defined verification response.
          content:
            text/plain:
              schema:
                type: string
                maxLength: 1000
              examples:
                synthetic:
                  value: synthetic-challenge
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
