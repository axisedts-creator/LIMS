# contracts/openapi/reporting.yaml (C6) — transcription of spec/chunks/C6-reporting-delivery/02-TRD.md §6.1–§6.7 (T0C-10.C6; AC-0C-1.4/1.5).
# Generated once from the TRD tables, then owned by C6. Notes:
# - Examples are synthetic (uuids 0193c4a0-0000-7000-8000-…, "Synthetic …" strings, *.example.invalid hosts).
# - [CONV] IM rows list common.version_conflict + common.precondition_required; required-idem rows list common.idempotency_key_reused.
# - [CONV] portal ops list reporting.link_invalid (resolver failure, §6.6); P-10 conditional permissions are named in the operation description.
# - P-8 / LD-10: idem-none POSTs: C3 E1; P1/P2/P5 E2; R2/Q1 E3 (read-only); P6/CB1 E4.
# - [CONV] M2 If-Match is an optional path-level header (absent = create).
openapi: 3.0.3
info:
  title: LIMS reporting (C6)
  version: 1.0.0
  description: Transcribed from spec/chunks/C6-reporting-delivery/02-TRD.md §6 (T0C-10.C6).
paths:
  /v1/reporting/reports:
    get:
      operationId: listReports
      tags:
        - reporting
      summary: List reports (R1)
      security:
        - bearerJwt: []
      x-permission: reporting.report.read
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.invalid_cursor
      parameters:
        - name: display_status
          in: query
          required: false
          description: Multi-value (form, comma-separated).
          schema:
            type: array
            maxItems: 8
            items:
              type: string
              maxLength: 16
              enum:
                - awaiting_content
                - assembling
                - rendering
                - render_failed
                - held
                - ready_to_release
                - released
                - cancelled
            uniqueItems: true
          style: form
          explode: false
        - name: family
          in: query
          required: false
          schema:
            type: string
            maxLength: 10
            enum:
              - laboratory
              - narrative
        - name: centre_id
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - name: registered_at_from
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: registered_at_to
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: released_at_from
          in: query
          required: false
          description: On reports.first_released_at [CONV].
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: released_at_to
          in: query
          required: false
          schema:
            $ref: _common.yaml#/components/schemas/IsoUtc
        - name: has_review_flag
          in: query
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          description: -released_at = -first_released_at.
          schema:
            type: string
            maxLength: 13
            enum:
              - -updated_at
              - registered_at
              - -released_at
        - $ref: _common.yaml#/components/parameters/Cursor
        - $ref: _common.yaml#/components/parameters/Limit
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/ReportSummary"
                  page:
                    $ref: _common.yaml#/components/schemas/PageInfo
              examples:
                synthetic:
                  value:
                    data:
                      - id: 0193c4a0-0000-7000-8000-000000000001
                        order_id: 0193c4a0-0000-7000-8000-000000000002
                        family: laboratory
                        centre_id: 0193c4a0-0000-7000-8000-000000000003
                        state: open
                        display_status: awaiting_content
                        registration_no: R2611050001
                        patient_display_name: Synthetic P.
                        centre_code: SYN_CODE
                        referrer_name: Synthetic referrer name
                        items_total: 1
                        items_ready: 1
                        latest_version_no: 1
                        released_version_no: 1
                        held_basis: due_outstanding
                        balance_due_paisa: 1
                        registered_at: 2026-11-05T04:15:00.000Z
                        first_released_at: 2026-11-05T04:15:00.000Z
                        updated_at: 2026-11-05T04:15:00.000Z
                        version: 1
                    page:
                      next_cursor: Synthetic next cursor
                      limit: 1
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
  /v1/reporting/reports/search:
    post:
      operationId: searchReports
      tags:
        - reporting
      summary: Search reports by registration no, barcode, order or patient (R2)
      description: "Permission: reporting.report.read + lab.specimen.read when barcode is given (P-10; checked in the handler with IdentityPort.assertRole → auth.forbidden). Exactly one key; PHI in the body, never the URL (02-CV §4.1). barcode → LabPort.lookupSpecimens as the user."
      security:
        - bearerJwt: []
      x-permission: reporting.report.read
      x-context: tenant
      x-idempotency: none
      x-idempotency-justification: "E3 read-only POST (LD-10): search keys (PHI) in the body, no state written, nothing to replay."
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - registration_no
                  properties:
                    registration_no:
                      type: string
                      maxLength: 20
                - type: object
                  additionalProperties: false
                  required:
                    - barcode
                  properties:
                    barcode:
                      type: string
                      maxLength: 20
                - type: object
                  additionalProperties: false
                  required:
                    - order_id
                  properties:
                    order_id:
                      $ref: _common.yaml#/components/schemas/Uuid
                - type: object
                  additionalProperties: false
                  required:
                    - patient_id
                  properties:
                    patient_id:
                      $ref: _common.yaml#/components/schemas/Uuid
            examples:
              synthetic:
                value:
                  registration_no: R2611050001
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: array
                    maxItems: 50
                    items:
                      $ref: "#/components/schemas/ReportSummary"
              examples:
                synthetic:
                  value:
                    data:
                      - id: 0193c4a0-0000-7000-8000-000000000004
                        order_id: 0193c4a0-0000-7000-8000-000000000005
                        family: laboratory
                        centre_id: 0193c4a0-0000-7000-8000-000000000006
                        state: open
                        display_status: awaiting_content
                        registration_no: R2611050001
                        patient_display_name: Synthetic P.
                        centre_code: SYN_CODE
                        referrer_name: Synthetic referrer name
                        items_total: 1
                        items_ready: 1
                        latest_version_no: 1
                        released_version_no: 1
                        held_basis: due_outstanding
                        balance_due_paisa: 1
                        registered_at: 2026-11-05T04:15:00.000Z
                        first_released_at: 2026-11-05T04:15:00.000Z
                        updated_at: 2026-11-05T04:15:00.000Z
                        version: 1
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
  /v1/reporting/reports/{report_id}:
    get:
      operationId: getReport
      tags:
        - reporting
      summary: Get a report (R3)
      description: Access log report.view.
      security:
        - bearerJwt: []
      x-permission: reporting.report.read
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
              examples:
                synthetic:
                  value:
                    id: 0193c4a0-0000-7000-8000-000000000007
                    order_id: 0193c4a0-0000-7000-8000-000000000008
                    family: laboratory
                    centre_id: 0193c4a0-0000-7000-8000-000000000009
                    state: open
                    display_status: awaiting_content
                    registration_no: R2611050001
                    patient_display_name: Synthetic P.
                    centre_code: SYN_CODE
                    referrer_name: Synthetic referrer name
                    items_total: 1
                    items_ready: 1
                    latest_version_no: 1
                    released_version_no: 1
                    held_basis: due_outstanding
                    balance_due_paisa: 1
                    registered_at: 2026-11-05T04:15:00.000Z
                    first_released_at: 2026-11-05T04:15:00.000Z
                    updated_at: 2026-11-05T04:15:00.000Z
                    version: 1
                    items:
                      - order_item_id: 0193c4a0-0000-7000-8000-000000000010
                        test_names:
                          - Synthetic test names
                        item_kind: test
                        requires_lab: false
                        requires_narrative: false
                        requires_outsourced: false
                        lab_ready: false
                        narrative_ready: false
                        outsourced_ready: false
                        item_status: active
                    versions:
                      - id: 0193c4a0-0000-7000-8000-000000000011
                        version_no: 1
                        status: rendering
                        report_kind: final
                        completeness: complete
                        page_count: 1
                        pdf_bytes: 1
                        rendered_at: 2026-11-05T04:15:00.000Z
                        released_at: 2026-11-05T04:15:00.000Z
                        release_basis: paid_in_full
                        audiences:
                          - patient
                        supersedes_version_no: 1
                        superseded_at: 2026-11-05T04:15:00.000Z
                        held_basis: due_outstanding
                        held_checked_at: 2026-11-05T04:15:00.000Z
                        last_render_error_code: SYN_CODE
                        version: 1
                    deliveries_summary:
                      queued: 1
                      sent: 1
                      delivered: 1
                      read: 1
                      failed: 1
                      suppressed: 1
                    review_flag: released_order_cancelled
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
