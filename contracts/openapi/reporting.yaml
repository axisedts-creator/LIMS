      additionalProperties: false
      required:
        - id
        - state
        - variant
        - copies
        - expires_at
      properties:
        id:
          $ref: _common.yaml#/components/schemas/Uuid
        state:
          type: string
          maxLength: 9
          enum:
            - rendering
            - ready
            - failed
            - expired
        variant:
          type: string
          maxLength: 10
          enum:
            - letterhead
            - plain
        copies:
          type: integer
          minimum: 1
          maximum: 5
        expires_at:
          $ref: _common.yaml#/components/schemas/IsoUtc
        excluded_ids:
          type: array
          maxItems: 200
          items:
            $ref: _common.yaml#/components/schemas/Uuid
          uniqueItems: true
          description: "Bulk print: ids not released (reporting.report_not_released per id)."
        error_code:
          $ref: _common.yaml#/components/schemas/Code
    TemplateConfig:
      type: object
      additionalProperties: false
      required:
        - page
        - letterhead
        - header_fields
        - results
        - signatories
        - qr
        - disclaimers
        - fonts
        - narrative
      properties:
        page:
          type: object
          additionalProperties: false
          required:
            - size
            - margin_mm
          properties:
            size:
              type: string
              maxLength: 6
              enum:
                - A4
                - Letter
            margin_mm:
              type: object
              additionalProperties: false
              required:
                - top
                - bottom
                - left
                - right
              properties:
                top:
                  type: integer
                  minimum: 5
                  maximum: 80
                bottom:
                  type: integer
                  minimum: 5
                  maximum: 80
                left:
                  type: integer
                  minimum: 5
                  maximum: 40
                right:
                  type: integer
                  minimum: 5
                  maximum: 40
        letterhead:
          type: object
          additionalProperties: false
          required:
            - header_asset
            - footer_asset
            - plain_reserve_top_mm
            - plain_reserve_bottom_mm
          properties:
            header_asset:
              type: string
              maxLength: 8
              enum:
                - branding
                - none
            footer_asset:
              type: string
              maxLength: 8
              enum:
                - branding
                - none
            plain_reserve_top_mm:
              type: integer
              minimum: 0
              maximum: 80
            plain_reserve_bottom_mm:
              type: integer
              minimum: 0
              maximum: 80
        header_fields:
          type: array
          maxItems: 11
          items:
            $ref: _common.yaml#/components/schemas/Code
          uniqueItems: true
          description: Ordered subset of the 11 header fields (domain/templates.ts).
        results:
          type: object
          additionalProperties: false
          properties:
            show_method_line:
              type: boolean
              default: true
            show_units_column:
              type: boolean
            group_by_package:
              type: boolean
              default: true
            page_break_before_department:
              type: boolean
            show_department_approved_by:
              type: boolean
        signatories:
          type: object
          additionalProperties: false
          required:
            - mode
            - max
          properties:
            mode:
              type: string
              maxLength: 9
              enum:
                - approvers
                - nominated
            max:
              type: integer
              minimum: 1
              maximum: 4
              default: 2
            show_signature_images:
              type: boolean
            label_registration:
              type: string
              maxLength: 20
              default: NMC No.
        qr:
          type: object
          additionalProperties: false
          required:
            - enabled
          properties:
            enabled:
              type: boolean
            size_mm:
              type: integer
              minimum: 15
              maximum: 35
            caption:
              type: string
              maxLength: 60
              default: Scan to verify
        watermark:
          type: object
          additionalProperties: false
          required:
            - text
            - opacity
          properties:
            text:
              type: string
              maxLength: 40
            opacity:
              type: number
              minimum: 0.05
              maximum: 0.3
        disclaimers:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 200
        contact_strip_extra:
          type: string
          maxLength: 300
        fonts:
          type: object
          additionalProperties: false
          properties:
            base_pt:
              type: integer
              minimum: 7
              maximum: 11
              default: 9
        narrative:
          type: object
          additionalProperties: false
          properties:
            show_images_grid_columns:
              type: integer
              minimum: 1
              maximum: 3
      description: "02-TRD §6.5 TemplateConfig (additionalProperties: false everywhere)."
