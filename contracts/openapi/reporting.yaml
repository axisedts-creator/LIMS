  /v1/reporting/report-versions/{report_version_id}/pdf:
    get:
      operationId: downloadReportVersionPdf
      tags:
        - reporting
      summary: Download a report version PDF (R5)
      description: 'Content-Disposition: attachment; filename="report-v{n}.pdf". reporting.report_not_released when unreleased and the caller lacks reporting.report.release. Access log report.download.'
      security:
        - bearerJwt: []
      x-permission: reporting.report.read
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - reporting.report_not_released
      parameters:
        - name: report_version_id
          in: path
          required: true
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
      responses:
        "200":
          description: File stream (core streaming download helper, 08 A13 P-2).
          headers:
            Content-Disposition:
              description: attachment; filename=…
              required: true
              schema:
                type: string
                maxLength: 255
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                maxLength: 7
                enum:
                  - nosniff
            Cache-Control:
              required: true
              schema:
                type: string
                maxLength: 8
                enum:
                  - no-store
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                maxLength: 104857600
              examples:
                synthetic:
                  value: synthetic-file-bytes
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "409":
          $ref: _common.yaml#/components/responses/Conflict
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
  /v1/reporting/report-versions/{report_version_id}/release:
    post:
      operationId: releaseReportVersion
      tags:
        - reporting
      summary: Release a report version (R6)
      description: audiences must be a subset of the computed set (§4.6 rule 6). release_blocked_due problem adds release_basis and balance_due_paisa.
      security:
        - bearerJwt: []
      x-permission: reporting.report.release
      x-context: tenant
      x-idempotency: required
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.version_conflict
        - common.precondition_required
        - common.idempotency_key_reused
        - reporting.release_blocked_due
        - reporting.release_not_ready
        - reporting.version_not_latest
        - reporting.report_cancelled
      parameters:
        - name: report_version_id
          in: path
          required: true
          schema:
            $ref: _common.yaml#/components/schemas/Uuid
        - $ref: _common.yaml#/components/parameters/IdempotencyKey
        - $ref: _common.yaml#/components/parameters/IfMatch
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                audiences:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                    maxLength: 8
                    enum:
                      - patient
                      - referrer
                      - centre
                      - partner
                  uniqueItems: true
                suppress_notifications:
                  type: boolean
            examples:
              synthetic:
                value:
                  audiences:
                    - patient
                  suppress_notifications: false
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportVersionSummary"
              examples:
                synthetic:
                  value:
                    id: 0193c4a0-0000-7000-8000-000000000013
                    version_no: 1
                    status: rendering
                    report_kind: final
                    completeness: complete
                    page_count: 1
                    pdf_bytes: 1
                    rendered_at: 2026-11-05T04:15:00.000Z
                    released_at: 2026-11-05T04:15:00.000Z
                    release_basis: paid_in_full
                    audiences:
                      - patient
                    supersedes_version_no: 1
                    superseded_at: 2026-11-05T04:15:00.000Z
                    held_basis: due_outstanding
                    held_checked_at: 2026-11-05T04:15:00.000Z
                    last_render_error_code: SYN_CODE
                    version: 1
        "400":
          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "409":
          $ref: _common.yaml#/components/responses/Conflict
        "422":
          $ref: _common.yaml#/components/responses/Unprocessable
        "428":
          $ref: _common.yaml#/components/responses/PreconditionRequired
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
  /v1/reporting/report-versions/bulk-release:
    post:
      operationId: bulkReleaseReportVersions
      tags:
        - reporting
      summary: Bulk-release report versions (R7)
      description: Privileged (REQ-SEC-100). ids above tenant bulk_release_max → reporting.bulk_release_too_large.
      security:
        - bearerJwt: []
      x-permission: reporting.report.bulk_release
      x-context: tenant
      x-idempotency: required
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.idempotency_key_reused
        - reporting.bulk_release_too_large
        - auth.mfa_required
      parameters:
        - $ref: _common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ids
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items:
                    $ref: _common.yaml#/components/schemas/Uuid
                  uniqueItems: true
                  minItems: 1
            examples:
              synthetic:
                value:
                  ids:
                    - 0193c4a0-0000-7000-8000-000000000015
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - results
                properties:
                  results:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - id
                        - outcome
                      properties:
                        id:
                          $ref: _common.yaml#/components/schemas/Uuid
                        outcome:
                          type: string
                          maxLength: 16
                          enum:
