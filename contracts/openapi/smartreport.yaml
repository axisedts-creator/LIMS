                      min_mapped_results: 3
                      trend_enabled: true
                      trend_max_points: 3
                      trend_lookback_days: 365
                      trend_stable_bp: 500
                      trends_max: 6
                      advice_max_blocks: 5
                      followup_max: 3
                    source_version_id: 01940e00-0000-7000-8000-a00000000014
                    change_summary: "Synthetic edit: wording update"
                    counts:
                      blocks: 42
                      rules: 60
                      analyte_groups: 35
                      groups_shown: 12
                    version: 4
                    created_at: 2026-01-15T04:30:00.000Z
                    updated_at: 2026-01-15T05:10:00.000Z
        "400":
