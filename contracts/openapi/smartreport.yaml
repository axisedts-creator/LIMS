# contracts/openapi/smartreport.yaml (C14) — transcription of spec/chunks/C14-smart-report/02-TRD.md §5 (#1–#35) and §5.1, 35 ops (T0C-10.C14; AC-0C-1.4/1.5).
# LD-103 (2026-11-11): wave-2 transcription scheduled by the human lead; owner approval given by that decision. Generated once from the TRD tables, then owned by C14.
# Notes:
# - Examples are synthetic (uuids 01940e00-0000-7000-8000-…, "Synthetic …" labels, registration SYN-…); no secret or token appears anywhere.
# - [CONV] every operation lists the six common codes (TRD §5 intro); privileged permissions (template.approve, summary.approve) add auth.mfa_required;
#   required-idempotency ops add the three idempotency codes; If-Match (✓) ops add version_conflict + precondition_required; error responses derive from errors.yaml http.
# - [CONV] #14 putSmartAnalyteGroup ("✓ when the row exists"): optional If-Match header, lists only common.version_conflict. Optional-idempotency ops declare no
#   Idempotency-Key header (wave-1 convention). #18 validate and #22 preview are read-only POSTs (E3, LD-10). DELETE #8 #12 #15 deactivate → 204.
# - [CONV] TRD-open shapes: status csv filters as patterned strings; group_code fields x-coded-set smartreport.organ_groups; #22 response = SmartSummaryPreview
#   (SmartSummaryView fields, no required id/order fields, + unmapped_result_count, ignored_duplicate_count); deny term / coded set / validation report / LLM run
#   are named components; text maxima 2000 where the TRD gives none; trend direction improved|worsened|stable and BandStatus from 03-IC §4.10.
openapi: 3.0.3
info:
  title: LIMS smartreport (C14)
  version: 1.0.0
  description: Transcribed from spec/chunks/C14-smart-report/02-TRD.md §5, §5.1 (T0C-10.C14, LD-103).
paths:
  /v1/smartreport/library-versions:
    get:
      operationId: listSmartLibraryVersions
      tags:
        - smartreport
      summary: "List template library versions (TRD §5 #1)"
      security:
        - bearerJwt: []
      x-permission: smartreport.template.manage
      x-context: tenant
      x-idempotency: none
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - common.invalid_cursor
      parameters:
        - name: status
          in: query
          required: false
          description: Comma-separated library statuses.
          schema:
            type: string
            maxLength: 64
            pattern: ^(draft|in_review|approved|retired)(,(draft|in_review|approved|retired)){0,3}$
        - name: sort
          in: query
          required: false
          schema:
            type: string
            maxLength: 11
            enum:
              - -version_no
            default: -version_no
        - $ref: _common.yaml#/components/parameters/Cursor
        - $ref: _common.yaml#/components/parameters/Limit
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/LibraryVersionSummary"
                  page:
                    $ref: _common.yaml#/components/schemas/PageInfo
              examples:
                synthetic:
                  value:
                    data:
                      - id: 01940e00-0000-7000-8000-000000000001
                        version_no: 2
                        status: approved
                        language: en
                        approved_at: 2026-01-15T05:10:00.000Z
                        approved_by_membership_id: 01940e00-0000-7000-8000-a00000000015
                        approved_by_display_name: Synthetic Pathologist
                        updated_at: 2026-01-15T05:10:00.000Z
                        version: 5
                    page:
                      limit: 50
