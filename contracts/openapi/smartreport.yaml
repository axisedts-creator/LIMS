          $ref: _common.yaml#/components/responses/BadRequest
        "401":
          $ref: _common.yaml#/components/responses/Unauthorized
        "403":
          $ref: _common.yaml#/components/responses/Forbidden
        "404":
          $ref: _common.yaml#/components/responses/NotFound
        "429":
          $ref: _common.yaml#/components/responses/TooManyRequests
        "500":
          $ref: _common.yaml#/components/responses/Internal
    post:
      operationId: createSmartLibraryVersion
      tags:
        - smartreport
      summary: "Create a draft library version (starter or clone) (TRD §5 #2)"
      description: source_version_id is required iff source = clone_version (handler check, common.validation_failed pointer /source_version_id).
      security:
        - bearerJwt: []
      x-permission: smartreport.template.manage
      x-context: tenant
      x-idempotency: required
      x-rate-limit-tier: general
      x-error-codes:
        - common.validation_failed
        - common.not_found
        - auth.forbidden
        - auth.unauthenticated
        - common.rate_limited
        - common.internal
        - smartreport.library_invalid_transition
        - common.idempotency_key_required
        - common.idempotency_key_reused
        - common.idempotency_in_progress
      parameters:
        - $ref: _common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - source
              properties:
                source:
                  type: string
                  maxLength: 13
                  enum:
                    - starter
                    - clone_active
                    - clone_version
                source_version_id:
                  $ref: _common.yaml#/components/schemas/Uuid
                change_summary:
                  type: string
                  maxLength: 500
            examples:
              synthetic:
                value:
                  source: clone_version
                  source_version_id: 01940e00-0000-7000-8000-a00000000014
                  change_summary: Synthetic clone for wording update
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryVersion"
              examples:
                synthetic:
                  value:
                    id: 01940e00-0000-7000-8000-000000000002
