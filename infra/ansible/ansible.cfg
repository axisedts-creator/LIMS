# 02-TRD s1, s4. host_key_checking stays on (never set it to False);
# host keys are pinned in inventories/<env>/known_hosts.
[defaults]
inventory = inventories/dev
roles_path = roles
forks = 10

[inventory]
# known_hosts sits next to hosts.yml but is not an inventory source.
ignore_patterns = known_hosts

[ssh_connection]
pipelining = True
