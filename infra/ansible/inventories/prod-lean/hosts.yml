---
# prod inventory, `lean` profile (LD-45, LD-48) = DEFAULT for prod until a
# scale trigger fires (inventories/DECISION.md). The `full` 4-host profile of
# 02-TRD s3.1 stays in inventories/prod/.
# Site A: prod-1 runs every data-1 + app-1 + ops-1 role.
# Site B, a DIFFERENT provider: backup-1 (group `backup`) runs only pgBackRest
# repo2 (SFTP target, continuous WAL archiving), the object-storage replica,
# the audit digests / ops_audit copy, and the external blackbox check + alert
# relay. No hot standby: group `dr` is empty (LD-45).
# Addresses are documentation ranges (RFC 5737) until the VMs exist; disk
# names are placeholders until recorded (providers/generic/checklist.md).
all:
  children:
    data:
      hosts:
        prod-1:
          ansible_host: 10.77.0.11  # wg IP; Ansible over WireGuard (s4)
          public_ip: 192.0.2.111
          wg_ip: 10.77.0.11
          host_ram_gib: 32  # LD-45: 16 vCPU / 32 GB / ~640 GB NVMe
          disks:
            db: /dev/disk/by-id/REPLACE-prod-1-db
            repo1: /dev/disk/by-id/REPLACE-prod-1-repo1
            storage: /dev/disk/by-id/REPLACE-prod-1-storage
            data: /dev/disk/by-id/REPLACE-prod-1-ops-data
          # LD-45 prod-1 budget: sum(replicas * gib) <= 85 % of 32 GiB
          # (27.2 GiB); T-14 / container_hardening.py assert it on deploy.
          mem_limit_gib:
            api: {replicas: 2, gib: 1.5}
            worker: {replicas: 1, gib: 2}
            web: {replicas: 1, gib: 1}
            portal: {replicas: 1, gib: 1}
            partner: {replicas: 0, gib: 0}  # 0 until W2
            renderer: {replicas: 1, gib: 1.5}
            pdf-sandbox: {replicas: 1, gib: 0.5}
            clamd: {replicas: 1, gib: 3}
            valkey: {replicas: 1, gib: 0.3125}
            squid: {replicas: 1, gib: 0.5}
            supabase: {replicas: 1, gib: 2.75}
            edge-agents: {replicas: 1, gib: 1.1875}
            postgres-pgbouncer: {replicas: 1, gib: 6}
            prometheus: {replicas: 1, gib: 1}
            alertmanager: {replicas: 1, gib: 0.125}
            grafana: {replicas: 1, gib: 0.5}
            victorialogs: {replicas: 1, gib: 1}
    app:
      hosts:
        prod-1:
    ops:
      hosts:
        prod-1:
    dr: {}  # LD-45: no hot standby in lean
    backup:
      hosts:
        backup-1:
          ansible_host: 10.77.0.51  # wg IP
          public_ip: 198.51.100.151
          wg_ip: 10.77.0.51
          host_ram_gib: 8  # LD-45: 4 vCPU / 8 GB / >= 160 GB, growable
          disks:
            repo2: /dev/disk/by-id/REPLACE-backup-1-repo2
            replica: /dev/disk/by-id/REPLACE-backup-1-replica
