topology_profile: full  # LD-45/LD-48: 02-TRD s3.1; default = prod-lean/
wg_subnet: 10.77.0.0/24  # s12.1 [CONV]
db_primary_wg_ip: 10.77.0.11  # data-1 role; dr-promote.yml changes it
app_db_name: postgres
docker_subnets:  # s3.2 [CONV]
  edge: 172.30.10.0/24
  app: 172.30.20.0/24
  auth: 172.30.30.0/24
  render: 172.30.40.0/24
  db: 172.30.50.0/24
  egress: 172.30.60.0/24
partner_enabled: false
realtime_enabled: false
realtime_public: false
studio_enabled: false
c7_metrics_live: false
archive_timeout_s: 60
object_replica_interval_min: 15
drill_target_offset_min: 30
