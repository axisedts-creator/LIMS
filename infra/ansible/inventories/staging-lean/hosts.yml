---
# staging inventory, `lean` profile (LD-45, LD-48): ONE optional VM spun up
# before releases; runs every data + app + ops role. No standby, no backup
# host (groups dr/backup empty). The `full` 2-host profile stays in
# inventories/staging/. Synthetic data only.
# Addresses are documentation ranges (RFC 5737) until the VM exists; disk
# names are placeholders until recorded (providers/generic/checklist.md).
all:
  children:
    data:
      hosts:
        staging-1:
          ansible_host: 10.78.0.11  # wg IP; Ansible over WireGuard (s4)
          public_ip: 203.0.113.151
          wg_ip: 10.78.0.11
          disks:
            db: /dev/disk/by-id/REPLACE-staging-1-db
            repo1: /dev/disk/by-id/REPLACE-staging-1-repo1
            storage: /dev/disk/by-id/REPLACE-staging-1-storage
            data: /dev/disk/by-id/REPLACE-staging-1-ops-data
    app:
      hosts:
        staging-1:
    ops:
      hosts:
        staging-1:
    dr: {}
    backup: {}
