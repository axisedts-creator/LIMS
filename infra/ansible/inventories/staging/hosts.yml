---
# staging inventory (02-TRD s3.1, s12.1): 2 VMs, one per site.
# Site A VM = data-1 + app-1 roles; site B VM = dr-1 + ops-1 roles.
# Addresses are documentation ranges (RFC 5737) / wg subnet 10.78.0.0/24
# until the VMs exist; disk names are placeholders until recorded.
all:
  children:
    data:
      hosts:
        staging-a:
          ansible_host: 10.78.0.11  # wg IP; Ansible over WireGuard (s4)
          public_ip: 203.0.113.111
          wg_ip: 10.78.0.11
          disks:
            db: /dev/disk/by-id/REPLACE-staging-a-db
            repo1: /dev/disk/by-id/REPLACE-staging-a-repo1
            storage: /dev/disk/by-id/REPLACE-staging-a-storage
    app:
      hosts:
        staging-a:
    dr:
      hosts:
        staging-b:
          ansible_host: 10.78.0.31  # wg IP
          public_ip: 203.0.113.131
          wg_ip: 10.78.0.31
          disks:
            db: /dev/disk/by-id/REPLACE-staging-b-db
            replica: /dev/disk/by-id/REPLACE-staging-b-replica
    ops:
      hosts:
        staging-b:
