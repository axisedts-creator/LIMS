---
# 02-TRD s8.5 / 03-APP-FLOW s10 / AC-19.2 (T-27): rotate ONE secret per run.
#   ansible-playbook -i inventories/<env>/hosts.yml playbooks/rotate-secret.yml \
#       -e secret_id=lims_api_password -e secrets_render_enc_file=<lims-secrets>/<env>.enc.yaml \
#       -e rotate_probe_base=<URL base the api answers on> -e '{"rotate_compose_env": {...}}'
# Automated here: lims_api_password (role lims_api -> api-a, api-b) and lims_worker_password (role
# lims_worker -> worker-a, + worker-b only in profile `full`, LD-45). Every other id has a MANUAL
# procedure (JWT family, Storage key, pgBackRest cipher pass, WireGuard, LUKS, payments KEK, BFF keys):
# it is refused BEFORE any change with a pointer to infra/runbooks/secrets.md.
# LD-45: group names only (`localhost`, `app`, `data`); the host behind `app`/`data` comes from the
# active profile's inventory (the same host in `lean`, two hosts in `full`).
# DB password flow: ops_audit note -> synthetic load (async, 300 s) -> ALTER ROLE (SQL on stdin) ->
#   sops --set (encrypted) -> secrets_render -> rolling recreate (api-a, then api-b; one `up
#   --force-recreate --wait` each: a plain `up -d` is a no-op because only the secret file changed)
#   -> collect the load result, any failed request fails the play (AC-19.2) -> ops_audit end note.
# Any failure after the first change: rescue puts the old password back (DB, sops, render, consumers)
#   and ends with `fail` (never rc 0 after a half rotation).
# RISK [CONV]: ALTER ROLE kills the old password before the consumers hold the new one. Zero failed
#   requests then rests on already-open pooled connections (PgBouncer re-auths NEW connections with
#   auth_query). Only the live run (infra/tests/integration/test_t27_live.py) can prove it.
# The new value never reaches a log, argv of docker/psql, a debug line or an ops_audit note.

- name: Validate the request (nothing is changed here)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Environment and profile are known
      ansible.builtin.assert:
        that:
          - env in ['dev', 'staging', 'prod']
          - topology_profile in ['lean', 'full']
        fail_msg: "rotate-secret: env or topology_profile is not set by the inventory"
        quiet: true

    - name: secret_id is one plain identifier
      ansible.builtin.assert:
        that:
          - secret_id is defined
          - secret_id is string
          - secret_id | trim != ''
          - secret_id is match('^[a-z][a-z0-9_]*$')
        fail_msg: "rotate-secret: -e secret_id=<one id, a-z 0-9 _> is required (see secrets.md#rotation)"
        quiet: true

    - name: Refuse JWT family (manual, dual-key overlap)
      ansible.builtin.fail:
        msg: "{{ secret_id }} is rotated by hand: infra/runbooks/secrets.md#jwt-signing-keys"
      when: >-
        secret_id in ['JWT_SECRET', 'ANON_KEY', 'SERVICE_ROLE_KEY', 'JWT_KEYS', 'JWT_JWKS',
        'SUPABASE_PUBLISHABLE_KEY', 'SUPABASE_SECRET_KEY', 'lims_core_jwt_key']

    - name: Refuse the Storage signing key (manual, invalidates signed URLs)
      ansible.builtin.fail:
        msg: "{{ secret_id }} is rotated by hand: infra/runbooks/secrets.md#storage-signing-key"
      when: secret_id in ['core_storage_service_key']

    - name: Refuse pgBackRest cipher passes (cannot change for an existing repo)
      ansible.builtin.fail:
        msg: "{{ secret_id }} is rotated by hand: infra/runbooks/secrets.md#pgbackrest-cipher-pass"
      when: secret_id in ['pgbackrest_repo1_cipher_pass', 'pgbackrest_repo2_cipher_pass']

    - name: Refuse WireGuard keys (per host, site.yml)
      ansible.builtin.fail:
        msg: "{{ secret_id }} is rotated by hand: infra/runbooks/secrets.md#wireguard-keys"
      when: secret_id in ['wireguard_private_keys']

    - name: Refuse LUKS key files (add before remove)
      ansible.builtin.fail:
        msg: "{{ secret_id }} is rotated by hand: infra/runbooks/secrets.md#luks-keys"
      when: secret_id in ['luks_keyfiles']

    - name: Refuse the payments KEK (add, set active, rewrap, remove)
      ansible.builtin.fail:
        msg: "{{ secret_id }} is rotated by hand: infra/runbooks/secrets.md#payments-kek"
      when: secret_id in ['payments_kek']

    - name: Only the DB password ids are automated
      ansible.builtin.assert:
        that:
          - secret_id in ['lims_api_password', 'lims_worker_password']
        fail_msg: "{{ secret_id }} has no automated rotation: see infra/runbooks/secrets.md#rotation"
        quiet: true

    - name: Load the secrets schema of this env
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../secrets/schema/{{ env }}.secrets.schema.yaml"
        name: rotate_schema

    - name: The id must exist in the schema of this env
      ansible.builtin.fail:
        msg: "{{ secret_id }} is not in {{ env }}.secrets.schema.yaml"
      when: secret_id not in (rotate_schema.secrets | map(attribute='id') | list)

- name: Rotate a DB password with a rolling consumer restart (LD-45)
  hosts: app
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    rotate_ops_note: "{{ playbook_dir }}/../../ci/ops-note.sh"
    rotate_enc_file: "{{ secrets_render_enc_file | default('') }}"
    rotate_secrets_dir: /run/lims/secrets          # tmpfs written by the render role (s8.3)
    rotate_compose_dir: /srv/lims/compose/lims     # = deploy.yml layout
    rotate_compose_env: {}                         # [CONV] same dict deploy.yml passes (image digests, APP_WG_IP)
    rotate_probe_base: ""                          # URL base on which the api answers (edge origin or app_net)
    rotate_probe_ca_file: ""                       # internal CA bundle when the base is https
    rotate_role: {lims_api_password: lims_api, lims_worker_password: lims_worker}
    rotate_first_consumer: {lims_api_password: api-a, lims_worker_password: worker-a}
  tasks:
    - name: ops_audit - rotation requested
      ansible.builtin.command:
        argv: ["{{ rotate_ops_note }}", "rotate-secret start id={{ secret_id }} env={{ env }}"]
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

    - name: Inputs of the DB flow are present
      ansible.builtin.assert:
        that:
          - rotate_enc_file | length > 0
          - rotate_probe_base | length > 0
          - rotate_compose_env | length > 0
          - groups['data'] | default([]) | length > 0
        fail_msg: >-
          rotate-secret: set -e <env>.enc.yaml path (see header), -e rotate_probe_base and -e rotate_compose_env,
          and the inventory needs a host in group data
        quiet: true

    - name: Current value, read from the rendered file (rollback copy)
      ansible.builtin.slurp:
        src: "{{ rotate_secrets_dir }}/{{ rotate_first_consumer[secret_id] }}/{{ secret_id }}"
      register: rot_old_raw
      no_log: true

    - name: Keep the current value for the rescue
      ansible.builtin.set_fact:
        rot_old: "{{ rot_old_raw.content | b64decode | trim }}"
      no_log: true

    - name: Generate the new value (48 random characters, CSPRNG, controller side)
      ansible.builtin.set_fact:
        rot_val: "{{ lookup('ansible.builtin.password', '/dev/null length=48 chars=ascii_letters,digits') }}"
      no_log: true

    # AC-19.2: the load runs BEFORE the first change and for 5 min; its exit code gates the play.
    - name: Start the synthetic load in the background (300 s)
      ansible.builtin.command:
        argv: >-
          {{ ['python3', playbook_dir ~ '/../../tests/internal/rotation_load.py',
          '--url', rotate_probe_base ~ '/v1/core/health/ready',
          '--duration', '300', '--rps', '10', '--timeout', '5']
          + (['--ca-file', rotate_probe_ca_file] if rotate_probe_ca_file | length > 0 else []) }}
      async: 420
      poll: 0
      register: rot_load_job
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

    - name: Change the password and roll the consumers
      block:
        # SQL on stdin only (never argv); log_min_error_statement stops a failing ALTER from logging the value.
        - name: Set the new password on the role
          ansible.builtin.command:
            cmd: >-
              docker exec -i supabase-db sh -c
              'PGPASSWORD="$POSTGRES_PASSWORD" exec psql -X
              -U supabase_admin -d {{ app_db_name }}
              -v ON_ERROR_STOP=1'
            stdin: |
              SET log_min_error_statement = 'panic';
              SET log_min_duration_statement = -1;
              SET log_statement = 'none';
              SET password_encryption = 'scram-sha-256';
              ALTER ROLE {{ rotate_role[secret_id] }} PASSWORD '{{ rot_val }}';
          delegate_to: "{{ groups['data'][0] }}"
          run_once: true
          changed_when: true
          no_log: true

        - name: Persist the new value in the encrypted file (value is encrypted in place)
          ansible.builtin.command:
            argv: [sops, --set, '["{{ secret_id }}"] {{ rot_val | to_json }}', "{{ rotate_enc_file }}"]
          delegate_to: localhost
          become: false
          run_once: true
          changed_when: true
          no_log: true

        - name: Commit the encrypted file only
          ansible.builtin.command:
            argv:
              - git
              - -C
              - "{{ rotate_enc_file | dirname }}"
              - commit
              - -m
              - "rotate {{ secret_id }} ({{ env }})"
              - --
              - "{{ rotate_enc_file | basename }}"
          delegate_to: localhost
          become: false
          run_once: true
          changed_when: true

        - name: Render the secrets again (tmpfs files of this host)
          ansible.builtin.include_role:
            name: secrets_render

        # one consumer per command, never `restart` and never all at once
        - name: Roll api-a (recreate, wait healthy)
          ansible.builtin.command:
            cmd: >-
              docker compose -p lims -f {{ rotate_compose_dir }}/compose.app.yml
              up -d --no-deps --force-recreate --wait --wait-timeout 300 api-a
          environment: "{{ rotate_compose_env }}"
          changed_when: true
          when: secret_id == 'lims_api_password'

        - name: Roll api-b (recreate, wait healthy)
          ansible.builtin.command:
            cmd: >-
              docker compose -p lims -f {{ rotate_compose_dir }}/compose.app.yml
              up -d --no-deps --force-recreate --wait --wait-timeout 300 api-b
          environment: "{{ rotate_compose_env }}"
          changed_when: true
          when: secret_id == 'lims_api_password'

        - name: Roll worker-a (recreate, wait healthy)
          ansible.builtin.command:
            cmd: >-
              docker compose -p lims -f {{ rotate_compose_dir }}/compose.app.yml
              up -d --no-deps --force-recreate --wait --wait-timeout 300 worker-a
          environment: "{{ rotate_compose_env }}"
          changed_when: true
          when: secret_id == 'lims_worker_password'

        - name: Roll worker-b (full profile only, LD-45)
          ansible.builtin.command:
            cmd: >-
              docker compose -p lims -f {{ rotate_compose_dir }}/compose.app.yml
              up -d --no-deps --force-recreate --wait --wait-timeout 300 worker-b
          environment: "{{ rotate_compose_env }}"
          changed_when: true
          when:
            - secret_id == 'lims_worker_password'
            - topology_profile == 'full'

        - name: Collect the synthetic load result (zero failed requests)
          ansible.builtin.async_status:
            jid: "{{ rot_load_job.ansible_job_id }}"
          register: rot_load_res
          until: rot_load_res.finished | bool
          retries: 60
          delay: 10
          delegate_to: localhost
          become: false
          run_once: true
          failed_when: rot_load_res.finished | bool and (rot_load_res.rc | default(1)) != 0

        - name: ops_audit - rotation done, load result
          ansible.builtin.command:
            argv:
              - "{{ rotate_ops_note }}"
              - "rotate-secret done id={{ secret_id }} env={{ env }} load={{ rot_load_res.stdout | default('') | trim }}"
          delegate_to: localhost
          become: false
          run_once: true
          changed_when: false

      rescue:
        - name: ops_audit - rotation failed, going back to the old value
          ansible.builtin.command:
            argv: ["{{ rotate_ops_note }}", "rotate-secret FAILED id={{ secret_id }} env={{ env }}: restoring the old value"]
          delegate_to: localhost
          become: false
          run_once: true
          changed_when: false
          failed_when: false

        - name: Rescue - old password back on the role
          ansible.builtin.command:
            cmd: >-
              docker exec -i supabase-db sh -c
              'PGPASSWORD="$POSTGRES_PASSWORD" exec psql -X
              -U supabase_admin -d {{ app_db_name }}
              -v ON_ERROR_STOP=1'
            stdin: |
              SET log_min_error_statement = 'panic';
              SET log_min_duration_statement = -1;
              SET log_statement = 'none';
              SET password_encryption = 'scram-sha-256';
              ALTER ROLE {{ rotate_role[secret_id] }} PASSWORD '{{ rot_old }}';
          delegate_to: "{{ groups['data'][0] }}"
          run_once: true
          register: rot_restore
          failed_when: false
          no_log: true

        - name: Rescue - old value back in the encrypted file
          ansible.builtin.command:
            argv: [sops, --set, '["{{ secret_id }}"] {{ rot_old | to_json }}', "{{ rotate_enc_file }}"]
          delegate_to: localhost
          become: false
          run_once: true
          failed_when: false
          no_log: true

        - name: Rescue - commit the restored encrypted file
          ansible.builtin.command:
            argv:
              - git
              - -C
              - "{{ rotate_enc_file | dirname }}"
              - commit
              - -m
              - "rotate {{ secret_id }} ({{ env }}) rolled back"
              - --
              - "{{ rotate_enc_file | basename }}"
          delegate_to: localhost
          become: false
          run_once: true
          failed_when: false

        - name: Rescue - render the secrets again
          ansible.builtin.include_role:
            name: secrets_render
            # apply: role tasks inherit ignore_errors, so a failed re-render
            # still reaches the recreate + ops_audit note below (review T-27 #2)
            apply:
              ignore_errors: true
          ignore_errors: true

        - name: Rescue - recreate api-a
          ansible.builtin.command:
            cmd: >-
              docker compose -p lims -f {{ rotate_compose_dir }}/compose.app.yml
              up -d --no-deps --force-recreate --wait --wait-timeout 300 api-a
          environment: "{{ rotate_compose_env }}"
          failed_when: false
          when: secret_id == 'lims_api_password'

        - name: Rescue - recreate api-b
          ansible.builtin.command:
            cmd: >-
              docker compose -p lims -f {{ rotate_compose_dir }}/compose.app.yml
              up -d --no-deps --force-recreate --wait --wait-timeout 300 api-b
          environment: "{{ rotate_compose_env }}"
          failed_when: false
          when: secret_id == 'lims_api_password'

        - name: Rescue - recreate worker-a
          ansible.builtin.command:
            cmd: >-
              docker compose -p lims -f {{ rotate_compose_dir }}/compose.app.yml
              up -d --no-deps --force-recreate --wait --wait-timeout 300 worker-a
          environment: "{{ rotate_compose_env }}"
          failed_when: false
          when: secret_id == 'lims_worker_password'

        - name: Rescue - recreate worker-b (full profile only)
          ansible.builtin.command:
            cmd: >-
              docker compose -p lims -f {{ rotate_compose_dir }}/compose.app.yml
              up -d --no-deps --force-recreate --wait --wait-timeout 300 worker-b
          environment: "{{ rotate_compose_env }}"
          failed_when: false
          when:
            - secret_id == 'lims_worker_password'
            - topology_profile == 'full'

        - name: ops_audit - rotation rolled back
          ansible.builtin.command:
            argv:
              - "{{ rotate_ops_note }}"
              - >-
                rotate-secret ROLLED BACK id={{ secret_id }} env={{ env }}:
                {{ 'old value restored' if (rot_restore.rc | default(1)) == 0 else 'RESTORE FAILED, fix by hand' }}
          delegate_to: localhost
          become: false
          run_once: true
          changed_when: false
          failed_when: false

        - name: Rescue - fail the play (a failed rotation never exits 0)
          ansible.builtin.fail:
            msg: >-
              rotate-secret {{ secret_id }} failed and was rolled back
              ({{ 'old value restored' if (rot_restore.rc | default(1)) == 0 else 'RESTORE FAILED: follow infra/runbooks/secrets.md#db-passwords by hand' }})
