---
# 02-TRD s6: render nginx.conf + snippets + sites into a staging directory,
# validate the whole tree with `nginx -t` in a throw-away container of the
# pinned image, and only then install it and reload the edge (handler).
- name: Preconditions (origins from the inventory; no files origin)
  ansible.builtin.assert:
    that:
      - origins is defined
      - origins.staff_web | default('') | length > 0
      - origins.portal | default('') | length > 0
      - origins.api | default('') | length > 0
      - >-
        not (partner_enabled | bool)
        or (origins.partner | default('') | length > 0)
      - "'files' not in origins"   # 08 A14.2: there is no files origin
    fail_msg: >-
      edge_nginx: inventory var origins.{staff_web,portal,api[,partner]}
      missing, or a files origin is set

# The allowlist is loaded from infra/edge/public-routes.yaml (generated by
# infra/ci/gen-routes.sh), never retyped.
- name: Path allowlist from public-routes.yaml
  ansible.builtin.set_fact:
    public_routes: >-
      {{ (lookup('ansible.builtin.file',
      edge_nginx_src ~ '/public-routes.yaml') | from_yaml).routes }}

# Route paths land in nginx `location` lines: reject anything but a plain path.
- name: Route paths are plain /v1/ paths with exact|prefix match
  ansible.builtin.assert:
    that:
      - item.path is match('^/v1/[A-Za-z0-9/_.-]+$')
      - item.match in ['exact', 'prefix']
    fail_msg: "edge_nginx: unsafe route in public-routes.yaml"
  loop: "{{ public_routes }}"
  loop_control:
    label: "{{ item.path | default('?') }}"

- name: Edge directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ edge_nginx_dir }}", mode: "0755"}
    - {path: "{{ edge_nginx_stage }}", mode: "0755"}
    - {path: "{{ edge_nginx_stage }}/snippets", mode: "0755"}
    - {path: "{{ edge_nginx_stage }}/conf.d", mode: "0755"}
    - {path: "{{ edge_nginx_certs }}", mode: "0700"}
    - {path: "{{ edge_nginx_webroot }}", mode: "0755"}

- name: Per-origin certificate directories (keys stay on this host)
  ansible.builtin.file:
    path: "{{ edge_nginx_certs }}/{{ origins[item] }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ edge_nginx_tls_origins }}"

# First run only: nginx needs a certificate to start before ACME can answer
# HTTP-01. Throw-away 1-day ECDSA P-256 cert; roles/acme replaces it.
- name: Bootstrap placeholder certificate where none exists yet
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - ec
      - -pkeyopt
      - ec_paramgen_curve:P-256
      - -nodes
      - -days
      - "1"
      - -subj
      - "/CN={{ origins[item] }}"
      - -keyout
      - "{{ edge_nginx_certs }}/{{ origins[item] }}/privkey.pem"
      - -out
      - "{{ edge_nginx_certs }}/{{ origins[item] }}/fullchain.pem"
    creates: "{{ edge_nginx_certs }}/{{ origins[item] }}/fullchain.pem"
  loop: "{{ edge_nginx_tls_origins }}"

- name: Private key mode
  ansible.builtin.file:
    path: "{{ edge_nginx_certs }}/{{ origins[item] }}/privkey.pem"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ edge_nginx_tls_origins }}"

- name: nginx.conf and snippets (plain files)
  ansible.builtin.copy:
    src: "{{ edge_nginx_src }}/nginx/{{ item }}"
    dest: "{{ edge_nginx_stage }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ['nginx.conf'] + snippets }}"
  vars:
    snippets: >-
      {{ query('ansible.builtin.fileglob',
      edge_nginx_src ~ '/nginx/snippets/*.conf') | map('basename')
      | map('regex_replace', '^', 'snippets/') | list }}

- name: Sites (partner renders empty unless partner_enabled)
  ansible.builtin.template:
    src: "{{ edge_nginx_src }}/nginx/sites/{{ item }}.conf.j2"
    dest: "{{ edge_nginx_stage }}/conf.d/{{ item }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ edge_nginx_sites }}"

- name: nginx -t on the staged tree (pinned image, upstream names stubbed)
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'run', '--rm', '--network', 'none',
      '-v', edge_nginx_stage ~ ':/etc/nginx:ro',
      '-v', edge_nginx_certs ~ ':/etc/nginx/certs:ro',
      '-v', edge_nginx_webroot ~ ':/var/www/acme:ro']
      + (edge_nginx_upstreams
      | map('regex_replace', '^(.*)$', '--add-host=\\1:127.0.0.1') | list)
      + [edge_nginx_image, 'nginx', '-t'] }}
  changed_when: false

- name: Install the validated tree
  ansible.builtin.copy:
    src: "{{ edge_nginx_stage }}/"
    dest: "{{ edge_nginx_dir }}/"
    remote_src: true
    owner: root
    group: root
    mode: preserve
  notify: Reload edge nginx

- name: Reload now (roles/acme needs the :80 webroot server live)
  ansible.builtin.meta: flush_handlers
