external_scan_tests_dir: /usr/local/lib/lims/tests
external_scan_ci_dir: /usr/local/lib/lims/ci
external_scan_inventory_dir: /etc/lims/scan-inventory
external_scan_tests_src: "{{ playbook_dir }}/../../tests"
external_scan_ops_note_src: "{{ playbook_dir }}/../../ci/ops-note.sh"
