---
- name: Reload prometheus
  ansible.builtin.command: >-
    docker compose -f /srv/lims/monitoring/compose.yml
    kill -s HUP prometheus
  changed_when: true

- name: Reload alertmanager
  ansible.builtin.command: >-
    docker compose -f /srv/lims/monitoring/compose.yml
    kill -s HUP alertmanager
  changed_when: true

- name: Restart ops stack
  ansible.builtin.command: >-
    docker compose -f /srv/lims/monitoring/compose.yml restart
  changed_when: true
