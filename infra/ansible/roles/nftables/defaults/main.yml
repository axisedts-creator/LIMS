---
# 02-TRD s5.5. Fixed container IPs from s3.2 / s15 [CONV].
nftables_nginx_edge_ip: 172.30.10.10
nftables_auth_ip: 172.30.50.20
nftables_pdf_sandbox_ip: 172.30.40.11
# worker-a/b addresses on render_net = their fixed ipv4_address in
# compose/lims/compose.app.yml (T-14 [CONV]); keep both in step. Rule 6
# ("sandbox only from the workers") needs br_netfilter (s3.2).
nftables_render_worker_ips: [172.30.40.21, 172.30.40.22]
# Interface that holds public_ip (from facts; no provider value here).
nftables_public_iface: "{{ ansible_default_ipv4.interface }}"
