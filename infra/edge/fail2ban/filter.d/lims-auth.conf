# lims-auth (02-TRD s6.8, 08 Addendum A3.2): nginx limit_req rejections in the login zone only.
# Matches the lims_json line (infra/edge/nginx/snippets/logformat.conf): status 429 AND limit_req_status REJECTED
# AND route is a login-zone route (s6.5). Status 401 and app-generated 429s (limit_req_status PASSED) never match.
# Every field before "route" is written by nginx, so remote_addr cannot be forged; client text (host, method, route)
# is JSON-escaped and matched as (?:[^"\\]|\\.)* (linear, cannot close its own string).
[Definition]
datepattern = "ts":"%%Y-%%m-%%dT%%H:%%M:%%S%%z
failregex = "edge_request_id":"[0-9a-f]+","remote_addr":"<HOST>","host":"(?:[^"\\]|\\.)*","method":"(?:[^"\\]|\\.)*","route":"(?:/auth/(?:login|mfa|mfa/enrol|forgot|confirm|set-password)|/v1/identity/mobile/sessions(?:[^"\\]|\\.)*)","status":"429","bytes":"[^"]*","req_time":"[^"]*","upstream_time":"[^"]*","upstream_status":"[^"]*","ua_class":"[^"]*","limit_req_status":"REJECTED"\}
ignoreregex =
