# lims-ratelimit (02-TRD s6.8, 08 A27.2): nginx limit_req rejections everywhere EXCEPT the login, agent, otp and
# psession zones (psession = patient/session/resolve + logout, edge/public-routes.yaml; those carry shared-NAT traffic handled by the app tiers; login belongs to lims-auth only).
# Same line shape and safety notes as lims-auth.conf. 401, 404 and app-generated 429s never match.
[Definition]
datepattern = "ts":"%%Y-%%m-%%dT%%H:%%M:%%S%%z
failregex = "edge_request_id":"[0-9a-f]+","remote_addr":"<HOST>","host":"(?:[^"\\]|\\.)*","method":"(?:[^"\\]|\\.)*","route":"(?!(?:/auth/(?:login|mfa|mfa/enrol|forgot|confirm|set-password)"|/v1/identity/mobile/sessions|/v1/instruments/agent/|/v1/engagement/auth/otp-challenges|/v1/identity/auth/patient/session/(?:resolve|logout)"))(?:[^"\\]|\\.)*","status":"429","bytes":"[^"]*","req_time":"[^"]*","upstream_time":"[^"]*","upstream_status":"[^"]*","ua_class":"[^"]*","limit_req_status":"REJECTED"\}
ignoreregex =
