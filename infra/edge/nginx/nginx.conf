# Public edge nginx (02-TRD s6). Plain nginx; the per-origin servers are the
# rendered sites/*.conf.j2 in /etc/nginx/conf.d (roles/edge_nginx). LD-45: no
# host name or address here - they come from the active inventory profile.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    default_type application/octet-stream;
    server_tokens off;                       # AC-03.3
    proxy_hide_header X-Powered-By;          # 02-TRD s6.4 (inherited: no lower level sets proxy_hide_header)
    sendfile on;

    # 02-TRD s6.6 timeouts [CONV]; staff_web overrides proxy_read_timeout (SSE).
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    proxy_read_timeout 60s;
    client_max_body_size 1m;                 # api origin default; BFF servers set their own

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/limits.conf;
    include /etc/nginx/snippets/logformat.conf;

    # Unknown Host / SNI: no certificate is offered and nothing is proxied.
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }
    server {
        listen 80 default_server;
        return 444;
    }

    include /etc/nginx/conf.d/*.conf;
}
