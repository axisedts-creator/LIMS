# 02-TRD s6.5 429 handling. Included at server level. Each r/m-zone location
# sets $retry_after 60 (server default 1); the named location re-includes
# headers.conf because its own add_header replaces the inherited set (AC-03.1).
error_page 429 = @ratelimited;
location @ratelimited {
    default_type application/problem+json;
    include /etc/nginx/snippets/headers.conf;
    add_header Retry-After $retry_after always;
    return 429 '{"type":"urn:lims:error:common.rate_limited","title":"Too many requests","status":429,"code":"common.rate_limited"}';
}
