# 02-TRD s6.5. Every zone is keyed by client IP; no per-device or per-token key
# at the edge (08 A13 D-43). Included once at http level.
# login: only POSTs count, plus GET /auth/confirm (C2 confirmEmailToken); empty key = not accounted.
map "$request_method:$uri" $login_key {
    ~^POST:              $binary_remote_addr;
    "GET:/auth/confirm"  $binary_remote_addr;
    default              "";
}
limit_req_zone $login_key          zone=login:10m    rate=60r/m;   # 08 Addendum A1
limit_req_zone $binary_remote_addr zone=otp:10m      rate=60r/m;   # 08 A19 D-122
limit_req_zone $binary_remote_addr zone=psession:10m rate=120r/m;  # 08 R6 (CR-C16-018 modified)
limit_req_zone $binary_remote_addr zone=qrverify:10m rate=10r/m;   # 04 s4; portal /v/ only (08 A13 D-32)
limit_req_zone $binary_remote_addr zone=agent:10m    rate=600r/m;  # 08 A13 D-43
limit_req_zone $binary_remote_addr zone=callback:10m rate=60r/m;   # CR-C6-013 [CONV 60 r/m]
limit_req_zone $binary_remote_addr zone=payments:10m rate=10r/s;   # CR-C15-008 item 2 / 08 A19 D-116
limit_req_zone $binary_remote_addr zone=perip:20m    rate=100r/s;  # [CONV] coarse per-IP safety net
limit_conn_zone $binary_remote_addr zone=connip:10m;
limit_req_status 429;
limit_conn_status 429;
