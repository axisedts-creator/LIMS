# 02-TRD s6.7, AC-18.4. JSON lines; $args / $request_uri are never logged.
# route = template for token-bearing paths (IC s7; CR-C2-012, CR-C6-013, CR-C15-008).
# Values are strings (escape=json); consumers (fail2ban T-25) match "status":"429".
map $uri $route {
    "/auth/confirm"                                            "/auth/confirm";
    ~^/r/[^/]+                                                 "/r/{token}";
    ~^/v/[^/]+                                                 "/v/{token}";
    ~^/v1/reporting/provider-callbacks/[^/]+                   "/v1/reporting/provider-callbacks/{token}";
    ~^/v1/payments/launch/[^/]+$                               "/v1/payments/launch/:token";
    ~^/v1/payments/callbacks/esewa/[^/]+/(success|failure)$    "/v1/payments/callbacks/esewa/:token/$1";
    ~^/v1/payments/callbacks/khalti/[^/]+$                     "/v1/payments/callbacks/khalti/:token";
    ~^/v1/payments/callbacks/                                  "/v1/payments/callbacks/{unmatched}";
    default                                                    $uri;
}
# User agent reduced to a class [CONV]; the raw string is never stored.
map $http_user_agent $ua_class {
    default                                    other;
    ~*bridge-agent                             bridge-agent;
    ~*(bot|crawl|spider|curl|wget|python)      bot;
    ~*(mozilla|safari|chrome|firefox)          browser;
}
log_format lims_json escape=json '{"ts":"$time_iso8601","edge_request_id":"$request_id","remote_addr":"$remote_addr","host":"$host","method":"$request_method","route":"$route","status":"$status","bytes":"$body_bytes_sent","req_time":"$request_time","upstream_time":"$upstream_response_time","upstream_status":"$upstream_status","ua_class":"$ua_class","limit_req_status":"$limit_req_status"}';
access_log /var/log/nginx/access.json lims_json;
