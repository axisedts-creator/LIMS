# 02-TRD s6.6. Included at server level; no location sets proxy_set_header.
# X-Forwarded-For is overwritten: single trusted hop (C0 LIMS_CORE_TRUSTED_PROXY_HOPS=1).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Edge-Request-Id $request_id;
# Inbound internal headers are cleared (empty value = not sent upstream).
proxy_set_header X-Request-Id "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Lims-Bff-Key "";
# X-Lims-Background passes through on the BFF origins (08 A25 D-206);
# api.conf.j2 clears it on the api origin.
proxy_connect_timeout 5s;
