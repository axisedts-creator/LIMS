# 02-TRD s6.3 / AC-06.1, AC-03.2: reserved API/Supabase prefixes on the app
# origins (staff_web, portal, partner) are 404 from nginx and never proxied.
# `^~` so no regex location can take them over.
location ^~ /v1/          { return 404; }
location ^~ /rest/v1/     { return 404; }
location ^~ /graphql/v1   { return 404; }
location ^~ /functions/v1/ { return 404; }
location ^~ /auth/v1/     { return 404; }
location ^~ /storage/v1/  { return 404; }
location ^~ /realtime/v1/ { return 404; }
location ^~ /pg/          { return 404; }
location ^~ /api/mcp      { return 404; }
location ^~ /mcp          { return 404; }
