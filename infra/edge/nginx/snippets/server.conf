# Common to every public HTTPS server (02-TRD s6.2-6.6). HTTP/2 on, HTTP/3 off [CONV].
listen 443 ssl;
http2 on;
include /etc/nginx/snippets/headers.conf;
include /etc/nginx/snippets/proxy.conf;
include /etc/nginx/snippets/errors.conf;
set $retry_after 1;                          # r/m-zone locations override with 60
limit_req zone=perip burst=200 nodelay;      # [CONV] every server
limit_conn connip 200;
