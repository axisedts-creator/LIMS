# Fluent Bit parsers (02-TRD s10.1). Plain classic format.
[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   Off

# nginx access.json: log_format lims_json (infra/edge/nginx/snippets/logformat.conf), Time_Key ts.
[PARSER]
    Name        nginx_json
    Format      json
    Time_Key    ts
    Time_Format %Y-%m-%dT%H:%M:%S%z
    Time_Keep   Off

# JSON application log lines inside the docker `log` field (parser filter, Reserve_Data On).
[PARSER]
    Name        app_json
    Format      json

# ops_audit: MESSAGE of the journald line written by infra/ci/ops-note.sh.
[PARSER]
    Name        ops_audit_json
    Format      json
