---
# yamllint disable rule:line-length
# Imported from C4
#   services/worker/src/jobs/frontdesk/alerts/*.yaml
# (C4 02-TRD "Alert rules for C1").
# expr/for verbatim; C1 adds only severity, team, runbook_url (s11.3).
# The source file is not in this lane yet: transcribed from the TRD
# table; ci/import-rules.sh overwrites it, alert-import-drift checks.
groups:
  - name: frontdesk
    rules:
      - alert: FrontdeskTrfQuarantineBurst
        expr: >-
          increase(lims_frontdesk_trf_scans_total{outcome="quarantined"}[1h])
          > 3
        for: 0m
        labels:
          severity: warn
          team: ops
        annotations:
          summary: >-
            More than 3 TRF scans quarantined in the last hour.
          runbook_url: >-
            infra/runbooks/frontdesk.md#frontdesktrfquarantineburst
