---
# yamllint disable rule:line-length
# GENERATED by infra/ci/import-rules.sh from services/worker/src/jobs/instruments/alerts/instruments.rules.yml - do not edit;
# change the source (owner chunk) and re-run. alert-import-drift checks this file.
groups:
  - name: instruments
    rules:
      - alert: InstrumentsAgentUpdateFailed
        expr: >-
          increase(lims_instruments_agent_update_failures_total[15m]) > 0
        for: 0m
        labels:
          severity: page
          route: oncall-email
          team: ops
        annotations:
          summary: InstrumentsAgentUpdateFailed is firing
          runbook_url: >-
            infra/runbooks/instruments.md#instrumentsagentupdatefailed
      - alert: InstrumentsAgentConfigRejected
        expr: >-
          increase(lims_instruments_agent_config_rejections_total[15m]) >
          0
        for: 0m
        labels:
          severity: page
          route: oncall-email
          team: ops
        annotations:
          summary: >-
            Bridge agent rejected a signed configuration (possible tampering)
          runbook_url: >-
            infra/runbooks/instruments.md#instrumentsagentconfigrejected
      - alert: InstrumentsDeviceAuthFailureSpike
        expr: >-
          sum(rate(lims_instruments_device_auth_failures_total[5m])) > 0.1
        for: 5m
        labels:
          severity: page
          route: oncall-email
          team: ops
        annotations:
          summary: >-
            InstrumentsDeviceAuthFailureSpike is firing
          runbook_url: >-
            infra/runbooks/instruments.md#instrumentsdeviceauthfailurespike
      - alert: InstrumentsQuarantineRate
        expr: >-
          sum(rate(lims_instruments_ingest_messages_total{outcome="quarantined"}[1h]))
          / sum(rate(lims_instruments_ingest_messages_total[1h])) > 0.05
        for: 1h
        labels:
          severity: warn
          route: ops-digest-email
          team: ops
        annotations:
          summary: InstrumentsQuarantineRate is firing
          runbook_url: >-
            infra/runbooks/instruments.md#instrumentsquarantinerate
      - alert: InstrumentsAttachmentQuarantined
        expr: >-
          increase(lims_instruments_attachment_scans_total{outcome="quarantined"}[15m])
          > 0
        for: 0m
        labels:
          severity: page
          route: oncall-email
          team: ops
        annotations:
          summary: >-
            InstrumentsAttachmentQuarantined is firing
          runbook_url: >-
            infra/runbooks/instruments.md#instrumentsattachmentquarantined
      - alert: InstrumentsIngestSlow
        expr: >-
          histogram_quantile(0.95, sum by (le) (rate(lims_instruments_ingest_batch_duration_seconds_bucket[15m])))
          > 3
        for: 15m
        labels:
          severity: warn
          route: ops-digest-email
          team: ops
        annotations:
          summary: InstrumentsIngestSlow is firing
          runbook_url: >-
            infra/runbooks/instruments.md#instrumentsingestslow
