---
# Imported from C7 services/worker/src/jobs/instruments/alerts/
# instruments.rules.yml (C7 02-TRD s13 "Alert rules for C1", CR-C7-012).
# expr/for verbatim; C1 adds only severity, team, runbook_url (s11.3).
# The C7 source file is not in this lane yet: transcribed from the C7 TRD
# table; ci/import-rules.sh (T-21) overwrites it, alert-import-drift checks.
# Deployed only while c7_metrics_live=true.
groups:
  - name: instruments-c7
    rules:
      - alert: InstrumentsAgentUpdateFailed
        expr: increase(lims_instruments_agent_update_failures_total[15m]) > 0
        for: 0m
        labels:
          severity: page
          team: ops
        annotations:
          summary: A bridge agent update failed in the last 15 min.
          runbook_url: >-
            infra/runbooks/instruments.md#instrumentsagentupdatefailed
      - alert: InstrumentsAgentConfigRejected
        expr: >-
          increase(lims_instruments_agent_config_rejections_total[15m]) > 0
        for: 0m
        labels:
          severity: page
          team: ops
        annotations:
          summary: >-
            Bridge agent rejected a signed configuration (possible
            tampering)
          runbook_url: >-
            infra/runbooks/instruments.md#instrumentsagentconfigrejected
      - alert: InstrumentsDeviceAuthFailureSpike
        expr: sum(rate(lims_instruments_device_auth_failures_total[5m])) > 0.1
        for: 5m
        labels:
          severity: page
          team: ops
        annotations:
          summary: Device auth failures above 0.1/s for 5 min (security).
          runbook_url: >-
            infra/runbooks/instruments.md#instrumentsdeviceauthfailurespike
      - alert: InstrumentsQuarantineRate
        expr: >-
          sum(rate(lims_instruments_ingest_messages_total{outcome="quarantined"}[1h]))
          / sum(rate(lims_instruments_ingest_messages_total[1h])) > 0.05
        for: 1h
        labels:
          severity: warn
          team: ops
        annotations:
          summary: More than 5 % of ingested instrument messages quarantined.
          runbook_url: >-
            infra/runbooks/instruments.md#instrumentsquarantinerate
      - alert: InstrumentsAttachmentQuarantined
        expr: >-
          increase(lims_instruments_attachment_scans_total{outcome="quarantined"}[15m])
          > 0
        for: 0m
        labels:
          severity: page
          team: ops
        annotations:
          summary: An instrument attachment was quarantined (security).
          runbook_url: >-
            infra/runbooks/instruments.md#instrumentsattachmentquarantined
      - alert: InstrumentsIngestSlow
        expr: >-
          histogram_quantile(0.95, sum by (le)
          (rate(lims_instruments_ingest_batch_duration_seconds_bucket[15m])))
          > 3
        for: 15m
        labels:
          severity: warn
          team: ops
        annotations:
          summary: Instrument ingest batch p95 above 3 s for 15 min.
          runbook_url: >-
            infra/runbooks/instruments.md#instrumentsingestslow
