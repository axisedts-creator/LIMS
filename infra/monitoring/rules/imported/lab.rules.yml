---
# yamllint disable rule:line-length
# Imported from C5
#   services/worker/src/jobs/lab/ops/lab.rules.yml
# (C5 02-TRD "Alert rules for C1").
# expr/for verbatim; C1 adds only severity, team, runbook_url (s11.3).
# The source file is not in this lane yet: transcribed from the TRD
# table; ci/import-rules.sh overwrites it, alert-import-drift checks.
groups:
  - name: lab
    rules:
      - alert: LabCriticalValueUnnotified
        expr: >-
          max by (tenant_id) (lims_lab_critical_unnotified_oldest_age_seconds)
          > 1800
        for: 1m
        labels:
          severity: page
          team: ops
        annotations:
          summary: >-
            A critical value has been unnotified for more than 30 min.
          runbook_url: >-
            infra/runbooks/lab.md#labcriticalvalueunnotified
      - alert: LabIngestExceptionStale
        expr: >-
          max by (tenant_id, reason) (lims_lab_ingest_exception_oldest_open_age_seconds)
          > 86400
        for: 5m
        labels:
          severity: warn
          team: ops
        annotations:
          summary: >-
            An instrument ingest exception has been open for over 24 h.
          runbook_url: >-
            infra/runbooks/lab.md#labingestexceptionstale
      - alert: LabConsumerDeadLetter
        expr: >-
          increase(lims_core_dead_letters_total{task=~"(evt\\.)?lab\\..*"}[5m])
          > 0
        for: 0m
        labels:
          severity: page
          team: ops
        annotations:
          summary: >-
            A lab job or event consumer dead-lettered.
          runbook_url: >-
            infra/runbooks/lab.md#labconsumerdeadletter
      - alert: LabHostQuerySlow
        expr: >-
          histogram_quantile(0.95, sum by (le) (rate(lims_lab_host_query_duration_seconds_bucket[5m])))
          > 0.3
        for: 15m
        labels:
          severity: warn
          team: ops
        annotations:
          summary: >-
            Instrument host query p95 above 300 ms for 15 min.
          runbook_url: infra/runbooks/lab.md#labhostqueryslow
      - alert: LabBarcodeAllocationFailure
        expr: >-
          increase(lims_lab_barcode_alloc_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: page
          team: ops
        annotations:
          summary: >-
            Barcode allocation failed in the last 5 min.
          runbook_url: >-
            infra/runbooks/lab.md#labbarcodeallocationfailure
