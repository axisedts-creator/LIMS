---
# yamllint disable rule:line-length
# Transcribed by C1 (02-TRD s11.3 intake row) from:
#   None
# Thresholds verbatim from the owner's list;
# alert names and unstated `for` are [CONV].
groups:
  - name: payments
    rules:
      - alert: PaymentsAmountMismatch
        expr: >-
          sum(increase(lims_payments_intents_held_total{reason="amount_mismatch"}[15m]))
          > 0 or sum(increase(lims_payments_reconciliation_findings_total{kind="amount_mismatch"}[15m]))
          > 0
        for: 0m
        labels:
          severity: page
          team: ops
        annotations:
          summary: >-
            A payment was held or reconciled with an amount mismatch.
          runbook_url: >-
            infra/runbooks/payments.md#paymentsamountmismatch
      - alert: PaymentsCriticalFinding
        expr: >-
          sum by (kind) (increase(lims_payments_reconciliation_findings_total{kind=~"ledger_entry_missing|late_payment_found|gateway_refund_unrecorded|status_divergence"}[15m]))
          > 0 or sum(increase(lims_payments_intents_held_total{reason="late_payment_found"}[15m]))
          > 0
        for: 0m
        labels:
          severity: page
          team: ops
        annotations:
          summary: >-
            Reconciliation found a critical payments finding.
          runbook_url: >-
            infra/runbooks/payments.md#paymentscriticalfinding
      - alert: PaymentsReconciliationMissing
        expr: >-
          time() - max by (tenant_id) (lims_payments_reconciliation_last_success_timestamp_seconds)
          > 93600
        for: 0m
        labels:
          severity: page
          team: ops
        annotations:
          summary: >-
            Payments reconciliation has not succeeded for a tenant in 26 h.
          runbook_url: >-
            infra/runbooks/payments.md#paymentsreconciliationmissing
      - alert: PaymentsReconciliationStalled
        expr: >-
          max by (tenant_id) (lims_payments_reconciliation_stalled_runs) >
          0
        for: 0m
        labels:
          severity: warn
          team: ops
        annotations:
          summary: >-
            A payments reconciliation run is stalled.
          runbook_url: >-
            infra/runbooks/payments.md#paymentsreconciliationstalled
      - alert: PaymentsHeldForReviewStale
        expr: >-
          max by (tenant_id, kind) (lims_payments_held_for_review_oldest_age_seconds)
          > 86400
        for: 0m
        labels:
          severity: warn
          team: finance
        annotations:
          summary: >-
            A payment held for review is older than 24 h.
          runbook_url: >-
            infra/runbooks/payments.md#paymentsheldforreviewstale
      - alert: PaymentsCallbackSignatureInvalid
        expr: >-
          sum by (gateway) (increase(lims_payments_callbacks_total{outcome="payments.signature_invalid"}[15m]))
          > 0
        for: 0m
        labels:
          severity: warn
          team: ops
        annotations:
          summary: >-
            A gateway callback failed signature verification.
          runbook_url: >-
            infra/runbooks/payments.md#paymentscallbacksignatureinvalid
      - alert: PaymentsGatewayErrorRatio
        expr: >-
          sum by (gateway) (rate(lims_payments_gateway_requests_total{outcome=~"service_unavailable|timeout|network_error|http_error|invalid_response|auth_error"}[10m]))
          / sum by (gateway) (rate(lims_payments_gateway_requests_total[10m]))
          > 0.2
        for: 10m
        labels:
          severity: warn
          team: ops
        annotations:
          summary: >-
            More than 20 % of calls to one gateway failing for 10 min.
          runbook_url: >-
            infra/runbooks/payments.md#paymentsgatewayerrorratio
      - alert: PaymentsCredentialRejected
        expr: >-
          sum by (gateway) (increase(lims_payments_gateway_requests_total{outcome="auth_error"}[15m]))
          > 0
        for: 0m
        labels:
          severity: warn
          team: ops
        annotations:
          summary: >-
            A gateway rejected the tenant's credentials (auth_error).
          runbook_url: >-
            infra/runbooks/payments.md#paymentscredentialrejected
      - alert: PaymentsOpenIntentsPastDeadline
        expr: >-
          max by (gateway) (lims_payments_open_intents_past_deadline) > 0
        for: 30m
        labels:
          severity: warn
          team: ops
        annotations:
          summary: >-
            Open payment intents past deadline + 30 min.
          runbook_url: >-
            infra/runbooks/payments.md#paymentsopenintentspastdeadline
