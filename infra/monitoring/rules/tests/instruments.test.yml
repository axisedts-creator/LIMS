# T-20 (C1): promtool unit tests for 02-TRD s11.2 item 3 (BridgeAgent*) and the six C7 rules (s11.3).
# Synthetic series only. Samples are 1 min apart, so every eval_time sits on a sample; an alert whose
# expression is true from the first sample is pending at t=0 and fires once `for` has elapsed.
# The two exporting replicas (worker-a, worker-b) are told apart by the `service` label; the
# rules aggregate it away with `max by (tenant_id, centre_id, agent_id)`, so one agent = one alert.
rule_files:
  - ../instruments.rules.yml
  - ../imported/instruments.rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    name: agent offline single exporter - Offline at 15m, OfflineLong at 60m
    input_series:
      - series: 'lims_instruments_agent_state{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01",state="offline"}'
        values: "1x70"
    alert_rule_test:
      - alertname: BridgeAgentOffline
        eval_time: 14m
        exp_alerts: []
      - alertname: BridgeAgentOffline
        eval_time: 15m
        exp_alerts:
          - exp_labels:
              tenant_id: "11111111-1111-4111-8111-111111111111"
              centre_id: "centre-a"
              agent_id: "agent-01"
              severity: "warn"
              team: "ops"
            exp_annotations:
              summary: "Bridge agent agent-01 (tenant 11111111-1111-4111-8111-111111111111, centre centre-a) offline for 15 min."
              runbook_url: "infra/runbooks/instruments.md#bridgeagentoffline"
      - alertname: BridgeAgentOfflineLong
        eval_time: 59m
        exp_alerts: []
      - alertname: BridgeAgentOfflineLong
        eval_time: 60m
        exp_alerts:
          - exp_labels:
              tenant_id: "11111111-1111-4111-8111-111111111111"
              centre_id: "centre-a"
              agent_id: "agent-01"
              severity: "page"
              team: "ops"
              notify_tenant: "true"
            exp_annotations:
              summary: "Bridge agent agent-01 (tenant 11111111-1111-4111-8111-111111111111, centre centre-a) offline for 60 min."
              runbook_url: "infra/runbooks/instruments.md#bridgeagentofflinelong"

  - interval: 1m
    name: agent not offline (state 0) - neither offline alert
    input_series:
      - series: 'lims_instruments_agent_state{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01",state="offline"}'
        values: "0x70"
    alert_rule_test:
      - alertname: BridgeAgentOffline
        eval_time: 20m
        exp_alerts: []
      - alertname: BridgeAgentOfflineLong
        eval_time: 65m
        exp_alerts: []

  - interval: 1m
    name: same agent exported by worker-a and worker-b - exactly ONE alert each
    input_series:
      - series: 'lims_instruments_agent_state{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01",state="offline",service="worker-a"}'
        values: "1x70"
      - series: 'lims_instruments_agent_state{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01",state="offline",service="worker-b"}'
        values: "1x70"
    alert_rule_test:
      - alertname: BridgeAgentOffline
        eval_time: 15m
        exp_alerts:
          - exp_labels:
              tenant_id: "11111111-1111-4111-8111-111111111111"
              centre_id: "centre-a"
              agent_id: "agent-01"
              severity: "warn"
              team: "ops"
            exp_annotations:
              summary: "Bridge agent agent-01 (tenant 11111111-1111-4111-8111-111111111111, centre centre-a) offline for 15 min."
              runbook_url: "infra/runbooks/instruments.md#bridgeagentoffline"
      - alertname: BridgeAgentOfflineLong
        eval_time: 60m
        exp_alerts:
          - exp_labels:
              tenant_id: "11111111-1111-4111-8111-111111111111"
              centre_id: "centre-a"
              agent_id: "agent-01"
              severity: "page"
              team: "ops"
              notify_tenant: "true"
            exp_annotations:
              summary: "Bridge agent agent-01 (tenant 11111111-1111-4111-8111-111111111111, centre centre-a) offline for 60 min."
              runbook_url: "infra/runbooks/instruments.md#bridgeagentofflinelong"

  - interval: 1m
    name: worker-a stale at 0, worker-b reports offline - still fires once (max wins)
    input_series:
      - series: 'lims_instruments_agent_state{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01",state="offline",service="worker-a"}'
        values: "0x70"
      - series: 'lims_instruments_agent_state{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01",state="offline",service="worker-b"}'
        values: "1x70"
    alert_rule_test:
      - alertname: BridgeAgentOffline
        eval_time: 10m
        exp_alerts: []
      - alertname: BridgeAgentOffline
        eval_time: 15m
        exp_alerts:
          - exp_labels:
              tenant_id: "11111111-1111-4111-8111-111111111111"
              centre_id: "centre-a"
              agent_id: "agent-01"
              severity: "warn"
              team: "ops"
            exp_annotations:
              summary: "Bridge agent agent-01 (tenant 11111111-1111-4111-8111-111111111111, centre centre-a) offline for 15 min."
              runbook_url: "infra/runbooks/instruments.md#bridgeagentoffline"

  - interval: 1m
    name: two distinct agents offline - two alerts, one per agent
    input_series:
      - series: 'lims_instruments_agent_state{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01",state="offline",service="worker-a"}'
        values: "1x30"
      - series: 'lims_instruments_agent_state{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01",state="offline",service="worker-b"}'
        values: "1x30"
      - series: 'lims_instruments_agent_state{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-02",state="offline",service="worker-a"}'
        values: "1x30"
      - series: 'lims_instruments_agent_state{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-02",state="offline",service="worker-b"}'
        values: "1x30"
    alert_rule_test:
      - alertname: BridgeAgentOffline
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              tenant_id: "11111111-1111-4111-8111-111111111111"
              centre_id: "centre-a"
              agent_id: "agent-01"
              severity: "warn"
              team: "ops"
            exp_annotations:
              summary: "Bridge agent agent-01 (tenant 11111111-1111-4111-8111-111111111111, centre centre-a) offline for 15 min."
              runbook_url: "infra/runbooks/instruments.md#bridgeagentoffline"
          - exp_labels:
              tenant_id: "11111111-1111-4111-8111-111111111111"
              centre_id: "centre-a"
              agent_id: "agent-02"
              severity: "warn"
              team: "ops"
            exp_annotations:
              summary: "Bridge agent agent-02 (tenant 11111111-1111-4111-8111-111111111111, centre centre-a) offline for 15 min."
              runbook_url: "infra/runbooks/instruments.md#bridgeagentoffline"

  - interval: 1m
    name: backlog - fires at 30m, not before
    input_series:
      - series: 'lims_instruments_agent_state{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01",state="backlog"}'
        values: "1x40"
    alert_rule_test:
      - alertname: BridgeAgentBacklog
        eval_time: 29m
        exp_alerts: []
      - alertname: BridgeAgentBacklog
        eval_time: 30m
        exp_alerts:
          - exp_labels:
              tenant_id: "11111111-1111-4111-8111-111111111111"
              centre_id: "centre-a"
              agent_id: "agent-01"
              severity: "warn"
              team: "ops"
            exp_annotations:
              summary: "Bridge agent agent-01 (tenant 11111111-1111-4111-8111-111111111111) has a backlog for 30 min."
              runbook_url: "infra/runbooks/instruments.md#bridgeagentbacklog"

  - interval: 1m
    name: backlog cleared (state 0) - not firing
    input_series:
      - series: 'lims_instruments_agent_state{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01",state="backlog"}'
        values: "0x40"
    alert_rule_test:
      - alertname: BridgeAgentBacklog
        eval_time: 35m
        exp_alerts: []

  - interval: 1m
    name: degraded - fires at 30m, not before
    input_series:
      - series: 'lims_instruments_agent_state{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01",state="degraded"}'
        values: "1x40"
    alert_rule_test:
      - alertname: BridgeAgentDegraded
        eval_time: 29m
        exp_alerts: []
      - alertname: BridgeAgentDegraded
        eval_time: 30m
        exp_alerts:
          - exp_labels:
              tenant_id: "11111111-1111-4111-8111-111111111111"
              centre_id: "centre-a"
              agent_id: "agent-01"
              severity: "warn"
              team: "ops"
            exp_annotations:
              summary: "Bridge agent agent-01 (tenant 11111111-1111-4111-8111-111111111111) degraded for 30 min."
              runbook_url: "infra/runbooks/instruments.md#bridgeagentdegraded"

  - interval: 1m
    name: degraded cleared (state 0) - not firing
    input_series:
      - series: 'lims_instruments_agent_state{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01",state="degraded"}'
        values: "0x40"
    alert_rule_test:
      - alertname: BridgeAgentDegraded
        eval_time: 35m
        exp_alerts: []

  - interval: 1m
    name: clock offset +200 s - fires at 30m, not before
    input_series:
      - series: 'lims_instruments_agent_clock_offset_seconds{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01"}'
        values: "200x40"
    alert_rule_test:
      - alertname: BridgeAgentClockOffset
        eval_time: 29m
        exp_alerts: []
      - alertname: BridgeAgentClockOffset
        eval_time: 30m
        exp_alerts:
          - exp_labels:
              tenant_id: "11111111-1111-4111-8111-111111111111"
              centre_id: "centre-a"
              agent_id: "agent-01"
              severity: "info"
              team: "ops"
            exp_annotations:
              summary: "Bridge agent agent-01 clock offset above 120 s."
              runbook_url: "infra/runbooks/instruments.md#bridgeagentclockoffset"

  - interval: 1m
    name: clock offset -300 s (abs) fires
    input_series:
      - series: 'lims_instruments_agent_clock_offset_seconds{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01"}'
        values: "-300x40"
    alert_rule_test:
      - alertname: BridgeAgentClockOffset
        eval_time: 30m
        exp_alerts:
          - exp_labels:
              tenant_id: "11111111-1111-4111-8111-111111111111"
              centre_id: "centre-a"
              agent_id: "agent-01"
              severity: "info"
              team: "ops"
            exp_annotations:
              summary: "Bridge agent agent-01 clock offset above 120 s."
              runbook_url: "infra/runbooks/instruments.md#bridgeagentclockoffset"

  - interval: 1m
    name: clock offset 50 s - not firing
    input_series:
      - series: 'lims_instruments_agent_clock_offset_seconds{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01"}'
        values: "50x40"
    alert_rule_test:
      - alertname: BridgeAgentClockOffset
        eval_time: 35m
        exp_alerts: []

  - interval: 1m
    name: no agent_state series at all - MetricsAbsent fires at 10m, not before
    input_series:
      - series: 'up{job="synthetic"}'
        values: "1x20"
    alert_rule_test:
      - alertname: BridgeAgentMetricsAbsent
        eval_time: 9m
        exp_alerts: []
      - alertname: BridgeAgentMetricsAbsent
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              severity: "warn"
              team: "ops"
            exp_annotations:
              summary: "No lims_instruments_agent_state series from worker-a/b for 10 min although c7_metrics_live is true."
              runbook_url: "infra/runbooks/instruments.md#bridgeagentmetricsabsent"

  - interval: 1m
    name: agent_state present - MetricsAbsent not firing
    input_series:
      - series: 'lims_instruments_agent_state{tenant_id="11111111-1111-4111-8111-111111111111",centre_id="centre-a",agent_id="agent-01",state="offline"}'
        values: "0x20"
    alert_rule_test:
      - alertname: BridgeAgentMetricsAbsent
        eval_time: 15m
        exp_alerts: []

  - interval: 1m
    name: lims_instruments_agent_update_failures_total increases - InstrumentsAgentUpdateFailed fires at once
    input_series:
      - series: 'lims_instruments_agent_update_failures_total'
        values: "0x4 1x20"
    alert_rule_test:
      - alertname: InstrumentsAgentUpdateFailed
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              severity: "page"
              team: "ops"
            exp_annotations:
              summary: "A bridge agent update failed in the last 15 min."
              runbook_url: "infra/runbooks/instruments.md#instrumentsagentupdatefailed"

  - interval: 1m
    name: lims_instruments_agent_update_failures_total flat - not firing
    input_series:
      - series: 'lims_instruments_agent_update_failures_total'
        values: "5x30"
    alert_rule_test:
      - alertname: InstrumentsAgentUpdateFailed
        eval_time: 20m
        exp_alerts: []

  - interval: 1m
    name: lims_instruments_agent_config_rejections_total increases - InstrumentsAgentConfigRejected fires at once
    input_series:
      - series: 'lims_instruments_agent_config_rejections_total'
        values: "0x4 1x20"
    alert_rule_test:
      - alertname: InstrumentsAgentConfigRejected
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              severity: "page"
              team: "ops"
            exp_annotations:
              summary: "A bridge agent rejected a config in the last 15 min (possible tampering)."
              runbook_url: "infra/runbooks/instruments.md#instrumentsagentconfigrejected"

  - interval: 1m
    name: lims_instruments_agent_config_rejections_total flat - not firing
    input_series:
      - series: 'lims_instruments_agent_config_rejections_total'
        values: "5x30"
    alert_rule_test:
      - alertname: InstrumentsAgentConfigRejected
        eval_time: 20m
        exp_alerts: []

  - interval: 1m
    name: device auth failures 1/s - pending 5m, fires after
    input_series:
      - series: 'lims_instruments_device_auth_failures_total'
        values: "0+60x30"
    alert_rule_test:
      - alertname: InstrumentsDeviceAuthFailureSpike
        eval_time: 3m
        exp_alerts: []
      - alertname: InstrumentsDeviceAuthFailureSpike
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              severity: "page"
              team: "ops"
            exp_annotations:
              summary: "Device auth failures above 0.1/s for 5 min (security)."
              runbook_url: "infra/runbooks/instruments.md#instrumentsdeviceauthfailurespike"

  - interval: 1m
    name: device auth failures 1 per min (below 0.1/s) - not firing
    input_series:
      - series: 'lims_instruments_device_auth_failures_total'
        values: "0+1x30"
    alert_rule_test:
      - alertname: InstrumentsDeviceAuthFailureSpike
        eval_time: 20m
        exp_alerts: []

  - interval: 1m
    name: 10 pct quarantined - fires after 1h, not before
    input_series:
      - series: 'lims_instruments_ingest_messages_total{outcome="quarantined"}'
        values: "0+10x150"
      - series: 'lims_instruments_ingest_messages_total{outcome="ok"}'
        values: "0+90x150"
    alert_rule_test:
      - alertname: InstrumentsQuarantineRate
        eval_time: 30m
        exp_alerts: []
      - alertname: InstrumentsQuarantineRate
        eval_time: 90m
        exp_alerts:
          - exp_labels:
              severity: "warn"
              team: "ops"
            exp_annotations:
              summary: "More than 5 % of ingested instrument messages quarantined."
              runbook_url: "infra/runbooks/instruments.md#instrumentsquarantinerate"

  - interval: 1m
    name: 1 pct quarantined - not firing
    input_series:
      - series: 'lims_instruments_ingest_messages_total{outcome="quarantined"}'
        values: "0+1x150"
      - series: 'lims_instruments_ingest_messages_total{outcome="ok"}'
        values: "0+99x150"
    alert_rule_test:
      - alertname: InstrumentsQuarantineRate
        eval_time: 90m
        exp_alerts: []

  - interval: 1m
    name: attachment quarantined count rises - fires at once
    input_series:
      - series: 'lims_instruments_attachment_scans_total{outcome="quarantined"}'
        values: "0x4 1x20"
    alert_rule_test:
      - alertname: InstrumentsAttachmentQuarantined
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              outcome: "quarantined"
              severity: "page"
              team: "ops"
            exp_annotations:
              summary: "An instrument attachment was quarantined (security)."
              runbook_url: "infra/runbooks/instruments.md#instrumentsattachmentquarantined"

  - interval: 1m
    name: only clean scans rise, quarantined flat - not firing
    input_series:
      - series: 'lims_instruments_attachment_scans_total{outcome="clean"}'
        values: "0+5x30"
      - series: 'lims_instruments_attachment_scans_total{outcome="quarantined"}'
        values: "2x30"
    alert_rule_test:
      - alertname: InstrumentsAttachmentQuarantined
        eval_time: 20m
        exp_alerts: []

  - interval: 1m
    name: ingest batches all in (1 s, 5 s] bucket, p95 4.8 s - fires after 15m, not before
    input_series:
      - series: 'lims_instruments_ingest_batch_duration_seconds_bucket{le="1"}'
        values: "0x40"
      - series: 'lims_instruments_ingest_batch_duration_seconds_bucket{le="5"}'
        values: "0+10x40"
      - series: 'lims_instruments_ingest_batch_duration_seconds_bucket{le="+Inf"}'
        values: "0+10x40"
    alert_rule_test:
      - alertname: InstrumentsIngestSlow
        eval_time: 10m
        exp_alerts: []
      - alertname: InstrumentsIngestSlow
        eval_time: 30m
        exp_alerts:
          - exp_labels:
              severity: "warn"
              team: "ops"
            exp_annotations:
              summary: "Instrument ingest batch p95 above 3 s for 15 min."
              runbook_url: "infra/runbooks/instruments.md#instrumentsingestslow"

  - interval: 1m
    name: ingest batches all under 1 s, p95 0.95 s - not firing
    input_series:
      - series: 'lims_instruments_ingest_batch_duration_seconds_bucket{le="1"}'
        values: "0+10x40"
      - series: 'lims_instruments_ingest_batch_duration_seconds_bucket{le="5"}'
        values: "0+10x40"
      - series: 'lims_instruments_ingest_batch_duration_seconds_bucket{le="+Inf"}'
        values: "0+10x40"
    alert_rule_test:
      - alertname: InstrumentsIngestSlow
        eval_time: 30m
        exp_alerts: []
