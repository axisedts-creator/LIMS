# T-21 (tester, LD-39): promtool tests for ../partners.rules.yml. Synthetic series only (no real tenant or patient data).
# Per alert one firing case (labels carry the rule's severity and team), one not-firing case, and for rules with a
# `for` clause a pending-before-`for` + firing-after-`for` check. Thresholds are the owner's (02-TRD s11.3).
rule_files:
  - ../partners.rules.yml
evaluation_interval: 1m
tests:

  - interval: 1m
    name: "PartnersConversionFailures fires"
    input_series:
      - series: 'lims_partners_line_conversions_total{outcome="failed_infra"}'
        values: "0+1x30"
    alert_rule_test:
      - alertname: PartnersConversionFailures
        eval_time: 27m
        exp_alerts:
          - exp_labels: {severity: "warn", team: "ops"}
            exp_annotations: {summary: "More than 5 manifest line conversions failed (infra) in 15 min.", runbook_url: "infra/runbooks/partners.md#partnersconversionfailures"}

  - interval: 1m
    name: "PartnersConversionFailures quiet"
    input_series:
      - series: 'lims_partners_line_conversions_total{outcome="failed_infra"}'
        values: "0+0x30"
      - series: 'lims_partners_line_conversions_total{outcome="ok"}'
        values: "0+5x30"
    alert_rule_test:
      - alertname: PartnersConversionFailures
        eval_time: 27m
        exp_alerts: []

  - interval: 1m
    name: "PartnersConsumerMismatch fires"
    input_series:
      - series: 'lims_partners_events_consumed_total{outcome="mismatch"}'
        values: "0+1x30"
    alert_rule_test:
      - alertname: PartnersConsumerMismatch
        eval_time: 27m
        exp_alerts:
          - exp_labels: {severity: "page", team: "ops"}
            exp_annotations: {summary: "A partner event consumer saw a mismatch (possible wrong partner attribution).", runbook_url: "infra/runbooks/partners.md#partnersconsumermismatch"}

  - interval: 1m
    name: "PartnersConsumerMismatch quiet"
    input_series:
      - series: 'lims_partners_events_consumed_total{outcome="mismatch"}'
        values: "0+0x30"
      - series: 'lims_partners_events_consumed_total{outcome="ok"}'
        values: "0+5x30"
    alert_rule_test:
      - alertname: PartnersConsumerMismatch
        eval_time: 27m
        exp_alerts: []

  - interval: 1m
    name: "PartnersDownloadDeniedSpike fires"
    input_series:
      - series: 'lims_partners_report_downloads_total{outcome="denied"}'
        values: "0+5x25"
    alert_rule_test:
      - alertname: PartnersDownloadDeniedSpike
        eval_time: 22m
        exp_alerts:
          - exp_labels: {severity: "warn", team: "ops"}
            exp_annotations: {summary: "More than 20 partner report downloads denied in 10 min (id guessing).", runbook_url: "infra/runbooks/partners.md#partnersdownloaddeniedspike"}

  - interval: 1m
    name: "PartnersDownloadDeniedSpike quiet"
    input_series:
      - series: 'lims_partners_report_downloads_total{outcome="denied"}'
        values: "0+0x25"
      - series: 'lims_partners_report_downloads_total{outcome="ok"}'
        values: "0+50x25"
    alert_rule_test:
      - alertname: PartnersDownloadDeniedSpike
        eval_time: 22m
        exp_alerts: []

  - interval: 1m
    name: "PartnersStatementsProjectionStale fires"
    input_series:
      - series: 'lims_partners_projection_lag_seconds{projection="statements"}'
        values: "10801x15"
    alert_rule_test:
      - alertname: PartnersStatementsProjectionStale
        eval_time: 12m
        exp_alerts:
          - exp_labels: {severity: "warn", team: "ops"}
            exp_annotations: {summary: "Partner statements projection lag above 3 h.", runbook_url: "infra/runbooks/partners.md#partnersstatementsprojectionstale"}

  - interval: 1m
    name: "PartnersStatementsProjectionStale quiet"
    input_series:
      - series: 'lims_partners_projection_lag_seconds{projection="statements"}'
        values: "10800x15"
      - series: 'lims_partners_projection_lag_seconds{projection="price_list"}'
        values: "99999x15"
    alert_rule_test:
      - alertname: PartnersStatementsProjectionStale
        eval_time: 12m
        exp_alerts: []

  - interval: 1m
    name: "PartnersPriceListProjectionStale fires"
    input_series:
      - series: 'lims_partners_projection_lag_seconds{projection="price_list"}'
        values: "93601x15"
    alert_rule_test:
      - alertname: PartnersPriceListProjectionStale
        eval_time: 12m
        exp_alerts:
          - exp_labels: {severity: "warn", team: "ops"}
            exp_annotations: {summary: "Partner price list projection lag above 26 h.", runbook_url: "infra/runbooks/partners.md#partnerspricelistprojectionstale"}

  - interval: 1m
    name: "PartnersPriceListProjectionStale quiet"
    input_series:
      - series: 'lims_partners_projection_lag_seconds{projection="price_list"}'
        values: "93600x15"
      - series: 'lims_partners_projection_lag_seconds{projection="statements"}'
        values: "999999x15"
    alert_rule_test:
      - alertname: PartnersPriceListProjectionStale
        eval_time: 12m
        exp_alerts: []

  - interval: 1m
    name: "PartnersDeadLetter fires"
    input_series:
      - series: 'lims_core_dead_letters_total{task="evt.partners.statement"}'
        values: "0+1x15"
    alert_rule_test:
      - alertname: PartnersDeadLetter
        eval_time: 12m
        exp_alerts:
          - exp_labels: {severity: "warn", team: "ops", task: "evt.partners.statement"}
            exp_annotations: {summary: "A partners job or event consumer dead-lettered.", runbook_url: "infra/runbooks/partners.md#partnersdeadletter"}

  - interval: 1m
    name: "PartnersDeadLetter quiet"
    input_series:
      - series: 'lims_core_dead_letters_total{task="evt.partners.statement"}'
        values: "0+0x15"
      - series: 'lims_core_dead_letters_total{task="lab.x"}'
        values: "0+1x15"
    alert_rule_test:
      - alertname: PartnersDeadLetter
        eval_time: 12m
        exp_alerts: []
