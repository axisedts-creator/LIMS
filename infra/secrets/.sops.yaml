---
# SOPS creation rules (02-TRD s8). age PUBLIC recipients only, one per env;
# never a private key here. The encrypted files themselves live in the
# separate lims-secrets repo on ops-1 (02-TRD s8.2), not in this repo.
# [CONV] The recipients below are PLACEHOLDERS (not valid bech32, so sops
# refuses them = fail closed). Replace with the real public keys at the
# key ceremony (prod: founder + ops lead; staging/dev: separate keys).
creation_rules:
  - path_regex: '(^|/)dev\.enc\.yaml$'
    age: age1placeholderdevrecipientreplaceatkeyceremony000000000000000
  - path_regex: '(^|/)staging\.enc\.yaml$'
    age: age1placeholderstagingrecipientreplaceatkeyceremony00000000000
  - path_regex: '(^|/)prod\.enc\.yaml$'
    age: age1placeholderprodrecipientreplaceatkeyceremony00000000000000
