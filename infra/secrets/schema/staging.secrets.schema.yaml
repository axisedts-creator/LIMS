---
# Secrets schema, env staging (02-TRD s8.2). Names, owners, consumers,
# rules, rotation only - NEVER a value. Values live encrypted in lims-secrets
# (staging.enc.yaml); UAT provider values only (REQ-SEC-136);
# CI checks that file has exactly these ids.
# Per-env values, never shared across envs. Same id set in dev/staging/prod.
# exposure: env = plain env-file exception (02-TRD s8.3, AC-19.1); every
# other id is mounted as a file (*_FILE / compose secrets).
# Default rotation [CONV] (02-TRD s8.5): DB passwords 180 d, API/HMAC keys
# 365 d, immediately on any suspected exposure.
env: staging
secrets:
  # --- Upstream Supabase (.env.example of the pinned snapshot, T-05) ---
  # Keys/JWTs from the snapshot's docker/utils/generate-keys.sh on ops-1.
  # Consumers marked (T-05) are resolved against UPSTREAM.lock.
  - id: POSTGRES_PASSWORD
    owner: C1
    consumers: [db, auth, rest, storage, pgbouncer]
    format: random string, generate-keys.sh
    rotation_days: 180
    rotation_rule: add-then-switch, rolling restart of consumers
    exposure: env
  - id: JWT_SECRET
    owner: C1
    consumers: [auth, rest, storage, api-gw]
    length: ">= 32 chars"
    rotation_rule: C2/C0 JWT runbook, dual keys during overlap (s8.5 item 3)
    exposure: env
  - id: ANON_KEY
    owner: C1
    consumers: [api-gw, auth, rest, storage]
    format: JWT signed with JWT_SECRET, generate-keys.sh
    rotation_rule: with JWT_SECRET
    exposure: env
  - id: SERVICE_ROLE_KEY
    owner: C1
    consumers: [api-gw, auth, rest, storage]
    format: JWT signed with JWT_SECRET, generate-keys.sh
    rotation_rule: with JWT_SECRET
    exposure: env
  - id: SUPABASE_PUBLISHABLE_KEY
    owner: C1
    consumers: "upstream services referencing it (T-05)"
    format: generate-keys.sh output
    rotation_rule: with the JWT signing keys
    exposure: env
  - id: SUPABASE_SECRET_KEY
    owner: C1
    consumers: "upstream services referencing it (T-05)"
    format: generate-keys.sh output
    rotation_rule: with the JWT signing keys
    exposure: env
  - id: JWT_KEYS
    owner: C1
    consumers: "upstream services referencing it (T-05)"
    format: generate-keys.sh output
    rotation_rule: C2/C0 JWT runbook, dual keys during overlap
    exposure: env
  - id: JWT_JWKS
    owner: C1
    consumers: "upstream services referencing it (T-05)"
    format: generate-keys.sh output (public JWKS of JWT_KEYS)
    rotation_rule: with JWT_KEYS
    exposure: env
  - id: DASHBOARD_USERNAME
    owner: C1
    consumers: [studio]
    format: identifier, break-glass only (s7.10)
    rotation_days: 365
    exposure: env
  - id: DASHBOARD_PASSWORD
    owner: C1
    consumers: [studio]
    format: random string
    rotation_days: 365
    rotation_rule: also after every break-glass use
    exposure: env
  - id: SECRET_KEY_BASE
    owner: C1
    consumers: "upstream services referencing it (T-05)"
    length: ">= 64 chars"
    rotation_days: 365
    exposure: env
  - id: REALTIME_DB_ENC_KEY
    owner: C1
    consumers: [realtime]
    length: "exactly 16 chars"
    rotation_days: 365
    exposure: env
  - id: VAULT_ENC_KEY
    owner: C1
    consumers: "upstream services referencing it (T-05)"
    length: "exactly 32 chars"
    rotation_days: 365
    exposure: env
  - id: PG_META_CRYPTO_KEY
    owner: C1
    consumers: [meta]
    length: ">= 32 chars"
    rotation_days: 365
    exposure: env
  - id: LOGFLARE_PUBLIC_ACCESS_TOKEN
    owner: C1
    consumers: "none (add-on unused; value replaced anyway)"
    format: random string
    rotation_days: 365
    exposure: env
  - id: LOGFLARE_PRIVATE_ACCESS_TOKEN
    owner: C1
    consumers: "none (add-on unused; value replaced anyway)"
    length: ">= 32 chars"
    rotation_days: 365
    exposure: env
  - id: S3_PROTOCOL_ACCESS_KEY_ID
    owner: C1
    consumers: [storage]
    format: identifier
    rotation_days: 365
    exposure: env
  - id: S3_PROTOCOL_ACCESS_KEY_SECRET
    owner: C1
    consumers: [storage]
    format: random string
    rotation_days: 365
    exposure: env
  - id: MINIO_ROOT_PASSWORD
    owner: C1
    consumers: "none (unused; value replaced anyway)"
    format: random string
    rotation_days: 365
    exposure: env
  - id: POOLER_TENANT_ID
    owner: C1
    consumers: "upstream services referencing it (T-05)"
    format: identifier
    rotation_rule: on change only
    exposure: env
  - id: SMTP_USER
    owner: C1
    consumers: [auth]
    format: relay account name (same pair as smtp_relay_gotrue)
    rotation_days: 365
    exposure: env
  - id: SMTP_PASS
    owner: C1
    consumers: [auth]
    format: relay password (same pair as smtp_relay_gotrue)
    rotation_days: 365
    exposure: env

  # --- LIMS DB role passwords (C0 07-SECURITY s6; ops roles s7.8) ---
  - id: lims_migrator_password
    owner: C0
    consumers: [ops-1 deploy job (s7.9)]
    format: random string
    rotation_days: 180
    rotation_rule: ALTER ROLE then rolling restart of consumers (s8.5)
  - id: lims_api_password
    owner: C0
    consumers: [api-a, api-b]
    format: random string
    rotation_days: 180
    rotation_rule: ALTER ROLE then rolling restart of consumers (s8.5)
  - id: lims_worker_password
    owner: C0
    consumers: [worker-a, worker-b]
    format: random string
    rotation_days: 180
    rotation_rule: ALTER ROLE then rolling restart of consumers (s8.5)
  - id: lims_monitor_password
    owner: C1
    consumers: [postgres_exporter on data-1]
    format: random string
    rotation_days: 180
    rotation_rule: ALTER ROLE then rolling restart of consumers (s8.5)
  - id: lims_replicator_password
    owner: C1
    consumers: [dr-1 standby]
    format: random string
    rotation_days: 180
    rotation_rule: ALTER ROLE then rolling restart of consumers (s8.5)
  - id: lims_audit_ship_password
    owner: C1
    consumers: [audit store shipping (s10.3)]
    format: random string
    rotation_days: 180
    rotation_rule: ALTER ROLE then rolling restart of consumers (s8.5)

  # --- LIMS application keys ---
  - id: lims_core_jwt_key
    owner: C0
    consumers: [api-a, api-b]
    mount: LIMS_CORE_JWT_KEY_FILE
    format: key material per C0 02-TRD
    rotation_rule: C2/C0 runbook, dual keys during overlap (s8.5 item 3)
  - id: lims_core_ratelimit_key
    owner: C0
    consumers: [api-a, api-b]
    mount: LIMS_CORE_RATELIMIT_KEY_FILE
    format: random key per C0 02-TRD
    rotation_days: 365
  - id: lims_identity_token_enc_key
    owner: C2
    consumers: [api-a, api-b]
    mount: LIMS_IDENTITY_TOKEN_ENC_KEY
    format: key per C2 07-SECURITY
    rotation_days: 365
  - id: lims_identity_gotrue_service_key
    owner: C2
    consumers: [api-a, api-b]
    mount: LIMS_IDENTITY_GOTRUE_SERVICE_KEY
    format: key per C2 07-SECURITY
    rotation_rule: with the Supabase key rotation (s8.5 item 4)

  # --- C1 platform secrets ---
  - id: pgbackrest_repo1_cipher_pass
    owner: C1
    consumers: [data-1 pgbackrest, ops-1 restore drill]
    mount: repo1-cipher-pass
    format: random string, different from repo2
    rotation_rule: new repo/stanza + new full backup; old kept (s8.5 item 5)
  - id: pgbackrest_repo2_cipher_pass
    owner: C1
    consumers: [data-1 pgbackrest, ops-1 restore drill]  # never dr-1 (AC-12.3)
    mount: repo2-cipher-pass
    format: random string, different from repo1
    rotation_rule: new repo/stanza + new full backup; old kept (s8.5 item 5)
  - id: repo2_sftp_private_key
    owner: C1
    consumers: [data-1 pgbackrest]
    format: SSH private key for the repo2 SFTP target on dr-1
    rotation_days: 365
  - id: object_replica_ssh_key
    owner: C1
    consumers: [app-1 object replica job]
    format: SSH private key for the dr-1 replica target
    rotation_days: 365
  - id: luks_keyfiles
    owner: C1
    consumers: [each VM, its own keyfile only]
    format: random keyfile per host and volume
    rotation_rule: on compromise or host rebuild
  - id: registry_htpasswd
    owner: C1
    consumers: [ops-1 registry, product hosts pulling images]
    format: htpasswd (bcrypt)
    rotation_days: 365
  - id: grafana_admin_password
    owner: C1
    consumers: [ops-1 grafana]
    format: random string
    rotation_days: 365
  - id: grafana_users
    owner: C1
    consumers: [ops-1 grafana]
    format: user list with random passwords
    rotation_days: 365
  - id: ops_nginx_basic_auth
    owner: C1
    consumers: [ops-1 ops nginx]
    format: htpasswd (bcrypt)
    rotation_days: 365
  - id: alertmanager_smtp_relay
    owner: C1
    consumers: [ops-1 alertmanager]
    format: relay user + password
    rotation_days: 365
  - id: wireguard_private_keys
    owner: C1
    consumers: [each VM, its own key only]
    format: WireGuard private key, generated on the host
    rule: never leaves its host; only public keys in inventory
    rotation_rule: on compromise or host rebuild

  # --- Ids added by the review fix pass (02-TRD s8.2 table) ---
  - id: valkey_lims_api_password
    owner: C1
    consumers: [valkey ACL user lims_api, api-a, api-b, worker-a, worker-b]
    mount: LIMS_CORE_REDIS_URL (env-file exception until C0 adds _FILE)
    format: random string
    rotation_days: 365
    # Valkey ACL password, not a PostgreSQL role: the 180 d DB-password
    # default does not apply; 365 d per the s8.2 table.
    exposure: env
  - id: bff_key_staff_web
    owner: C1
    consumers: [api-a, api-b, web]
    mount: LIMS_CORE_BFF_KEY_FILES (api), LIMS_WEB_BFF_KEY_FILE
    format: random key [CONV]
    rotation_days: 365
    rotation_rule: core accepts old + new during the overlap
  - id: bff_key_partner
    owner: C13
    consumers: [api-a, api-b, partner]
    mount: LIMS_CORE_BFF_KEY_FILES (api), LIMS_PARTNER_BFF_KEY_FILE
    format: random key [CONV]
    rotation_days: 365
    rotation_rule: core accepts old + new during the overlap
  - id: bff_key_portal
    owner: C6
    consumers: [api-a, api-b, portal]
    mount: LIMS_CORE_BFF_KEY_FILES (api), LIMS_PORTAL_BFF_KEY_FILE
    format: random key [CONV]
    rotation_days: 365
    rotation_rule: core accepts old + new during the overlap
  - id: reporting_otp_hmac_key
    owner: C6
    consumers: [api-a, api-b, worker-a, worker-b]
    mount: LIMS_REPORTING_OTP_HMAC_KEY_FILE
    length: ">= 32 random bytes"
    rotation_days: 365
    rotation_rule: C6 runbook; open challenges expire <= 10 min
  - id: renderer_inbound_token
    owner: C6
    consumers: [worker-a, worker-b, renderer]
    mount: LIMS_REPORTING_RENDERER_TOKEN_FILE, LIMS_RENDERER_TOKEN_FILE
    format: random token
    rotation_days: 365
  - id: pdf_sandbox_inbound_token
    owner: C6
    consumers: [worker-a, worker-b, pdf-sandbox]
    mount: LIMS_REPORTING_SANDBOX_TOKEN_FILE, LIMS_RENDER_SANDBOX_TOKEN_FILE
    format: random token (the sandbox's only secret)
    rotation_days: 365
  - id: core_storage_service_key
    owner: C0
    consumers: [api-a, api-b, worker-a, worker-b]
    mount: LIMS_CORE_STORAGE_KEY_FILE (C0 core storage adapter only)
    format: Storage service credential of the pinned snapshot
    rule: which upstream key is fixed by C0 SP-1 / C1 T-05 (UNVERIFIED)
    rotation_rule: with the Storage stack key rotation (s8.5 item 4)
  - id: "reporting_channel_<secret_ref>"
    owner: C6
    consumers: [worker-a, worker-b]
    format: C6 channel account credential, one id per secret_ref
    rule: real values in prod only (REQ-SEC-136)
    rotation_rule: per C6 TRD
  - id: instruments_config_signing_key
    owner: C7
    consumers: [api-a, api-b, worker-a, worker-b]
    format: signing key + key id
    rotation_rule: per C7 runbook (overlap key id)
  - id: instruments_release_signing_key
    owner: C7
    consumers: [ops-1 release service]
    format: signing key; never on a product host
    rotation_rule: on compromise / per C7 runbook
  - id: instruments_authenticode_cert
    owner: C7
    consumers: [ops-1 release service]
    format: client-owned code-signing certificate + key
    rotation_rule: at certificate expiry (client)
  - id: payments_kek
    owner: C15
    consumers: [api-a, api-b, worker-a, worker-b]
    mount: LIMS_PAYMENTS_KEK_FILE, read-only
    format: key-encryption key
    rotation_rule: add-new, set active, rewrap, remove old (s7.12)
  - id: internal_ca_key
    owner: C1
    consumers: [ops-1 internal_ca role]
    format: CA private key (ops nginx + registry TLS)
    rotation_rule: 5 years [CONV]; leaf certs 1 year
  - id: tenant_ops_contacts
    owner: C1
    consumers: [ops-1 alertmanager config renderer]
    format: map tenant_id to lab-ops e-mail (personal data)
    rotation_rule: on change
  - id: alert_contacts
    owner: C1
    consumers: [ops-1 alertmanager]
    format: on-call, escalation, finance on-call, Watchdog addresses
    rotation_rule: on change
  - id: smtp_relay_gotrue
    owner: C1
    consumers: [auth]
    format: relay credential pair = SMTP_USER / SMTP_PASS above
    rotation_days: 365
