packages:
  - packages/*
  # T0-03: contracts/ and tools/codegen declare npm deps; as workspace members their exact pins land in pnpm-lock.yaml (CV §15.1, REQ-SEC-129).
  - contracts
  - tools/codegen
  # LD-13 (2026-11-07): services/api (CR-C0-0D-002) and apps/web (CR-C0-0D-003) join the workspace.
  - services/*
  - apps/*
# T0-03 [CONV]: no dependency install scripts run; esbuild ships its binary via optional platform packages.
allowBuilds:
  '@scarf/scarf': set this to true or false
  esbuild: false
