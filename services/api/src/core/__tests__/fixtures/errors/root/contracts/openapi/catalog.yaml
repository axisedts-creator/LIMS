# Test-only spec for T0D-04 error-contract tests (not a real contract). All operations public so no security handlers are needed.
# Most operations declare NO error responses on purpose: the core must still answer problem+json (also with response validation on).
openapi: 3.0.3
info: { title: fixture catalog (errors), version: 1.0.0 }
paths:
  /v1/catalog/boom:
    get:
      operationId: boom
      security: []
      x-public: "fixture"
      x-idempotency: none
      x-rate-limit-tier: general
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object } } } }
  /v1/catalog/lims/{code}:
    get:
      operationId: limsError
      security: []
      x-public: "fixture"
      x-idempotency: none
      x-rate-limit-tier: general
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object } } } }
  /v1/catalog/detail:
