# C7 instruments alert rules for C1 to wire (02-TRD §13 "Alert rules for C1"; 08 A13 P-14; CR-C7-012).
# Agent-state alerts (BridgeAgent*) are C1's (C1 02-TRD §11.2 item 3) and are not repeated here.
# Routes are C1's receivers (C1 02-TRD §11.3): page -> oncall-email, warn -> ops-digest-email. Thresholds [CONV].
groups:
  - name: instruments
    rules:
      - alert: InstrumentsAgentUpdateFailed
        expr: increase(lims_instruments_agent_update_failures_total[15m]) > 0
        for: 0m
        labels: { severity: page, route: oncall-email }
      - alert: InstrumentsAgentConfigRejected
        expr: increase(lims_instruments_agent_config_rejections_total[15m]) > 0
        for: 0m
        labels: { severity: page, route: oncall-email }
        annotations: { summary: "Bridge agent rejected a signed configuration (possible tampering)" }
      - alert: InstrumentsDeviceAuthFailureSpike
        expr: sum(rate(lims_instruments_device_auth_failures_total[5m])) > 0.1
        for: 5m
        labels: { severity: page, route: oncall-email }
      - alert: InstrumentsQuarantineRate
        expr: sum(rate(lims_instruments_ingest_messages_total{outcome="quarantined"}[1h])) / sum(rate(lims_instruments_ingest_messages_total[1h])) > 0.05
        for: 1h
        labels: { severity: warn, route: ops-digest-email }
      - alert: InstrumentsAttachmentQuarantined
        expr: increase(lims_instruments_attachment_scans_total{outcome="quarantined"}[15m]) > 0
        for: 0m
        labels: { severity: page, route: oncall-email }
      - alert: InstrumentsIngestSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(lims_instruments_ingest_batch_duration_seconds_bucket[15m]))) > 3
        for: 15m
        labels: { severity: warn, route: ops-digest-email }
