# C12 alert rules for C1 (02-TRD §13 "Alert rules for C1"; CR-C12-011). C1 imports this file into infra/monitoring/rules/imported/ and adds only team and runbook_url (C1 02-TRD §11.3).
# expr / for / severity are the TRD values; `ci/import-rules.sh` + alert-import-drift compare expr and for.
groups:
  - name: inventory
    rules:
      - alert: InventoryConsumerFailing
        expr: >-
          sum by (event_type) (increase(lims_inventory_consumer_failures_total[15m]))
          > 0
        for: 15m
        labels:
          severity: page
        annotations:
          summary: An inventory event consumer has been failing for 15 min.
      - alert: InventoryConsumptionLagHigh
        expr: >-
          histogram_quantile(0.95, sum by (le, event_type) (rate(lims_inventory_consumption_lag_seconds_bucket[5m])))
          > 300
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: Inventory consumption lag p95 above 5 min for 15 min.
      - alert: InventoryBalanceDrift
        expr: >-
          max by (tenant_id) (lims_inventory_balance_drift_rows)
          > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: Inventory balances drift from the movement ledger.
      - alert: InventoryUnresolvedBacklog
        expr: >-
          max by (tenant_id) (lims_inventory_unresolved_oldest_age_seconds)
          > 86400
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: An unresolved inventory consumption is older than 24 h.
