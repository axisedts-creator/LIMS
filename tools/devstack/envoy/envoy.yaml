# Dev API gateway (Envoy). Routes as the Supabase gateway: /auth/v1 -> auth, /rest/v1 -> rest, /storage/v1 -> storage.
# The listener address is container-internal; host exposure is only compose.yaml's 127.0.0.1:8000:8000 (04 S6).
# ponytail: no apikey check at the gateway (dev, loopback only); GoTrue/PostgREST/Storage still verify JWTs. Add Envoy's
# upstream key-auth filter when a dev flow needs it.
static_resources:
  listeners:
    - name: http
      address: { socket_address: { address: 0.0.0.0, port_value: 8000 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: gw
                route_config:
                  virtual_hosts:
                    - name: supabase
                      domains: ["*"]
                      routes:
                        - { match: { prefix: /auth/v1/ }, route: { cluster: auth, prefix_rewrite: / } }
                        - { match: { prefix: /rest/v1/ }, route: { cluster: rest, prefix_rewrite: / } }
                        - { match: { prefix: /storage/v1/ }, route: { cluster: storage, prefix_rewrite: /, timeout: 0s } }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
  clusters:
    - { name: auth, type: STRICT_DNS, load_assignment: { cluster_name: auth, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: auth, port_value: 9999 } } } }] }] } }
    - { name: rest, type: STRICT_DNS, load_assignment: { cluster_name: rest, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: rest, port_value: 3000 } } } }] }] } }
    - { name: storage, type: STRICT_DNS, load_assignment: { cluster_name: storage, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: storage, port_value: 5000 } } } }] }] } }
