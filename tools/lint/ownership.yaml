# Path ownership (CM s3 "Repository layout and path ownership" + module table; 02-TRD s1.1).
# Owner: C0-0A. One owner per path; most specific pattern wins (longest literal prefix, then longest pattern).
# Glob: ** any depth, * one segment, {a,b} alternation, trailing / = /**. No catch-all rules.
