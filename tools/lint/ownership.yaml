    owner: C0-0A
  - pattern: "eslint.config.*"
    owner: C0-0A
  - pattern: ".prettierrc*"
    owner: C0-0A
  - pattern: ".nvmrc"
    owner: C0-0A
  - pattern: "turbo.json"
    owner: C0-0A
